nvidia-driver:
    candy:
        version: 2026.150.2158
        description: |
            NVIDIA open kernel driver + Wayland userspace for a VFIO GPU-passthrough CachyOS VM guest
            Installs the CachyOS prebuilt open kernel module
            (linux-cachyos-nvidia-open) + nvidia-utils, egl-wayland (KDE Wayland on
            NVIDIA), the OpenCL ICD, nvidia-settings and the VA-API driver;
            blacklists nouveau, enables nvidia-drm modeset=1, installs a boot-time
            CDI-generation oneshot, and requests a reboot. Guest/bare-host only
            (never in a container). Verifiable: the modprobe + CDI unit files land
            and the egl-wayland / opencl-nvidia packages install.
        reboot: true
        distro:
            arch:
                package:
                    - linux-cachyos-nvidia-open
                    - nvidia-utils
                    - egl-wayland
                    - opencl-nvidia
                    - nvidia-settings
                    - libva-nvidia-driver
        plan:
            - run: write=/etc/modprobe.d/charly-nvidia.conf
              write: /etc/modprobe.d/charly-nvidia.conf
              run_as: root
              mode: "0644"
              content: |
                # Belt-and-suspenders nouveau blacklist (the kernel cmdline does the
                # early one) + enable nvidia KMS.
                blacklist nouveau
                options nvidia-drm modeset=1
            - run: write=/etc/systemd/system/charly-nvidia-cdi.service
              write: /etc/systemd/system/charly-nvidia-cdi.service
              run_as: root
              mode: "0644"
              content: |
                [Unit]
                Description=Generate NVIDIA CDI spec once the GPU driver is loaded
                After=multi-user.target

                [Service]
                Type=oneshot
                RemainAfterExit=yes
                # Wait (bounded) for the GPU device node — the open module loads
                # early via nvidia-drm.modeset=1, usually well before this runs.
                ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do [ -e /dev/nvidia0 ] && exit 0; sleep 1; done; exit 0'
                ExecStart=/usr/bin/nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml

                [Install]
                WantedBy=multi-user.target
            - run: |
                command=systemctl daemon-reload || true
                systemctl enable charly-nvidia-cdi.service || true
              run_as: root
              command: |
                systemctl daemon-reload || true
                systemctl enable charly-nvidia-cdi.service || true
            - run: |
                command=u="$(getent passwd 1000 | cut -d: -f1)"
                [ -n "$u" ] && usermod -aG video,render "$u" || true
              run_as: root
              command: |
                u="$(getent passwd 1000 | cut -d: -f1)"
                [ -n "$u" ] && usermod -aG video,render "$u" || true
            - check: the nouveau blacklist + nvidia-drm modeset config is installed
              file:
                file: /etc/modprobe.d/charly-nvidia.conf
                contains: "blacklist nouveau"
            - check: the boot-time CDI-generation service is installed
              file:
                file: /etc/systemd/system/charly-nvidia-cdi.service
                contains: "nvidia-ctk cdi generate"
            - check: egl-wayland (the NVIDIA Wayland EGLStream platform) is installed
              package:
                package: egl-wayland
                installed: true
            - check: file=/etc/modprobe.d/charly-nvidia.conf
              id: nvidia-modprobe-conf
              file:
                file: /etc/modprobe.d/charly-nvidia.conf
                contains: "blacklist nouveau"
            - check: file=/etc/systemd/system/charly-nvidia-cdi.service
              id: nvidia-cdi-service
              file:
                file: /etc/systemd/system/charly-nvidia-cdi.service
                contains: "nvidia-ctk cdi generate"
            - check: package=egl-wayland
              id: egl-wayland-installed
              package:
                package: egl-wayland
                installed: true
            - check: package=opencl-nvidia
              id: opencl-nvidia-installed
              package:
                package: opencl-nvidia
                installed: true
