version: 2026.240.1943
punktfunk-client:
    candy:
        version: 2026.242.1635
        description: |
            The punktfunk streaming **client**: the `punktfunk-client` package and the
            headless `punktfunk` CLI it ships, installed from unom's signed pacman repo on
            Arch/CachyOS.

            Sibling of the `punktfunk` host candy, and deliberately the *other half* of it.
            The host candy proves punktfunk installs and answers; this one exists so a
            second system can actually pair with a host and pull a stream — the thing no
            single-node bed can demonstrate.

            ## What lands

            | Item | Value |
            |---|---|
            | Package | `punktfunk-client` |
            | Repo | `[punktfunk]` in `/etc/pacman.conf`, `SigLevel = Required DatabaseOptional` |
            | Key | fetched + `pacman-key --lsign-key`'d; fingerprint `E0CA04465C99C936E0B0C6510A317015A34DDD69` |
            | CLI | `punktfunk` — the headless client, driven by `/charly-check:punktfunk`'s client methods |
            | Distros | Arch **and** CachyOS — one `distro.arch:` section; the cachyos base declares `distro: [cachyos, arch]` |

            The repo and key are byte-identical to the host candy's on purpose: that half is
            already proven by the host beds, so anything that breaks here is the package,
            not the repo plumbing.

            ## `punktfunk` is the control CLI; `punktfunk-client` is the renderer

            The package ships three binaries, and they are not interchangeable:

            | Binary | Links | Role |
            |---|---|---|
            | `punktfunk` | libgcc, libm, libc — *nothing else* | control CLI |
            | `punktfunk-client` | 137 objects: libvulkan, libwayland-\*, libdrm, libgbm | the decoder |
            | `punktfunk-session` | — | session host |

            Everything that only talks to a host — `pair`, `hosts list`, `library`,
            `reachable`, `wake` — runs on the control binary and needs no display. But
            `launch` and `open` **spawn the renderer**, which is a Wayland client and needs
            both a compositor in the venue and a hardware Vulkan ICD. A venue that only ever
            pairs can stay a plain container; a venue that must pull a stream cannot.

            This is worth stating explicitly because the failure is silent in a misleading
            way: with no decoder reachable the client advertises codec `0x00`, the host
            answers `no shared video codec: client advertised 0x00, host can emit 0x01`, and
            the message reads like a host or driver defect. It is neither — it is the client
            accurately reporting that it has nothing to decode with.

            ## The CLI is the point

            `punktfunk-client` installs the headless `punktfunk` binary documented at
            <https://docs.punktfunk.unom.io/docs/clients>: `hosts list --probe`, `pair`,
            `launch`, `library --json`, `speed-test`, `open --yes`, `wake`, `reachable`,
            `profiles list`, `reset`. Drive it through the `punktfunk:` verb's client
            methods rather than a `command:` step — the verb maps the CLI's documented exit
            codes (2 connection failed, 3 trust rejected, 4 renderer failed, 5 no match,
            6 interactive required) to distinct verdicts, and keeps a pairing PIN on stdin
            instead of argv.

            ## Cross-References

            - `/charly-check:punktfunk` — the verb, including the client methods
            - `/charly-image:layer` — candy authoring (the `distro:` cascade)
        distro:
            # `arch` covers BOTH arch and cachyos — the cachyos base declares
            # `distro: [cachyos, arch]`, so the cascade resolves this section on either.
            arch:
                package:
                    - punktfunk-client
                    # The RENDERER needs a hardware Vulkan ICD. `punktfunk-client` pulls
                    # none, and a base that ships only `vulkan-swrast` (lavapipe) enumerates
                    # ZERO `VK_KHR_video*` extensions — so the client advertises codec 0x00
                    # and every host refuses the session. One ICD per open-source vendor,
                    # because the venue's GPU is not known at build time. (NVIDIA's
                    # proprietary stack ships its ICD in `nvidia-utils`, which a venue that
                    # needs it composes itself.)
                    - vulkan-radeon
                    - vulkan-intel
                    - vulkan-nouveau
                    # vulkaninfo, so decode capability is ASSERTABLE rather than assumed.
                    # Nothing checked it before, which is exactly why a client that could
                    # not decode looked healthy.
                    - vulkan-tools
                repo:
                    - name: punktfunk
                      # `$repo` / `$arch` are PACMAN variables, not shell ones: the pac
                      # install template emits this line inside a single-quoted printf,
                      # so they reach /etc/pacman.conf verbatim and pacman expands them.
                      server: "https://git.unom.io/api/packages/unom/arch/$repo/$arch"
                      key: "https://git.unom.io/api/packages/unom/arch/repository.key"
                      siglevel: "Required DatabaseOptional"
        plan:
            - check: the headless punktfunk client CLI is installed
              id: punktfunk-client-binary
              file:
                file: /usr/bin/punktfunk
                exists: true
            - check: the punktfunk-client package is recorded in the package database
              id: punktfunk-client-package
              package:
                package: punktfunk-client
            - check: the punktfunk repo stanza is present in pacman.conf
              id: punktfunk-client-repo-stanza
              file:
                file: /etc/pacman.conf
                contains: "[punktfunk]"
            - check: the punktfunk release key is imported AND locally signed in the pacman keyring
              id: punktfunk-client-repo-key-trusted
              # `--list-keys` alone would pass on a key that is present but UNTRUSTED, which
              # is the state a failed lsign leaves behind — so assert the `pub:f:` full-trust
              # field rather than mere presence.
              command:
                command: >-
                    gpg --homedir /etc/pacman.d/gnupg --batch --list-keys --with-colons
                    E0CA04465C99C936E0B0C6510A317015A34DDD69 | grep -q '^pub:f:'
            - check: the client CLI answers, so the venue can drive a host
              id: punktfunk-client-cli-answers
              command:
                command: punktfunk --version
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
            - check: the renderer binary is installed, not just the control CLI
              id: punktfunk-client-renderer-binary
              # `punktfunk` alone cannot stream: it links no video libraries at all. This
              # asserts the binary `launch` actually spawns is present.
              file:
                file: /usr/bin/punktfunk-client
                exists: true
            - check: the renderer links a Vulkan loader, so it can reach a decoder
              id: punktfunk-client-renderer-links-vulkan
              # Deterministic at image-build time, unlike the capability probe below: it
              # reads the ELF, not the GPU. Catches a package that dropped its video stack.
              command:
                command: ldd /usr/bin/punktfunk-client | grep -q libvulkan
            - check: at least one hardware Vulkan ICD is installed
              id: punktfunk-client-hardware-icd
              # lavapipe (`lvp_icd.json`) does NOT implement video decode, so its presence
              # alone is the failing state. Assert a non-lavapipe ICD exists.
              command:
                command: >-
                    ls /usr/share/vulkan/icd.d/ | grep -qvx 'lvp_icd.json'
            - check: the venue's Vulkan stack advertises H.264 decode
              id: punktfunk-client-vulkan-decodes-h264
              # THE assertion this candy exists for, and the one whose absence let a client
              # that could not decode look healthy. Runtime-only: it needs the venue's real
              # GPU, which an image build does not have.
              context:
                - runtime
              command:
                command: vulkaninfo 2>/dev/null | grep -q VK_KHR_video_decode_h264
