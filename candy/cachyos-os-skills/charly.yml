cachyos-skill:
    skill:
        name: cachyos
        family: distros
        owner: cachyos
        description: |-
            CachyOS base image (docker.io/cachyos/cachyos-v3) — x86_64_v3-optimized Arch
            derivative. Owned by the opencharly/distro-cachyos submodule (box/cachyos);
            consumed by main's versa box via the `cachyos` import namespace.
            MUST be invoked before building, deploying, or troubleshooting cachyos boxes.
        triggers:
            - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"
        content: |
            # cachyos
            
            CachyOS base image, pulled from the upstream-published OCI image
            `docker.io/cachyos/cachyos-v3` (optimized for modern `x86_64_v3` CPUs), pinned
            by digest in `box/cachyos/charly.yml` — Docker Hub publishes only a `:latest`
            tag for `cachyos-v3`, so a digest is the most precise pin available.
            CachyOS is an Arch derivative, so it shares the Arch toolchain, `pacman`, and the
            `arch-builder` multi-stage builder.
            
            The CachyOS family lives in the **`opencharly/distro-cachyos`** repo (git submodule at
            **`box/cachyos`**), with the `cachyos` base image **owned there** and its
            boxes discovered as `box/<name>/charly.yml`. It composes the main repo's shared
            candies by `@github` git reference and imports the **`opencharly/distro-arch`** submodule
            under the `arch` namespace (`import: [{arch: …}]`) so it reaches `arch.arch` (the
            `cachyos-pacstrap-builder` base) and `arch.arch-builder` (the cachyos base's
            builder) — one-directional, since arch imports nothing back. Build it
            from the submodule: `charly -C box/cachyos box build cachyos` (or
            `charly --repo opencharly/distro-cachyos box build cachyos`).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | docker.io/cachyos/cachyos-v3 (pinned by digest in charly.yml) |
            | Layers | (none) |
            | Platforms | linux/amd64 |
            | Distro | cachyos, arch |
            | Build | pac |
            | Builders | pixi, npm, cargo, aur → arch-builder |
            | Registry | ghcr.io/opencharly |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            ## main → cachyos coupling
            
            The `cachyos` base and its derived boxes — `versa`, the `openclaw-*` family,
            `githubrunner`, `android-emulator`, `charly-selftest`, and the `selkies-*` GPU
            desktops — all live in the **`opencharly/distro-cachyos`** submodule, discovered as
            `box/<name>/charly.yml` boxes. The main repo imports that submodule under the
            `cachyos` import namespace to reference the relocated boxes from its own
            `check`/`vm`/`local`/`kubernetes`/`android` entities:
            
            ```yaml
            # main charly.yml
            import:
              - cachyos: '@github.com/opencharly/distro-cachyos:<tag>'   # namespaced child import → cachyos.<entry>
            ```
            
            This is a one-directional **main → cachyos** dependency. The submodule, in turn,
            imports the **`opencharly/distro-arch`** submodule under the `arch` namespace (for
            `arch.arch` and the `arch.arch-builder` builder) — also one-directional, since
            arch imports nothing back. The whole import graph is therefore a DAG
            (main → cachyos → arch, plus main → arch directly), with no mutual cycle. When a
            repo is reached via two paths — arch, here, via main → arch and via
            main → cachyos → arch — the loader resolves it to a single materialization **by
            repo identity**, so main's namespace pins win and a stale transitive pin inside a
            published submodule release never drags a divergent snapshot into the load (see
            `/charly-internals:go` "import-namespace loader"). The image DAG
            `versa → cachyos → docker.io/cachyos-v3` is itself acyclic. `versa` lives in the
            same submodule as its `base: cachyos`, so it inherits the cachyos base's
            `distro:`/`build:` values AND its `builder:` map (pixi/npm/cargo/aur →
            `arch.arch-builder`) directly — there is no namespace boundary between them. The
            namespace-relative builder map crosses the boundary once, where the cachyos base
            itself names the qualified `arch.arch-builder` ref.
            
            ## AUR support — full parity with `arch`
            
            CachyOS has the **same AUR capability as the `arch` base**, because it is
            Arch-derived and its `builder.aur` points at the shared `arch-builder` (which
            ships `yay`). Anything that builds on arch builds on cachyos:
            
            - A box based on `cachyos` that needs AUR packages declares
              `build: [pac, aur]` (exactly as an `arch`-based box would — the base itself
              declares only `build: [pac]`, so the consumer opts in). The AUR builder stage
              (`<layer>-aur-build` via `arch-builder`) then compiles the packages and
              `pacman -U`-installs the `.pkg.tar.zst` artifacts. Worked example: the
              `selkies-desktop` box (`base: cachyos.cachyos`, `build: [pac, aur]`) builds
              `google-chrome` (chrome candy) + `wlrctl` (wl-tools candy) from the AUR.
            - Candies author AUR packages under `distro.arch.aur.package` (see
              `/charly-image:layer` "AUR"); the `arch` distro tag is what cachyos boxes match
              (their `distro:` is `[cachyos, arch]`), so the same `distro.arch` sections used
              by every Arch box apply unchanged.
            - The `cachyos` base declares `produce: [pixi, npm, cargo, aur]` (identical to
              `arch`), advertising the same builder-capability profile as every other base
              distro.
            
            There is **no cachyos-specific AUR path** and no cachyos-only builder — AUR on
            cachyos and AUR on arch are the same code path through `arch-builder`.
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build cachyos
            charly shell cachyos -c "pacman --version"
            ```
            
            ## Derived / sibling entries (all in opencharly/distro-cachyos)
            
            - `/charly-distros:cachyos-pacstrap-builder` — privileged pacstrap builder (`base: arch.arch`)
            - `/charly-distros:cachyos-pacstrap` — bootstrap-from-scratch rootfs (builds end-to-end)
            - `/charly-vm:cachyos-bootstrap-vm` — bootstrap VM (`cachyos-vm`) + `check-cachyos-vm` check bed
            - `/charly-local:charly-cachyos` — the operator CachyOS workstation profile
            - `/charly-versa:versa` — CachyOS-rooted notebook/OSM image in this submodule (`base: cachyos`)
            
            ### CachyOS GPU box family
            
            The submodule also carries a CachyOS GPU box family — the Arch/CachyOS siblings
            of the Fedora GPU boxes (which live in `box/fedora`). They build on the
            `cachyos.nvidia` GPU base, which is `cachyos` + `agent-forwarding` + `nvidia` +
            `cuda` (the `nvidia` and `cuda` candies are multi-distro — Fedora rpm + Arch pac —
            so they compose unchanged on CachyOS):
            
            - `cachyos.nvidia` — the GPU base (cachyos + agent-forwarding + nvidia + cuda)
            - `cachyos.python-ml` — ML Python environment
            - `cachyos.jupyter-ml` — CUDA ML JupyterLab
            - `cachyos.ollama` — Ollama LLM server
            - `cachyos.comfyui` — ComfyUI image generation
            - `cachyos.unsloth-studio` — Unsloth Studio fine-tuning UI
            - `cachyos.immich-ml` — Immich with the CUDA ML backend
            - `cachyos.selkies-labwc-nvidia` — GPU NVENC Selkies streaming desktop (labwc flavor)
            - `cachyos.selkies-kde-nvidia` — GPU NVENC Selkies streaming desktop (full KDE Plasma flavor)
            - `cachyos.selkies-kde` — full KDE Plasma Selkies flavor on the plain cachyos base (VAAPI on an AMD/Intel render node, software x264 otherwise; the `-nvidia` sibling adds NVENC). The labwc cpu/amd flavor (`selkies-labwc`) lives in this same `box/cachyos` submodule.
            
            ## Why Docker Hub instead of pacstrap
            
            The canonical base pulls the upstream OCI image (the path the CachyOS project
            itself recommends — see https://github.com/CachyOS/docker). It's the faster
            default (no privileged pacstrap, no kernel build). The pacstrap-from-scratch
            variant (`/charly-distros:cachyos-pacstrap`) is retained for offline/air-gapped
            builds and also builds end-to-end (the pacstrap renderer derives
            `[options] Architecture` from the cachyos-v3 microarch repos and emits per-repo
            `SigLevel`).
            
            ## Verification
            
            After `charly -C box/cachyos box build cachyos`:
            - `charly box list` — box appears
            - `charly shell cachyos -c "pacman --version"` — pacman available
            - `charly box inspect versa --format base` (from main) → `cachyos.cachyos` (the `cachyos` import namespace resolves)
            - `charly check box cachyos` — build-scope check: 3 probes pass (os-release `ID=cachyos`,
              `pacman --version`, `pacman-conf --repo-list` contains `cachyos-v3`). These also
              pass when `cachyos` is built from main via the `cachyos` import namespace, and are
              inherited by `versa` through the base chain.
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the cachyos base image, the
            opencharly/distro-cachyos submodule, or the main → cachyos import-namespace coupling.
            Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-distros:arch` — the Arch base (`cachyos-pacstrap-builder` is `base: arch.arch`, via the `arch` import namespace)
            - `/charly-image:image` — box family umbrella (composition, build/validate/inspect)
            - `/charly-internals:cutover-policy` — the hard-cutover policy governing submodule splits

cachyos-pacstrap-skill:
    skill:
        name: cachyos-pacstrap
        family: distros
        owner: cachyos-pacstrap
        description: |-
            Bootstrap-from-scratch CachyOS rootfs via pacstrap inside a privileged builder.
            Builds end-to-end (the shared pacstrap renderer emits
            Architecture + SigLevel); retained for offline/air-gapped builds. Lives in the
            opencharly/distro-cachyos submodule (box/cachyos).
            MUST be invoked before building or troubleshooting cachyos-pacstrap.
        content: |
            # cachyos-pacstrap
            
            Bootstrap-from-scratch CachyOS root filesystem, built via `pacstrap` inside the
            privileged `/charly-distros:cachyos-pacstrap-builder` container
            (`from: builder:pacstrap`, `bootstrap_builder_image: cachyos-pacstrap-builder`).
            
            > **Lives in `opencharly/distro-cachyos`** (git submodule at `box/cachyos`). Build:
            > `charly -C box/cachyos box build cachyos-pacstrap`.
            
            ## When to use it (and when not)
            
            The canonical CachyOS base (`/charly-distros:cachyos`) pulls the upstream-published
            OCI image from Docker Hub — that is the recommended path and the one the CachyOS
            project itself uses. This pacstrap variant exists for **offline / air-gapped**
            builds and as a worked example of the `from: builder:pacstrap` +
            `bootstrap_builder_image:` pattern.
            
            ## pacstrap x86_64_v3 + SigLevel (fixed)
            
            Without the shared `renderPacstrapExtraConf` helper the privileged pacstrap step rejects the CachyOS `x86_64_v3`
            packages (`package architecture is not valid`) and, on the VM path, trips GPGME
            signature checks (`GPGME error: No data`) — both symptoms are worth recognising.
            It handles them
            (`candy/plugin-vm/vm_bootstrap_engine.go:57`,
            used by both `runPrivilegedBootstrap` and the VM bootstrap engine — the former
            `charly/build.go`/`charly/vm_bootstrap.go` are DELETED, K-wave 2):
            
            1. it derives an `[options] Architecture = x86_64 x86_64_v3` directive from the
               cachyos-v3 repos' microarch token, so pacman accepts `linux-cachyos` etc.;
            2. it emits each repo's `SigLevel` — the VM bootstrap path previously open-coded
               the loop and dropped `SigLevel`, so `SigLevel = Never` cachyos repos fell
               back to signature-required and GPGME failed. Both paths now share one renderer
               (R3), so they can't diverge again.
            
            Verified live: `charly -C box/cachyos box build cachyos-pacstrap` produces a
            rootfs with `linux-cachyos` (`%ARCH% = x86_64_v3`) installed. (Requires an `charly`
            with this fix — newer than the published release.) The Docker-Hub `/charly-distros:cachyos`
            base is still the faster default (no privileged build).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | From | builder:pacstrap |
            | bootstrap_builder_image | cachyos-pacstrap-builder |
            | Distro | cachyos, arch |
            | Build | pac |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            The `cachyos` distro config (pacstrap base packages, CachyOS keyring
            `F3B607488DB35A47`, mirrorlist, `cachyos*` repos) lives in the embedded build
            vocabulary (`charly/charly.yml`, baked into the `charly` binary) and is resolved
            by name whenever a box declares `distro: cachyos`.
            
            ## Cross-References
            
            - `/charly-distros:cachyos` — the recommended Docker-Hub base
            - `/charly-distros:cachyos-pacstrap-builder` — the privileged builder it uses
            - `/charly-vm:cachyos-bootstrap-vm` — the VM built via the same pacstrap path
            
            ## When to Use This Skill
            
            **MUST be invoked** before building or debugging the CachyOS pacstrap rootfs.
            Invoke BEFORE reading source code or launching Explore agents.

cachyos-pacstrap-builder-skill:
    skill:
        name: cachyos-pacstrap-builder
        family: distros
        owner: cachyos-pacstrap-builder
        description: |-
            Privileged pacstrap builder image for bootstrapping a CachyOS rootfs from
            scratch. base: arch.arch (via the `arch` import namespace) + the pacstrap-builder
            candy. Lives in the opencharly/distro-cachyos submodule (box/cachyos).
            MUST be invoked before building or troubleshooting cachyos-pacstrap / cachyos-vm.
        content: |
            # cachyos-pacstrap-builder
            
            Privileged builder image used to bootstrap a CachyOS root filesystem via
            `pacstrap` inside a container. It is the `bootstrap_builder_image:` for
            `/charly-distros:cachyos-pacstrap` and the `builder_image:` for the
            `/charly-vm:cachyos-bootstrap-vm` VM.
            
            > **Lives in `opencharly/distro-cachyos`** (git submodule at `box/cachyos`). It is
            > `base: arch.arch` — the `arch` base from the **`opencharly/distro-arch`** submodule,
            > reached because the cachyos `charly.yml` imports that submodule under the `arch`
            > namespace. Its single candy, `pacstrap-builder`, lives in the main repo
            > (shared with `/charly-distros:arch-builder`'s pacstrap path) and is pulled by git
            > reference.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `arch.arch` (from the `opencharly/distro-arch` submodule, via the `arch` import namespace) |
            | Layer | pacstrap-builder (`@github.com/opencharly/charly/candy/pacstrap-builder:<tag>`) |
            | Distro | arch |
            | Build | pac |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build cachyos-pacstrap-builder
            ```
            
            This is the R10 canary for the submodule's composition machinery: a successful
            build proves the `arch` import namespace resolves the `arch` base from the
            `opencharly/distro-arch` submodule, the git-ref'd `pacstrap-builder` candy
            materializes, and the embedded build vocabulary (pacstrap builder definition +
            cachyos distro config) is reachable.
            
            `charly check box cachyos-pacstrap-builder` runs the build-scope check: 4 probes pass
            (`/usr/sbin/pacstrap`, `arch-install-scripts` installed, `/usr/sbin/grub-install`,
            `/usr/sbin/parted`) — i.e. the pacstrap toolchain the builder must ship.
            
            ## Cross-References
            
            - `/charly-distros:cachyos` — the Docker-Hub CachyOS base (sibling, no pacstrap)
            - `/charly-distros:cachyos-pacstrap` — the rootfs this builder bootstraps
            - `/charly-vm:cachyos-bootstrap-vm` — the VM that uses this as `builder_image:`
            - `/charly-distros:arch` / `/charly-distros:arch-builder` — the Arch base + builder it mirrors
            
            ## When to Use This Skill
            
            **MUST be invoked** when building or debugging the CachyOS pacstrap path.
            Invoke BEFORE reading source code or launching Explore agents.

githubrunner-skill:
    skill:
        name: githubrunner
        family: distros
        owner: githubrunner
        description: |-
            Self-hosted GitHub Actions runner on CachyOS, fully rootless — runs as
            uid=1000 with zero added capabilities (no root, no privileged) via
            container-nesting, with rootless nested podman/buildah/skopeo for CI.
            Host networking retained for reachability. MUST be invoked before building,
            deploying, configuring, or troubleshooting the githubrunner box.
        content: |
            # githubrunner
            
            Self-hosted GitHub Actions runner on **CachyOS**, fully rootless. Shares the
            rootless nested-container posture with `/charly-openclaw:openclaw-desktop` (uid=1000,
            no caps, `unmask=/proc/*` via `/charly-distros:container-nesting`).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | cachyos (`cachyos.cachyos`) |
            | Layers | agent-forwarding, github-runner, charly, dbus, container-nesting |
            | Build | pac |
            | Platforms | linux/amd64 |
            | UID / user | **1000 / user** (rootless — NO uid/privileged override) |
            | Network | host (reach the host-side ghcr pull-through mirror) |
            | Security | container-nesting's posture: `cap_add:[]`, `security_opt:[unmask=/proc/*]`, devices `/dev/fuse` + `/dev/net/tun` |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `cachyos` (`docker.io/cachyos/cachyos-v3`, via the `cachyos` import namespace)
            2. `agent-forwarding` — GPG/SSH/direnv (composes gnupg + direnv + ssh-client)
            3. `github-runner` — the Actions runner agent (under `${HOME}/actions-runner`),
               cosign, go/git/jq, qemu-user-static (aarch64 cross-arch CI), the .NET runtime
               deps, the credential-backed registration, the ghcr mirror config
            4. `charly` — the charly binary + `virtualization` + `gocryptfs` + `socat`
            5. `dbus` — session bus (for runner hooks)
            6. `container-nesting` — rootless nested podman/buildah/skopeo + the subuid/subgid
               layout + newuidmap/newgidmap file-caps + containers/storage/policy configs
            
            ## Rootless posture (genuinely uid 1000, no caps)
            
            The box carries **no uid/user/privileged override**, so it resolves to
            `container-nesting`'s posture: uid=1000, `cap_add:[]`, `security_opt:[unmask=/proc/*]`,
            devices `/dev/fuse` + `/dev/net/tun`. The runner process (`run.sh`), all CI jobs,
            and rootless nested podman all run as `user` (uid 1000). See
            `/charly-distros:container-nesting` for the `mount_too_revealing()` kernel RCA that
            makes nested podman work without caps or `--privileged`.
            
            `/charly-coder:sshd` (passwordless `/etc/sudoers.d/charly-user`) is composable if a
            workflow genuinely needs sudo; it is not composed by default.
            
            ## Nested container support
            
            `githubrunner` composes `/charly-distros:container-nesting` directly, so CI jobs get
            first-class **rootless nested podman/buildah/skopeo** (uid 1000, `/dev/fuse` +
            `unmask=/proc/*`, `crun` + `fuse-overlayfs`, `BUILDAH_ISOLATION=chroot`). The
            rootless image cache lives under `${HOME}/.local/share/containers`. Cross-arch
            container builds (aarch64) work via the repo `qemu-user-static` +
            `qemu-user-static-binfmt` packages.
            
            ## CI: the org's release-binary workflow runs on GitHub-hosted runners

            The legacy `release-packages` workflow (`.github/workflows/release-packages.yml`,
            which built the pac/rpm/deb packages on this self-hosted runner via `charly box
            pkg`) is REMOVED with the nFPM cutover. The release-binary workflow
            (`.github/workflows/release-binary.yml`) builds the CalVer-stamped binary + the
            welded plugins on a GitHub-hosted `ubuntu-latest` runner and publishes them as
            release assets; the per-distro package repos (built by the `charly
            generate-packages` plugin) consume those assets. This runner still carries the
            FULL `charly` PKGBUILD `depends=` set, so the charly CLI (and the CI jobs that
            drive it) runs fully here:

            - **pac** runs NATIVELY — the runner is an Arch (CachyOS) host, so `charly` and
              its deps resolve without a container. Every `depends=` is pre-installed, so no
              `sudo pacman` (the runner has no passwordless sudo).
            - **rpm + deb** run in the runner's rootless nested podman.

            The `github-runner` candy completes the `charly` runtime on the runner — beyond the .NET/runner deps it adds
            the `depends=` packages the charly/virtualization candies don't already provide
            (`slirp4netns`, `libisoburn`, `cdrtools`, `swtpm`).
            
            ## Token mechanism (credential-backed; obtained via `gh`)
            
            `RUNNER_TOKEN` is a `secret_accept` (credential-store-backed — never written to
            charly.yml or the quadlet); `RUNNER_ORG` is an `env_accept`. The registration
            token is short-lived and only consumed once at `charly config` time (the registered
            runner persists its own `.credentials` on the `state` volume), so it is obtained
            fresh from `gh`. The `post_enable`/`pre_remove` hooks are guarded — they skip
            when `RUNNER_TOKEN` is empty, so a token-less deploy (e.g. an check bed) brings the
            image up without registering, and a stale token never errors a teardown.
            
            ```bash
            # Obtain a fresh org registration token and register:
            TOKEN=$(gh api -X POST /orgs/<org>/actions/runners/registration-token --jq .token)
            charly config githubrunner -e RUNNER_ORG=<org> -e RUNNER_TOKEN="$TOKEN"   # token scrubbed → credential store
            charly start githubrunner
            ```
            
            Removal deregisters via the `pre_remove` hook, which needs a **remove**-token
            (distinct from the registration token):
            
            ```bash
            charly remove githubrunner -e RUNNER_TOKEN=$(gh api -X POST /orgs/<org>/actions/runners/remove-token --jq .token)
            ```
            
            ## Lifecycle
            
            ```bash
            charly box build githubrunner
            charly config githubrunner -e RUNNER_ORG=<org> -e RUNNER_TOKEN="$TOKEN"
            charly start githubrunner
            charly stop githubrunner
            charly remove githubrunner -e RUNNER_TOKEN=<remove-token>
            ```
            
            ## Key Candies
            
            - `/charly-distros:github-runner` — runner agent, hooks, registration, ghcr mirror, .NET deps + the charly-host `depends=` completion (native pac builds in CI)
            - `/charly-distros:container-nesting` — rootless nested podman/buildah/skopeo, subuid layout, caps
            - `/charly-tools:charly` — the charly binary + virtualization + gocryptfs + socat
            - `/charly-distros:agent-forwarding` — GPG/SSH/direnv for the `.secrets` workflow
            
            ## Related Boxes
            
            - `/charly-distros:cachyos` — the CachyOS base (parent, via the `cachyos` namespace)
            - `/charly-openclaw:openclaw-desktop` — same rootless container-nesting posture (uid 1000, no caps)
            - `/charly-distros:charly-fedora`, `/charly-coder:charly-arch` — the charly-toolchain siblings (root path, box-level full-hammer security)
            
            ## Related Commands
            
            - `/charly-core:charly-config` — deploy setup with RUNNER_ORG (env) / RUNNER_TOKEN (secret)
            - `/charly-core:start`, `/charly-core:stop`, `/charly-core:remove` — lifecycle + pre-remove deregistration
            - `/charly-core:charly-status`, `/charly-core:logs` — verify runner is idle + troubleshoot
            - `/charly-build:secrets` — the credential store backing `RUNNER_TOKEN`
            
            ## Verification
            
            Build-scope (`charly check box githubrunner`) + deploy-scope (`charly check live`) checks
            ship on the `github-runner` candy (functional: `config.sh --version` proves the
            .NET deps resolved; rootless nested `podman run` proves the posture). The
            disposable R10 bed is **`check-githubrunner-pod`** (`charly check run check-githubrunner-pod`)
            — it proves the rootless composition WITHOUT GitHub registration (no token →
            guarded hooks no-op).
            
            After `charly start` against a registered deploy:
            
            - `charly status githubrunner` — container running
            - `charly shell githubrunner -c "id"` — uid=1000(user) (rootless)
            - `charly shell githubrunner -c "podman run --rm quay.io/libpod/alpine:latest true"` — rootless nested podman works
            - Runner appears as "Idle" in the org's Settings > Actions > Runners
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the githubrunner box,
            self-hosted runners, or GitHub Actions CI/CD. Invoke this skill BEFORE
            reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)
            - `/charly-check:check` — the `check:` checks + the `check-githubrunner-pod` R10 bed

