charly-cachyos-skill:
    skill:
        name: charly-cachyos
        family: local
        owner: charly-cachyos
        description: |-
            Operator CachyOS workstation profile — a kind:local template plus a host:local deploy that installs the full dev stack (a large candy list) onto a CachyOS host via ShellExecutor. Lives in the opencharly/distro-cachyos submodule. Use before editing or applying the charly-cachyos workstation profile.

        triggers:
            - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"
        content: |
            # charly-cachyos

            The operator's CachyOS developer-workstation profile: a `kind: local` template
            (`charly-cachyos-app`) plus a `host: local` deploy (`charly-cachyos`, the
            deploying entry) that applies a kitchen-sink dev stack directly to the
            current machine via `ShellExecutor` — no SSH, no VM, no container.

            It lives in the **`opencharly/distro-cachyos`** repo (git submodule at
            **`box/cachyos`**), in that repo's single `charly.yml` — both the
            `kind: local` template (`charly-cachyos-app`) and the `charly-cachyos` `local:` deploy
            that deploys it. The repo also carries the `cachyos-gpu` deploy — the
            **persistent** operator GPU-workstation VM (`vm: { from: cachyos-gpu-workstation-vm }`,
            **not** `disposable`; see `/charly-vm:cachyos-bootstrap-vm`) — so `charly-cachyos` is no longer
            the only non-disposable deploy there; every disposable test bed is a
            `disposable: true` deploy. Apply it with:

            ```bash
            charly -C box/cachyos update charly-cachyos
            # or, anywhere:
            charly --repo opencharly/distro-cachyos update charly-cachyos
            ```

            ## What it installs

            A large candy list. Most are pulled from the main repo by **git reference**
            (`@github.com/opencharly/charly/candy/<name>:<tag>`); the cachyos-exclusive
            `ghostty`, `keepassxc-keyring`, and `wheel-nopasswd` are vendored locally in this
            repo's `candy/` (resolved via its `discover:` block):

            `wheel-nopasswd`, `yay`, `dev-tools`, `gh`, `pre-commit`, `tmux`, `direnv`,
            `gnupg`, `keepassxc`, `keepassxc-keyring`, `tailscale`, `tailscale-up`,
            `build-toolchain`, `golang`, `rust`, `nodejs`, `uv`, `claude-code`, `codex`,
            `gemini`, `oracle`, `forgecode`, `devops-tools`, `docker-ce`, `kubernetes`,
            `vscode`, `ghostty`, `chrome`, `nvidia`, `charly`, and the DeepSeek Harness
            family — `pod-dsh/candy/dsh` (the `dsh` CLI) and `pod-dsh/candy/dsh-tui`
            (the dsh-TUI plugin; its candy ships the `ollama-cloud` LLM route as
            `~/.dsh/cordis.patch.yml`).

            The dsh **web** GUI is deliberately NOT composed here: the `dsh-web`
            candy is a container service (supervisord + socat on container port
            3081), which does not suit a host workstation. On a host the web UI is a
            user-scope systemd unit exposed with `tailscale serve --bg --https=3080
            http://127.0.0.1:3080` (a 1:1 port map — dsh does not occupy 443; the
            tailscale-up candy arms the operator permission); see `/charly-tools:dsh`.
            The web UI has TWO independent auth layers — the launch token on `/` and
            a Host/Origin browser-trust fence on `/api/*` — so a proxy that presents a
            non-loopback Host must start `dsh web` with `--trusted-host <host>:3080`,
            or `/` loads while every `/api/*` call returns 403.

            ## Key fields

            | Field | Value |
            |---|---|
            | `install_opts.builder_image` | `ghcr.io/opencharly/arch-builder:2026.122.2252` (OCI ref, not a candy) |
            | `install_opts` | with_service, allow_repo_changes, allow_root_tasks all true |
            | `env` | `EDITOR=nvim`, `PAGER=less` |
            | `disposable` (deploy) | absent/false — this real workstation requires operator authorization; unattended `charly update charly-cachyos` is forbidden |

            ## Deploy-scope check probes

            - `passwordless-sudo-host` — `sudo -n true` (wheel-nopasswd candy must have run)
            - `nvidia-ctk-present` — `command -v nvidia-ctk`
            - `nvidia-cdi-spec` — `/etc/cdi/nvidia.yaml` exists
            - `dsh-cli-installed` — `~/.npm-global/bin/dsh` and `dsh-tui` are executable
            - `dsh-version` — `dsh --version` prints a semantic version
            - `dsh-tui-profile-installed` — `~/.dsh/profiles/dsh-tui/package.json` exists
            - `dsh-tui-version` — `dsh-tui version` reports the launcher/profile version
            - `dsh-ollama-route-installed` — `~/.dsh/cordis.patch.yml` declares the `ollama-cloud` route

            Both `nvidia-*` probes gate on an active host NVIDIA driver
            (`[ -e /dev/nvidiactl ] || nvidia-smi`) and pass with an N/A note on a
            card-less or VFIO-passthrough host, so the profile applies cleanly anywhere.

            ## Composition-by-reference note

            `charly-cachyos-app`'s remote candy refs are collected and materialized by the
            same `CollectRemoteRefs` walk as box candy refs: the walk collects the candy
            refs of the ROOT project's own `kind: local` templates (the cachyos repo is the
            root here), so `charly box validate` / `charly update charly-cachyos` resolve the github-ref'd
            candies. (Collection is reachability-scoped — a namespace's `kind:local`
            templates, imported only as a dependency, are NOT collected by an importer; only
            the root's own locals are. See `/charly-internals:go` "Remote-layer resolver".)

            ## Cross-References

            - `/charly-local:local-spec` — `kind: local` template authoring reference
            - `/charly-local:local-deploy` — the `target: local` deployment surface
            - `/charly-distros:cachyos` — the CachyOS base of the same family
            - `/charly-core:deploy` — deploy entry semantics (globally-unique names within a document: the `charly-cachyos` deploy ships the suffixed `charly-cachyos-app` `kind: local` template)

            ## When to Use This Skill

            **MUST be invoked** when editing or applying the charly-cachyos workstation profile,
            or reasoning about the kind:local remote-candy-ref machinery. Invoke BEFORE
            reading source code or launching Explore agents.
keepassxc-keyring-skill:
    skill:
        name: keepassxc-keyring
        family: infrastructure
        owner: keepassxc-keyring
        description: |-
            Configure KeePassXC as the freedesktop.org Secret Service provider on a
            target:local host: enable FdoSecrets, autostart KeePassXC, disable
            competing daemons (gnome-keyring + kwallet) at the per-user XDG-autostart
            and systemd-user-unit layers, install pinentry/libsecret, and
            install generic direnv shell hooks for bash/zsh/fish.
            Use when adding KeePassXC as the Secret Service backend on a host (NOT
            for adding the binary to a container image — use /charly-infrastructure:keepassxc
            for that).
        content: |
            # keepassxc-keyring -- KeePassXC as the system Secret Service
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `keepassxc`, `gnupg` |
            | Ports | none |
            | Service | none (KeePassXC autostarted via XDG `~/.config/autostart/keepassxc.desktop`, not a systemd unit) |
            | Install files | `task:` only |
            | Target | `target: local` (host deploys); harmless on container images but pointless |
            
            ## Packages
            
            - Arch (`pac:`): `pinentry`, `libsecret`
            - Fedora (`rpm:`): `pinentry-qt`, `libsecret`
            - Debian/Ubuntu (`deb:`): `pinentry-qt`, `libsecret-tools`
            
            `pinentry` provides the GUI passphrase dialog that gpg-agent spawns; `libsecret` provides `secret-tool` and the C client lib that pinentry-qt uses to query KeePassXC.
            
            ## What this candy changes on the host
            
            1. `~/.config/keepassxc/keepassxc.ini` — writes `[FdoSecrets] Enabled=true` block (and three plugin-behavior toggles).
            2. `~/.config/autostart/keepassxc.desktop` — XDG autostart entry that launches KeePassXC on every session login.
            3. `~/.config/autostart/<competitor>.desktop` — for each known competing Secret Service daemon (`gnome-keyring-secrets`, `gnome-keyring-ssh`, `gnome-keyring-pkcs11`, `org.kde.kwalletd[5,6]`, `kwalletd[5,6]`), writes an override with `Hidden=true` + `X-GNOME-Autostart-enabled=false`. Per the XDG spec, user-level overrides take precedence over `/etc/xdg/autostart/`, so the system package stays untouched and the change is fully reversible by `charly deploy del`.
            4. `systemctl --user disable --now <unit>` for the same competitors' systemd user units (`gnome-keyring-daemon.socket`, `gnome-keyring-daemon.service`, the kwallet service variants). Idempotent, silent if a unit doesn't exist.
            5. `~/.gnupg/gpg-agent.conf` — `pinentry-program /usr/bin/pinentry-qt` (the libsecret-linked pinentry that talks to KeePassXC for GPG passphrase storage).
            6. `~/.config/environment.d/ssh-agent.conf` — exports `SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/ssh-agent.socket"` for systemd-bootstrapped sessions.
            7. **Per-shell init exports (via the `shell:` schema):** for non-systemd-bootstrapped shells (tmux from a screen-locked session, ssh-in shells without a fresh login, scripts), the candy's `shell:` block lands managed-block exports of `SSH_AUTH_SOCK` (guarded with `command -v` / socket-existence check), `KEEPASSXC_DATABASE` advisory pointer, and `GPG_TTY=$(tty)`. bash/zsh/sh share one POSIX-style snippet; fish gets a syntactically-correct counterpart via `set -gx`. environment.d (item 6) and the `shell:` block coexist with no conflict — environment.d wins under systemd, the shell-rc lines fill the gap when systemd isn't in the loop.
            8. **Direnv shell hooks come from the `direnv` candy** (declared via `require: [direnv]`). This candy writes no direnv hooks itself — the responsibility belongs to the direnv candy's own `shell:` block. `charly migrate` cleans up any legacy inline `direnv-hook` blocks left on a host by older configs.
            9. **systemd user service for KeePassXC** with `Restart=on-failure` and explicit dependency on `graphical-session.target`.
            
            ## What this candy DOES NOT do
            
            - **Marking a `.kdbx` group as "Secret Service exposed"** — this is per-database state inside the `.kdbx` file itself, not in `keepassxc.ini`. It is a one-time GUI action (right-click group → "Mark as Secret Service exposed") performed by the user once per database.
            - **`charly secrets gpg setup`** — the gpg-agent.conf, systemd socket, and Secret-Service passphrase storage are still wired by the user-invoked `charly secrets gpg setup` command. This layer just installs the packages that command requires (`pinentry-qt`, `libsecret`).
            - **Removing or downgrading** any system package. All competitor disabling is per-user, reversible.
            
            ## Usage
            
            ```yaml
            # local.yml
            local:
              charly-cachyos:
                candy:
                  - '@github.com/opencharly/layer-direnv'
                  - '@github.com/opencharly/layer-gnupg'
                  - '@github.com/opencharly/layer-keepassxc'
                  - keepassxc-keyring     # this layer
                  ...
            ```
            
            Order with respect to `direnv`/`gnupg`/`keepassxc` doesn't strictly matter (the candy system topo-sorts via `require:`), but listing them adjacently makes the YAML self-documenting.
            
            ## Used In Boxes / Templates
            
            - `charly-cachyos` (kind:local template, applied via the `charly-cachyos` deployment — same name; cross-kind name reuse is permitted)
            
            ## Tests
            
            Build-scope (run on package install):
            
            - `keepassxc-binary` — `/usr/bin/keepassxc` exists.
            - `pinentry-qt-installed` — at least one of `pinentry-qt`, `pinentry-qt5`, `pinentry-qt6` resolvable on PATH.
            - `secret-tool-installed` — `secret-tool` resolvable on PATH.
            
            Deploy-scope (run on the host post-`charly deploy add` against the running user's HOME):
            
            - `keepassxc-ini-fdosecrets` — `[FdoSecrets] Enabled=true` written.
            - `keepassxc-autostart` — autostart .desktop file readable.
            - `gnome-keyring-secrets-disabled` — competitor override has `Hidden=true` (or the file doesn't exist on this host, which is also fine).
            - `direnv-fish-hook` — fish hook file contains `direnv hook fish`.
            - `direnv-bash-hook` — `~/.bashrc` contains the bash hook.
            
            ## Relationship to other skills
            
            | Skill | Relationship |
            |-------|--------------|
            | `/charly-infrastructure:keepassxc` | The package-only candy. `keepassxc-keyring` `require:` on it; never composes it. |
            | `/charly-infrastructure:gnupg` | Same — keepassxc-keyring `require:` on gnupg, never composes. |
            | `/charly-distros:agent-forwarding` | Distinct concern. agent-forwarding is for FORWARDING the host's GPG/SSH agents INTO containers via socket bind-mounts. keepassxc-keyring is about turning the host itself into a Secret Service server. Both can be active simultaneously. |
            | `/charly-build:secrets` | The CLI surface that talks to KeePassXC after this layer is in place. `charly secrets gpg setup` and `charly secrets gpg doctor` find pinentry-qt + libsecret on PATH because this layer installed them. |
            | `/charly-coder:direnv` | Installs the direnv binary. This layer adds the missing piece (the shell hook) for `.envrc` to actually trigger on `cd`. |
            | `/charly-image:layer` | Candy authoring reference. |
            | `/charly-check:check` | `check:` block format reference. |
            
            ## Why a separate candy (and not edits to `keepassxc` or `agent-forwarding`)
            
            - The `keepassxc` candy is consumed by container/desktop boxes where FdoSecrets and autostart make no sense.
            - `agent-forwarding` is a clean metalayer (`gnupg + direnv + ssh-client`) used by application boxes. Adding host-only behavior there would polute every container build that composes it.
            - Keeping host-only secret-service wiring in its own candy means containers stay containers and hosts stay hosts.
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Making KeePassXC the default Secret Service on a host.
            - The `.envrc` + `.secrets` workflow not triggering on `cd` (likely missing direnv hook from this layer).
            - gnome-keyring or kwallet conflicting with KeePassXC over the `org.freedesktop.secrets` D-Bus name.
            - Why charly's keyring backend "can't find" the user's KeePassXC database (FdoSecrets plugin disabled in keepassxc.ini).
            - The `charly-cachyos` template's keyring/direnv/gpg block.
            
            ## Related
            
            - `/charly-infrastructure:keepassxc` — package install (parent dependency)
            - `/charly-infrastructure:gnupg` — gpg binary (parent dependency)
            - `/charly-distros:agent-forwarding` — sibling: container-side agent forwarding metalayer
            - `/charly-build:secrets` — `charly secrets` and `charly secrets gpg` CLI surface
            - `/charly-coder:direnv` — direnv binary candy (the shell hook this candy adds completes the chain)
            - `/charly-image:layer` — candy authoring reference
            - `/charly-check:check` — declarative testing reference
            - `/charly-local:local-spec` — `kind: local` template reference (where this candy is composed)
            - `/charly-local:local-deploy` — `target: local` deploy semantics

versa-skill:
    skill:
        name: versa
        family: versa
        owner: versa
        description: |-
            versa — image bundling marimo reactive notebook environment with Apache Airflow + GPU-accelerated OSM/GTFS analytics + martin vector tiles + 3D terrain via MapLibre + Polars geospatial extensions (polars-st, geopolars) + GeoArrow + deck.gl rendering via lonboard.
            Composes a marimo + airflow + OSM/GTFS analytics stack (agent-forwarding, nvidia, cuda, marimo, airflow, osm-tools, maputnik, notebook-osm, notebook-graph, debug-tools, dbus, charly, plus the versatiles tile-serving layers) on a CachyOS / Arch base into a single pod that exposes 7 host ports and 1 MCP server.
            MUST be invoked before building, deploying, configuring, or troubleshooting the versa image.
        content: |-
            # versa — marimo + Airflow + OSM/GTFS + martin
            
            GPU-accelerated marimo notebook environment that composes a full
            analytics + visualisation stack: marimo notebooks (also acting as MCP
            server), Apache Airflow (LocalExecutor + SQLite), OSM data pipeline
            (quackosm → tippecanoe → martin), GTFS transit pipeline (gtfs-parquet),
            and a MapLibre style editor (maputnik). One MCP server is exposed
            (marimo for notebook diagnostics).
            
            The `versa` image name is OUR image identity, deliberately decoupled
            from the upstream marimo notebook software the image bundles. The
            `candy/marimo/` directory + the `mcp_provide.name: marimo`
            MCP-server identity reflect that upstream software identity.
            
            ## Image properties
            
            | Property | Value |
            |----------|-------|
            | Base | `cachyos.cachyos` — owned by the **`opencharly/distro-cachyos`** submodule (`box/cachyos`); main reaches it via the `cachyos` import namespace (the deliberate main → cachyos coupling). CUDA 13 / cuDNN / python-onnxruntime-cpu via CachyOS `extra` repo |
            | Platforms | `linux/amd64` only (cuDF + cu130 torch are amd64-only) |
            | Layers | 19 (see "Layer stack" below) |
            | Ports | 7 (see "Ports + host mappings") |
            | MCP servers | 1 (marimo @ container 2718). No airflow MCP wrapper — no Airflow-3 / `/api/v2` release of the upstream package exists; consumers drive Airflow via direct REST `/api/v2/` calls |
            | Registry | `ghcr.io/opencharly` |
            | Image tag pattern | CalVer (`YYYY.DDD.HHMM`) |
            | Builder | `arch.arch-builder` (pixi/npm/cargo/aur) — inherited from versa's bare-local `base: cachyos`. The cachyos base declares the `builder:` map and, because a `builder:` map does NOT cross a namespace boundary, names the qualified `arch.arch-builder` ref (the Arch builder in the `opencharly/distro-arch` submodule, reached via cachyos's `arch` import namespace). versa lives in the same submodule as that base, so it inherits the map directly. See `/charly-distros:cachyos`. |
            
            ## Layer stack (composition order)
            
            1. `cachyos` (base — `docker.io/cachyos/cachyos-v3` OCI image, digest-pinned; matches the upstream CachyOS docker repo workflow)
            2. `agent-forwarding` — SSH/GPG agent forwarding for in-container git push
            3. `nvidia` — driver runtime (`nvidia-utils`, `nvidia-container-toolkit`)
               — an explicit layer entry because the cachyos base doesn't bundle it
            4. `cuda` — CUDA toolkit (`cuda` + `cudnn` + `python-onnxruntime-cpu`
               from CachyOS extra repo; `/opt/cuda` symlinked into
               `/usr/{bin,include,lib64}` for path compatibility with the Fedora
               layout). No AUR builds in this image — `build:` is `[pac]` only.
            5. `marimo` — `/charly-versa:marimo-layer` — pixi env (cudf-polars-cu13,
               torch cu130, geopandas, quackosm, gtfs-parquet, folium, marimo,
               airflow Python deps, plus polars-st / geopolars / geoarrow-pyarrow /
               geoarrow-pandas / lonboard for Polars-native spatial ops + deck.gl
               rendering, plus freestiler for direct DuckDB → PMTiles tile
               generation — gpq-tiles is system-installed via the osm-tools layer
               instead, because its PyPI wheels don't cover Python 3.13/Linux x86_64
               and the pixi env's `no-build = true` blocks sdist resolution),
               supervisord service `marimo edit … --mcp`
            6. `airflow` — `/charly-versa:airflow-layer` — 4 supervisord services
               (init/scheduler/dag-processor/webserver). No airflow-mcp wrapper —
               no Airflow-3 v2 release of `mcp-server-apache-airflow` exists;
               consumers drive Airflow via direct REST `/api/v2/` calls.
            7. `osm-tools` — `/charly-versa:osm-tools-layer` — tippecanoe (built from
               source), gdal, jq, martin (Rust binary), pmtiles CLI (Go binary),
               gpq-tiles (cargo-installed Rust binary; v0.6.0 from crates.io —
               the system-install fallback for the PyPI-wheel gap)
            8. `maputnik` — `/charly-versa:maputnik-layer` — MapLibre style editor
               built with Vite `--base=/`
            9. `pmtiles-viewer` — `/charly-versa:pmtiles-viewer` — protomaps/PMTiles
               /app SPA, visual inspector for PMTiles archives (port 8001 → 28001)
            10. `shortbread` — `/charly-versa:shortbread` — systemed/tilemaker (C++/Lua)
                + shortbread-tilemaker config — produces shortbread-schema vector
                tiles into `/workspace/tiles/shortbread/`
            11. `versatiles-style` — `/charly-versa:versatiles-style` — @versatiles/style
                MapLibre style generator bundled to `/opt/versatiles-style/`
            12. `versatiles-fonts` — `/charly-versa:versatiles-fonts` — SDF font glyphs
                (Noto Sans + 9 others) bundled to `/opt/versatiles-fonts/`
            13. `maplibre-versatiles-styler` — `/charly-versa:maplibre-versatiles-styler` —
                interactive MapLibre style-switcher control bundled to
                `/opt/maplibre-versatiles-styler/`
            14. `versatiles` — `/charly-versa:versatiles` — versatiles-rs CLI binary
                (convert/serve/probe) + `versatiles serve` supervisord service on
                port 8090 → 28090 (parallel tile server to martin)
            15. `versatiles-frontend` — `/charly-versa:versatiles-frontend` —
                versatiles-org/versatiles-frontend SPA (port 8002 → 28002); also
                re-exports versatiles-style / fonts / styler at `/style/`,
                `/fonts/`, `/styler/`
            16. `notebook-osm` — `/charly-versa:notebook-osm` — data-only layer
                seeding the OSM+GTFS+pipelines notebook into `/workspace/notebooks/`
            17. `notebook-graph` — data-only layer in `candy/notebook-graph`
                seeding `gpu-libraries-demo.py` into `/workspace/notebooks/`;
                exercises cuGraph (nx-cugraph backend), cuML (KMeans), PyG
                (GCNConv on cuda:0 with torch_scatter), and graphistry
            18. `debug-tools` — `/charly-versa:debug-tools-layer` — 49 standard
                debug utilities (network/process/file/system/session)
            19. `dbus` — D-Bus session bus
            20. `charly` — `charly` CLI binary inside the container
            
            ## Ports + host mappings
            
            The image declares container ports; the `versa` deploy entry
            remaps to host ports for browser reachability:
            
            | Service | Container port | Host port | Path |
            |---|---|---|---|
            | marimo edit + MCP | 2718 | **22718** | `/` for editor, `/mcp/server` for MCP |
            | airflow api-server | 8080 | **28080** | `/api/v2/`, `/auth/token`, `/api/v2/dags/<id>/dagRuns` |
            | martin tile server | 3000 | **23000** | `/<source>/{z}/{x}/{y}` (vector tiles), `/<source>` (TileJSON), `/catalog` |
            | maputnik static editor | 8000 | **28000** | `/` (SPA root) |
            | pmtiles-viewer SPA | 8001 | **28001** | `/` (SPA root — load remote PMTiles archive via the UI's URL input) |
            | versatiles-frontend SPA | 8002 | **28002** | `/` (SPA root); `/style/` re-exports versatiles-style bundle |
            | versatiles serve | 8090 | **28090** | `/tiles/<source>/{z}/{x}/{y}.pbf` (parallel tile server to martin; serves /workspace/tiles/shortbread/) |
            
            **Host port 8080 is NOT used** for airflow because traefik already
            binds it on the operator's machine. Always use **28080** for airflow
            from the host.
            
            ## Required charly.yml entry
            
            The versa deploy entry is minimal — the seven URL env vars the
            notebook reads are all auto-injected via per-producing-layer
            `env_provide:` blocks, and the eight container ports are
            auto-allocated to free host ports by default: absence of a
            deploy-level `port:` key IS auto-allocation (`/charly-core:deploy`
            "Auto port mapping" — the legacy `port: [auto]` sentinel is retired).
            The user's browser is on the
            host; container-internal `localhost:N` URLs do NOT resolve there —
            but the auto-derived `*_PUBLIC_URL` vars correctly carry the
            host-side mapping, so the browser-bound and kernel-bound URL spaces
            stay in sync automatically:
            
            ```yaml
            versa:
              pod:
                image: versa
                disposable: true
                lifecycle: dev
                # No port: key — every image-declared container port auto-allocates to a
                # free host port. The resolved expansion is persisted as `resolved_port:`
                # alongside this entry on the next `charly config versa` / `charly update
                # versa` run.
            ```
            
            That's the entire entry. No `env:` block — the seven URL env vars
            flow from layer `env_provide:`:
            
            | env var | Producer layer | Template |
            |---|---|---|
            | `MARTIN_PUBLIC_URL` | `osm-tools` | `http://127.0.0.1:{{.HostPort 3000}}` |
            | `AIRFLOW_PUBLIC_URL` | `airflow` | `http://127.0.0.1:{{.HostPort 8080}}` |
            | `AIRFLOW_API_INTERNAL_URL` | `airflow` | `http://{{.ContainerName}}:8080` (rewritten to `localhost:8080` same-pod) |
            | `AIRFLOW_DAGS_DIR` | `airflow` | `/workspace/dags` (static) |
            | `VERSATILES_PUBLIC_URL` | `versatiles` | `http://127.0.0.1:{{.HostPort 8090}}` |
            | `VERSATILES_STYLE_PUBLIC_URL` | `versatiles-frontend` | `http://127.0.0.1:{{.HostPort 8002}}/style` |
            | `VERSATILES_ASSETS_PUBLIC_URL` | `versatiles-frontend` | `http://127.0.0.1:{{.HostPort 8002}}` |
            
            If you need stable host ports across rebuilds (e.g. browser
            bookmarks), pin them with an explicit `port:` list (the container
            side; unlisted container ports keep auto-allocating) — the
            `env_provide:` templates substitute against whichever ports you
            chose, so the URL env vars stay correct either way:
            
            ```yaml
            versa:
              pod:
                image: versa
                port:
                  - "22718:2718"
                  - "28080:8080"
                  - "23000:3000"
                  - "28000:8000"
                  - "28001:8001"
                  - "28002:8002"
                  - "28090:8090"
            ```
            
            For cross-pod topologies (airflow in a separate pod on the shared
            `charly` podman network), no special handling needed — the
            `AIRFLOW_API_INTERNAL_URL` template renders to
            `http://<airflow-pod-name>:8080` because `{{.ContainerName}}`
            resolves to the airflow image's container, and `podAwareEnvProvides`
            only rewrites to `localhost` when consumer and producer share a pod.
            
            **To verify the resolved URLs once the deploy is running**, open the
            notebook — the new diagnostic cell at the top (`_resolved_urls`)
            renders a polars DataFrame listing every URL env var, its current
            value, and whether it came from `env_provide` injection or the
            fallback default. See `/charly-versa:notebook-osm` cell #2.
            
            ### Multi-instance pattern (Pattern A from /charly-core:deploy)
            
            Run multiple instances of versa side-by-side using the
            `<base>/<instance>` deploy-key form. Each instance gets its own
            container (`charly-versa`, `charly-versa-ecovoyage`, …), its own workspace
            volume, and its own host-port mappings:
            
            ```yaml
            versa:
              pod:
                image: versa
                disposable: true
                # No port: key — every container port auto-allocates to a free host port.
            
            versa/ecovoyage:
              pod:
                image: versa               # SAME image, explicit field required
                disposable: true
                volume:
                  - name: workspace
                    type: bind
                    host: /home/user/projects/ecovoyage
                port:
                  - "32718:2718"           # explicit pinned ports for stable bookmarks
                  - "38080:8080"
                  - "33000:3000"
                  - "38000:8000"
                  - "38001:8001"
                  - "38002:8002"
                  - "38090:8090"
            ```
            
            CLI: `charly update versa/ecovoyage` ↔ `charly update versa -i ecovoyage`.
            
            ### Pinned-version pattern (Pattern B from /charly-core:deploy)
            
            Run a specific image tag under an arbitrary deploy name (useful for
            canaries, regression bisection, or holding back a specific version):
            
            ```yaml
            versa-pinned-2026.131.2134:
              pod:
                image: ghcr.io/opencharly/versa:2026.131.2134  # exact ref, never re-resolved
                disposable: true
                # No port: key — every container port auto-allocates to a free host port.
            ```
            
            Container name: `charly-versa-pinned-2026.131.2134`. CLI:
            `charly update versa-pinned-2026.131.2134`. The deploy key has no
            relation to the image name; `charly update` always pulls the exact tag
            declared in `image:`.
            
            ## MCP servers
            
            This image publishes one MCP endpoint (registered by this plugin's
            `.mcp.json`):
            
            | Name | Container URL | Tool count | Skill |
            |---|---|---:|---|
            | marimo | `http://localhost:2718/mcp/server` | 10 (read-only inspection) | `/charly-versa:marimo-mcp` |
            
            The marimo MCP server name reflects the upstream software identity,
            not OUR image identity. There is no `airflow` MCP — no Airflow-3 /
            `/api/v2` release of the upstream `mcp-server-apache-airflow` package
            exists, so consumers drive Airflow via direct REST `/api/v2/` calls
            instead.
            
