immich-ml:
    candy:
        # CachyOS GPU base already carries cuda. pgvector is AUR-only on Arch, so
        # this image opts into build:[pac, aur] — the arch-builder's yay compiles
        # it (the postgresql layer declares the AUR package).
        base: nvidia
        build:
            - pac
            - aur
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.237.804'
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
            - '@github.com/opencharly/layer-python-ml:v2026.237.0808'
            - '@github.com/opencharly/layer-supervisord:v2026.239.1300'
            - '@github.com/opencharly/pod-postgresql:v2026.237.458'
            - '@github.com/opencharly/layer-vectorchord:v2026.237.937'
            - '@github.com/opencharly/pod-redis:v2026.237.458'
            - '@github.com/opencharly/pod-immich:v2026.237.806'
            - '@github.com/opencharly/pod-immich-ml:v2026.237.936'
            - '@github.com/opencharly/pod-dbus:v2026.235.2115'
