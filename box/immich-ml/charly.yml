immich-ml:
    candy:
        # CachyOS GPU base already carries cuda. pgvector is AUR-only on Arch, so
        # this image opts into build:[pac, aur] — the arch-builder's yay compiles
        # it (the postgresql layer declares the AUR package).
        base: nvidia
        build:
            - pac
            - aur
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.271.1839'
            - '@github.com/opencharly/layer-nodejs:v2026.272.0322'
            - '@github.com/opencharly/layer-python-ml:v2026.272.0436'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
            - '@github.com/opencharly/pod-postgresql:v2026.272.0233'
            - '@github.com/opencharly/layer-vectorchord:v2026.273.1836'
            - '@github.com/opencharly/pod-redis:v2026.272.0226'
            - '@github.com/opencharly/pod-immich:v2026.272.0105'
            - '@github.com/opencharly/pod-immich-ml:v2026.272.0102'
            - '@github.com/opencharly/pod-dbus:v2026.272.0105'
