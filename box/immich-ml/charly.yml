immich-ml:
    candy:
        # CachyOS GPU base already carries cuda. pgvector is AUR-only on Arch, so
        # this image opts into build:[pac, aur] — the arch-builder's yay compiles
        # it (the postgresql layer declares the AUR package).
        base: nvidia
        build:
            - pac
            - aur
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): `pod-immich-ml`
            # provides pod-immich (→ layer-nodejs, layer-supervisord, pod-postgresql,
            # pod-redis); `pod-dbus` provides layer-supervisord; `layer-vectorchord`
            # provides pod-postgresql — so none of those are re-listed here.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/layer-python-ml:v2026.243.0515'
            - '@github.com/opencharly/layer-vectorchord:v2026.251.1508'
            - '@github.com/opencharly/pod-immich-ml:v2026.255.1229'
            - '@github.com/opencharly/pod-dbus:v2026.243.1831'
