versa:
    candy:
        enabled: true
        base: cachyos
        build:
            - pac
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): `pod-airflow`
            # provides `pod-marimo` → `layer-cuda` (which itself provides `layer-nvidia`),
            # and `pod-versatiles-frontend` provides the layer-versatiles-* bundle — so
            # layer-cuda / layer-nvidia / layer-versatiles-* are NOT re-listed here.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/pod-airflow:v2026.243.1854' # Airflow 3.x LocalExecutor + pod-marimo (marimo notebook + MCP server) + layer-cuda + layer-nvidia
            - '@github.com/opencharly/pod-osm-tools:v2026.239.1629' # tippecanoe + gdal + martin (PMTiles tile server) + pmtiles CLI
            - '@github.com/opencharly/pod-maputnik:v2026.239.1625' # MapLibre style editor (built from npm source, served by python -m http.server)
            - '@github.com/opencharly/pod-pmtiles-viewer:v2026.243.0508' # protomaps/PMTiles /app SPA — visual inspector for PMTiles archives (port 8001)
            - '@github.com/opencharly/layer-shortbread:v2026.243.0410' # systemed/tilemaker + shortbread-tilemaker Lua config — generates shortbread-schema vector tiles from OSM PBF
            # layer-versatiles-style / -fonts / -maplibre-versatiles-styler are provided
            # by the composed meta-layer `pod-versatiles-frontend` (which re-exports them
            # at /style/, /fonts/, /styler/) — so they are NOT re-listed here.
            - '@github.com/opencharly/pod-versatiles:v2026.243.0411' # versatiles-rs CLI + `versatiles serve` supervisord service on port 8090 (host-mapped 28090) — convert/serve for .versatiles/.pmtiles/.mbtiles
            - '@github.com/opencharly/pod-versatiles-frontend:v2026.243.0819' # versatiles-org/versatiles-frontend SPA (port 8002) — visual tile-content explorer; also re-exports versatiles-style/fonts/styler at /style/, /fonts/, /styler/
            - '@github.com/opencharly/layer-notebook-osm:v2026.240.0121' # data layer: seeds /workspace/notebooks/osm-monaco-viz.py (notebook self-authors its DAG at runtime)
            - '@github.com/opencharly/layer-notebook-graph:v2026.239.1639' # data layer: seeds /workspace/notebooks/gpu-libraries-demo.py — cuGraph/cuML/PyG/graphistry demo
            - '@github.com/opencharly/layer-debug-tools:v2026.239.1629' # network/process/file inspection toolkit for debugging the deployed services in this image
            - '@github.com/opencharly/pod-dbus:v2026.243.1831'
        plan:
            - check: |
                command=${HOME}/.pixi/envs/default/bin/marimo export ipynb \
                  /workspace/notebooks/osm-monaco-viz.py \
                  --include-outputs --sort topological \
                  -o /tmp/notebook-run.ipynb -f
              id: versa-notebook-export
              exit_status: 0
              timeout: 600s
              context:
                - runtime
              command:
                command: |
                    ${HOME}/.pixi/envs/default/bin/marimo export ipynb \
                      /workspace/notebooks/osm-monaco-viz.py \
                      --include-outputs --sort topological \
                      -o /tmp/notebook-run.ipynb -f
                in_container: true
            - check: command=wc -c < /tmp/notebook-run.ipynb
              id: versa-notebook-size
              stdout:
                - matches: "[1-9][0-9]{5,}" # >=100KB rendered ipynb (no anchors per /charly-check:check gotcha #6)
              context:
                - runtime
              command:
                command: wc -c < /tmp/notebook-run.ipynb
                in_container: true
            - check: http=http://127.0.0.1:${HOST_PORT:3000}/monaco
              id: versa-martin-monaco
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:3000}/monaco"
                status: 200
                body:
                    - contains: "tilejson"
                    - contains: "vector_layers"
            - check: http=http://127.0.0.1:${HOST_PORT:3000}/monaco-gpqtiles
              id: versa-martin-monaco-gpqtiles
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:3000}/monaco-gpqtiles"
                status: 200
                body:
                    - contains: "tilejson"
            - check: http=http://127.0.0.1:${HOST_PORT:3000}/monaco-duckdb-mvt
              id: versa-martin-monaco-duckdb-mvt
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:3000}/monaco-duckdb-mvt"
                status: 200
                body:
                    - contains: "tilejson"
            - check: http=http://127.0.0.1:${HOST_PORT:3000}/monaco-duckdb-freestiler
              id: versa-martin-monaco-duckdb-freestiler
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:3000}/monaco-duckdb-freestiler"
                status: 200
                body:
                    - contains: "tilejson"
            - check: |
                command=curl -fsSI "http://127.0.0.1:${HOST_PORT:8090}/tiles/monaco-shortbread/0/0/0.pbf" \
                  | awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub("\r",""); print $2}'
              id: versa-versatiles-shortbread-tile
              stdout:
                - matches: "[1-9][0-9]+" # any positive byte count (PBF non-empty)
              context:
                - runtime
              command:
                command: |
                    curl -fsSI "http://127.0.0.1:${HOST_PORT:8090}/tiles/monaco-shortbread/0/0/0.pbf" \
                      | awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub("\r",""); print $2}'
                in_container: false
            - check: command=wc -c < /workspace/tiles/work/monaco.parquet
              id: versa-artifact-parquet
              stdout:
                - matches: "[1-9][0-9]{5,}" # >=100KB
              context:
                - runtime
              command:
                command: wc -c < /workspace/tiles/work/monaco.parquet
                in_container: true
            - check: command=wc -c < /workspace/tiles/pmtiles/monaco.pmtiles
              id: versa-artifact-pmtiles
              stdout:
                - matches: "[1-9][0-9]{5,}" # >=100KB
              context:
                - runtime
              command:
                command: wc -c < /workspace/tiles/pmtiles/monaco.pmtiles
                in_container: true
            - check: command=wc -c < /workspace/gtfs/raw/monaco.gtfs.zip
              id: versa-artifact-gtfs
              stdout:
                - matches: "[1-9][0-9]{5,}" # >=100KB
              context:
                - runtime
              command:
                command: wc -c < /workspace/gtfs/raw/monaco.gtfs.zip
                in_container: true
            - check: command=wc -c < /workspace/tiles/shortbread/monaco-shortbread.pmtiles
              id: versa-artifact-shortbread
              stdout:
                - matches: "[1-9][0-9]{5,}" # >=100KB
              context:
                - runtime
              command:
                command: wc -c < /workspace/tiles/shortbread/monaco-shortbread.pmtiles
                in_container: true
            - check: |
                command=${HOME}/.pixi/envs/default/bin/python -c '
                import cugraph, cuml, nx_cugraph, pylibcugraph
                import torch_geometric, torch_scatter, torch_sparse, torch_cluster
                import graphistry, torch
                print(f"cugraph={cugraph.__version__}")
                print(f"cuml={cuml.__version__}")
                print(f"pyg={torch_geometric.__version__}")
                print(f"torch_scatter={torch_scatter.__version__}")
                print(f"graphistry={graphistry.__version__}")
                print(f"cuda_devices={torch.cuda.device_count()}")
                '
              id: versa-graph-imports
              stdout:
                - matches: "cugraph=[0-9]+"
                - matches: "cuml=[0-9]+"
                - matches: "pyg=[0-9]+"
                - matches: "torch_scatter=[0-9]+"
                - matches: "graphistry=[0-9]+"
                - matches: "cuda_devices=[1-9]"
              context:
                - runtime
              command:
                command: |
                    ${HOME}/.pixi/envs/default/bin/python -c '
                    import cugraph, cuml, nx_cugraph, pylibcugraph
                    import torch_geometric, torch_scatter, torch_sparse, torch_cluster
                    import graphistry, torch
                    print(f"cugraph={cugraph.__version__}")
                    print(f"cuml={cuml.__version__}")
                    print(f"pyg={torch_geometric.__version__}")
                    print(f"torch_scatter={torch_scatter.__version__}")
                    print(f"graphistry={graphistry.__version__}")
                    print(f"cuda_devices={torch.cuda.device_count()}")
                    '
                in_container: true
            - check: |
                command=${HOME}/.pixi/envs/default/bin/python -c '
                import networkx as nx
                G = nx.karate_club_graph()
                pr = nx.pagerank(G, backend="cugraph")
                print(f"pr_rows={len(pr)}")
                print(f"pr_top_node={max(pr, key=pr.get)}")
                '
              id: versa-graph-cugraph-pagerank
              stdout:
                - matches: "pr_rows=[1-9][0-9]+"
                - matches: "pr_top_node=[0-9]+"
              context:
                - runtime
              command:
                command: |
                    ${HOME}/.pixi/envs/default/bin/python -c '
                    import networkx as nx
                    G = nx.karate_club_graph()
                    pr = nx.pagerank(G, backend="cugraph")
                    print(f"pr_rows={len(pr)}")
                    print(f"pr_top_node={max(pr, key=pr.get)}")
                    '
                in_container: true
            - check: |
                command=${HOME}/.pixi/envs/default/bin/marimo export ipynb \
                  /workspace/notebooks/gpu-libraries-demo.py \
                  --include-outputs --sort topological \
                  -o /tmp/gpu-demo.ipynb -f
              id: versa-graph-notebook-export
              exit_status: 0
              timeout: 600s
              context:
                - runtime
              command:
                command: |
                    ${HOME}/.pixi/envs/default/bin/marimo export ipynb \
                      /workspace/notebooks/gpu-libraries-demo.py \
                      --include-outputs --sort topological \
                      -o /tmp/gpu-demo.ipynb -f
                in_container: true
            - check: command=wc -c < /tmp/gpu-demo.ipynb
              id: versa-graph-notebook-size
              stdout:
                - matches: "[1-9][0-9]{4,}" # >=10KB rendered ipynb (matches the 18KB observed live)
              context:
                - runtime
              command:
                command: wc -c < /tmp/gpu-demo.ipynb
                in_container: true
