crabbox-e2e:
    candy:
        enabled: true
        base: cachyos
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.239.1607'
            - '@github.com/opencharly/layer-crabbox:v2026.247.0855'
            - '@github.com/opencharly/plugin-crabbox/candy/plugin-crabbox:v0'
            - '@github.com/opencharly/pod-crabbox:v0'
            - '@github.com/opencharly/layer-container-nesting:v2026.239.1647'
        plan:
            - run: preload the lease and smoke images at BUILD time — the build network has working DNS; runtime nested pulls would depend on the box's resolver (host-dependent), so bake the images into the box storage for host-independent beds
              command: |
                podman pull docker.io/library/ubuntu:26.04 >/dev/null 2>&1 || true
                podman pull quay.io/libpod/alpine:latest >/dev/null 2>&1 || true
