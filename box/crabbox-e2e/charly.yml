crabbox-e2e:
    candy:
        enabled: true
        base: cachyos
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.239.1607'
            - '@github.com/opencharly/layer-crabbox:v2026.247.0855'
            - '@github.com/opencharly/plugin-crabbox/candy/plugin-crabbox:v0'
            - '@github.com/opencharly/pod-crabbox:v0'
            - '@github.com/opencharly/layer-container-nesting:v2026.239.1647'
        plan:
            - run: point the NESTED podman's containers at a working resolver — the built-in gateway resolver is HOST-dependent (baked containers.conf dns_servers; podman-inside-the-build-container cannot run at all: no unmask=/proc/* in the build context, so a build-time preload pull was impossible — RCA round 4)
              command: |
                printf '\n[containers]\ndns_servers = ["9.9.9.9"]\n' >> "$HOME/.config/containers/containers.conf"
