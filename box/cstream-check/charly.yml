cstream-check:
    candy:
        # The WITNESS box for check-cstream-pod: the production cstream box plus the
        # login fixture, and nothing else.
        #
        # It exists so `cstream` itself never carries a credential. The login gate
        # needs an account whose password is known; baking that into the shipped box
        # would hand the same password to every consumer of it. Composing the fixture
        # HERE keeps the production box credential-free while still letting the bed
        # authenticate for real.
        base: cachyos
        builder:
            cargo: arch.arch-builder
        build:
            - pac
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-cstream-desktop:v2026.243.0331'
            - cstream-probe-account
            # plugin-cstream serves the `cstream:` check verb OUT OF PROCESS, and charly
            # reads its `primary:` declaration off candies in scan range -- so without it
            # here the bed's `cstream: status` step fails to parse with
            # "plugin verb cstream takes a MAP input". It belongs to the WITNESS box, not
            # to `cstream`: a shipped desktop box has no business carrying a check plugin.
            - '@github.com/opencharly/plugin-cstream/candy/plugin-cstream:v2026.242.1502'
