nvidia-cdi:
    candy:
        # The CDI POD base. Its base is opencharly/pod-cdi, which composes layer-cdi and
        # FAILS its own build when a driver user-space or an nvidia binary is baked in.
        #
        # The former base was `cachyos` with layer-nvidia composed alongside layer-cdi —
        # the VM contract and the POD contract in one image. A pod must not bake a driver:
        # the kernel module is host-global and the runtime injects the user-space per
        # container through /etc/cdi/nvidia.yaml. `nvidia-ctk` is a HOST tool and never
        # executes inside a container. opencharly/vm-nvidia is where layer-nvidia belongs.
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        # The AUR route, declared ONCE for every box that bases on this one. Builder
        # maps do NOT cross a namespace boundary and this base's own chain (podcdi ->
        # pod-cdi) declares none, so without this line a box that bases on `nvidia-cdi`
        # and composes a candy declaring `distro.arch.aur` has no builder to route the
        # declaration to and fails the build naming the candy. The two selkies CDI boxes
        # declare only `pixi`, and they are exactly that shape. Same route the cachyos
        # base declares; the other three formats are unchanged here (no box in this
        # family declares an npm/pixi/cargo package it cannot already build).
        builder:
            aur: arch.arch-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            - '@github.com/opencharly/layer-cdi:v2026.323.1618'
            # v2026.323.0252 is the release that DROPS `require: layer-nvidia`
            # (opencharly/layer-cuda#30). Until it, the toolkit dragged the VM driver
            # user-space into every pod that composed it, so `layer-nvidia`'s
            # `nvidia-ctk` assertions ran on an image whose composition deletes the
            # binary, and its prefix-glob strip took `libcudart` after the stitch. The
            # toolkit no longer names the driver, so a pod that composes it composes
            # no driver layer — the substrate now decides, which is the whole point.
            - '@github.com/opencharly/layer-cuda:v2026.323.1604'
