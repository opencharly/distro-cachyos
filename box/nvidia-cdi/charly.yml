nvidia-cdi:
    candy:
        # CachyOS GPU base — the Arch-derived analogue of the Fedora `nvidia`
        # image. Inherits build:[pac] + builder→arch.arch-builder from the cachyos
        # base (same namespace). The nvidia + cuda layers are multi-distro and
        # install the Arch GPU stack (nvidia-utils, nvidia-container-toolkit,
        # cuda, cudnn, onnxruntime).
        base: cachyos
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            - '@github.com/opencharly/layer-nvidia:v2026.320.1938'
            # The CDI CONTRACT (opencharly/layer-cdi): asserts at build time that no driver
            # user-space or nvidia* binary is baked, and at check time that the container resolved
            # the INJECTED host driver at the running kernel module's version. The `-cdi` suffix on
            # every GPU box name is what makes that expectation visible.
            - '@github.com/opencharly/layer-cdi:v2026.321.1630'
            - '@github.com/opencharly/layer-cuda:v2026.321.1520'
