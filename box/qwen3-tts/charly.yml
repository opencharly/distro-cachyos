qwen3-tts:
    candy:
        # CachyOS base (operator direction), NOT fedora: torch's cu130 wheels carry their
        # own CUDA runtime and the driver arrives through CDI at runtime, so no CUDA
        # layer is needed — and the cachyos base is the distro this host runs.
        base: cachyos
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/pod-qwen3-tts:fe33eb1c12536ec8c52c83aeed0ee96e375574d2'
        # No box-level check PLAN: the candy's own plan proves the server script and that
        # the pixi environment imports torch/soundfile/qwen_tts. The composed IMAGE is
        # proven by the disposable bed `check-qwen3-tts-pod` in this repo's charly.yml.
