githubrunner:
    candy:
        enabled: true
        base: cachyos
        build:
            - pac
        platform:
            - linux/amd64
        # No uid/user override and NO image-level security: block → resolves to
        # container-nesting's rootless posture (cap_add:[], unmask=/proc/*,
        # /dev/fuse, /dev/net/tun) at uid 1000. Same shape as openclaw-desktop.
        network: host
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): the meta-layer
            # `pod-github-runner` provides `layer-container-nesting` — so the box does not
            # re-list it.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/pod-github-runner:v2026.243.0410'
            - '@github.com/opencharly/layer-charly:v2026.269.2324'
            # gh: the org's pr-validator workflow drives `gh api/pr comment/pr merge`
            # (opencharly/.github/.github/workflows/pr-validator.yml) and the runner
            # is where it runs once vars.REVIEW_RUNNER_LABEL points here. GitHub
            # Runner Images ship gh; this rootless CachyOS runner must install it.
            - '@github.com/opencharly/layer-gh:v2026.239.1624'
            - '@github.com/opencharly/pod-dbus:v2026.243.1831'
