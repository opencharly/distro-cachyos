githubrunner:
    candy:
        enabled: true
        base: cachyos
        build:
            - pac
        platform:
            - linux/amd64
        # No uid/user override and NO image-level security: block → resolves to
        # container-nesting's rootless posture (cap_add:[], unmask=/proc/*,
        # /dev/fuse, /dev/net/tun) at uid 1000. Same shape as openclaw-desktop.
        network: host
        candy:
            - '@github.com/opencharly/charly/candy/agent-forwarding:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/github-runner:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/charly:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/dbus:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/container-nesting:v2026.201.0706'
