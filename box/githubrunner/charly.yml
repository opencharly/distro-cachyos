githubrunner:
    candy:
        enabled: true
        base: cachyos
        build:
            - pac
        platform:
            - linux/amd64
        # No uid/user override and NO image-level security: block → resolves to
        # container-nesting's rootless posture (cap_add:[], unmask=/proc/*,
        # /dev/fuse, /dev/net/tun) at uid 1000. Same shape as openclaw-desktop.
        network: host
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.239.1607'
            - '@github.com/opencharly/pod-github-runner:v2026.239.1639'
            - '@github.com/opencharly/charly/candy/charly:v2026.240.0831'
            - '@github.com/opencharly/pod-dbus:v2026.239.1555'
            - '@github.com/opencharly/layer-container-nesting:v2026.239.1647'
