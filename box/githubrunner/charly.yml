githubrunner:
    candy:
        enabled: true
        base: cachyos
        build:
            - pac
        platform:
            - linux/amd64
        # No uid/user override and NO image-level security: block → resolves to
        # container-nesting's rootless posture (cap_add:[], unmask=/proc/*,
        # /dev/fuse, /dev/net/tun) at uid 1000. Same shape as openclaw-desktop.
        network: host
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/pod-github-runner:v2026.243.0410'
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
            - '@github.com/opencharly/pod-dbus:v2026.243.1831'
            - '@github.com/opencharly/layer-container-nesting:v2026.239.1647'
            # LAST, and it must stay last: the container-nesting pre-pull step
            # leaves the BUILT image's /tmp root:root 0755, which breaks uid-1000
            # supervisord (logfile=/tmp/supervisord.log) and pod-dbus
            # (unix:path=/tmp/dbus-session). See candy/tmp-sticky for the RCA.
            - tmp-sticky
