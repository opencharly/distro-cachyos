cachyos-pacstrap-builder:
    candy:
        # base: arch.arch — the `arch` base from the opencharly/distro-arch submodule, via
        # the `arch` import namespace. Its only layer (pacstrap-builder) is pulled by
        # github reference (a main-repo candy, shared with arch-pacstrap-builder).
        base: arch.arch
        build:
            - pac
        distro:
            - arch
        candy:
            - '@github.com/opencharly/layer-pacstrap-builder:v2026.239.1633'
        # No box-level check: the pacstrap/arch-install-scripts/grub/parted toolchain
        # checks live on the pacstrap-builder candy, so ONE check covers this box AND
        # arch-pacstrap-builder.
