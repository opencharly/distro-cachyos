selkies-labwc-nvidia-cdi:
    candy:
        # labwc selkies flavor on the CachyOS GPU POD base (podcdi.pod-cdi) with REAL
        # NVENC: builder.pixi → arch.cuda-arch-builder, whose nvcc + ffnvcodec NVENC
        # headers let the selkies layer's build.sh compile pixelflux's real nvenc-sys
        # encoder (the stock arch-builder has no CUDA → NVENC stub). chrome + wlrctl
        # from the aur builder (no build: opt-in — opencharly/sdk#608). Renamed from selkies-desktop-nvidia.
        base: podcdi.pod-cdi
        build:
            - pac
        builder:
            pixi: arch.cuda-arch-builder
            # The AUR route the retired `nvidia-cdi` alias declared; a builder map does
            # not cross a namespace boundary, so it is carried here (opencharly/layer-cuda#34).
            aur: arch.arch-builder
        platform:
            - linux/amd64
        candy:
            # The skill carrier this image owns its skill in — see candy/cachyos-selkies-skills/charly.yml
            - cachyos-selkies-skills
            - '@github.com/opencharly/pod-selkies-desktop:v2026.274.1323'
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
        plan:
            - check: command=strings ${HOME}/.pixi/envs/default/lib/python3.*/site-packages/pixelflux/pixelflux_wayland*.so | grep -q NvEncodeAPICreateInstance && echo NVENC-COMPILED
              id: pixelflux-nvenc-compiled
              exit_status: 0
              stdout:
                - contains: "NVENC-COMPILED"
              context:
                - build
              command: strings ${HOME}/.pixi/envs/default/lib/python3.*/site-packages/pixelflux/pixelflux_wayland*.so | grep -q NvEncodeAPICreateInstance && echo NVENC-COMPILED
