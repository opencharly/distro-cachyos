ollama-cdi:
    candy:
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        # The default models this GPU ollama pod always carries. Small vision-capable models
        # sized for the VRAM left beside ComfyUI/strata on a 16 GB card (measured: ~2.79 GiB
        # free with ComfyUI idle-but-loaded): each runs fully on the GPU in that window.
        # Pulled once at container start by the pod-ollama wrapper; idempotent, so later
        # starts are no-ops. The store is the persistent `models` volume.
        env:
            OLLAMA_PULL_MODELS: "qwen3-vl:2b-instruct-q4_K_M qwen3.5:2b-q4_K_M lfm3-vl:2b-qad-q4_0 bonsai-2:2b-q2_0"
        candy:
            - '@github.com/opencharly/pod-ollama:v2026.327.1941'
            # The CUDA backend is composed HERE, not required by the ollama candy:
            # this box sits on the NVIDIA base, so it opts into the GPU backend while
            # a CPU-only consumer of the same candy pays nothing for it.
            # On Arch this resolves to the split `ollama-cuda` package, which depends
            # on `ollama` and drops its backend into the same runner directory.
            - '@github.com/opencharly/layer-ollama-cuda:v2026.327.2154'
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
