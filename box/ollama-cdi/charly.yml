ollama-cdi:
    candy:
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        # The default models this GPU ollama pod always carries: small vision-capable models,
        # chosen by SIZING ESTIMATE for the VRAM left beside ComfyUI/strata on a 16 GB card
        # (measured free window: ~2.79 GiB with ComfyUI idle-but-loaded; q4_0/q4_K_M download
        # sizes 1.9 / 1.95 / 1.43 / 0.87 GB). One of them, qwen3-vl:2b-instruct-q4_K_M, was
        # measured running at 100% GPU (1.9 GiB / 1.9 GiB) in a free window; the others are
        # sized to fit the same window, not individually measured. Pulled once at container
        # start by the pod-ollama wrapper; idempotent, so later starts are no-ops. The store is
        # the persistent `models` volume.
        env:
            OLLAMA_PULL_MODELS: "qwen3-vl:2b-instruct-q4_K_M qwen3.5:2b-q4_K_M lfm3-vl:2b-qad-q4_0 bonsai-2:2b-q2_0"
        candy:
            - '@github.com/opencharly/pod-ollama:v2026.327.1941'
            # The CUDA backend is composed HERE, not required by the ollama candy:
            # this box sits on the NVIDIA base, so it opts into the GPU backend while
            # a CPU-only consumer of the same candy pays nothing for it.
            # On Arch this resolves to the split `ollama-cuda` package, which depends
            # on `ollama` and drops its backend into the same runner directory.
            - '@github.com/opencharly/layer-ollama-cuda:v2026.327.2154'
            # CLASS 2 — the toolkit is this consumer's own: the ollama CUDA backend LINKS its
            # runtime libraries, and the pod base no longer pulls the toolkit (pod-cdi#17).
            - '@github.com/opencharly/layer-cuda:v2026.329.2022'
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
