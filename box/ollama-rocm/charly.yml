ollama-rocm:
    candy:
        # Plain CachyOS base, deliberately NOT the nvidia one: this is the AMD
        # sibling of the `ollama` box, and the ollama-rocm package bundles its own
        # HIP/HSA runtime (libamdhip64, libhsa-runtime64, libhipblas), so no
        # NVIDIA/CUDA base and no separate rocm candy are involved.
        base: cachyos
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            - '@github.com/opencharly/pod-ollama:v2026.274.0620'
            - '@github.com/opencharly/layer-ollama-rocm:v2026.274.0637'
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
