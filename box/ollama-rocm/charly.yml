ollama-rocm:
    candy:
        # Plain CachyOS base, deliberately NOT the nvidia one: this is the AMD
        # sibling of the `ollama` box, and the ollama-rocm package bundles its own
        # HIP/HSA runtime (libamdhip64, libhsa-runtime64, libhipblas), so no
        # NVIDIA/CUDA base and no separate rocm candy are involved.
        base: cachyos
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): `layer-ollama-rocm`
            # provides `pod-ollama`, so the pod is not re-listed.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/layer-ollama-rocm:v2026.243.1755'
            - '@github.com/opencharly/pod-dbus:v2026.243.1831'
