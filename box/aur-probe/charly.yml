aur-probe:
    candy:
        description: |
            Minimal image for the cachyos AUR route: the cachyos base plus one candy that
            declares a single AUR package. Nothing else — no workload, no service — so the
            only thing a build of it can prove or fail on is whether the declaration is
            routed to a builder box and installed.

            It declares no `builder:` map of its own: the route is inherited from
            `base: cachyos`, which routes `aur` to `arch.arch-builder`. A box that had to
            repeat that map would be the duplication this mechanism exists to remove.
        base: cachyos
        platform:
            - linux/amd64
        build:
            - pac
        candy:
            - aur-probe
            # The builder plugin this box routes to, pinned at a release whose OpResolve
            # reply carries `BuilderPackageOutput` — the contract that makes the package
            # reach the image (opencharly/sdk#608). An out-of-process plugin is selected
            # from the project's own candy closure (the connect path's pass-1), so a
            # project that composes the aur route must name the plugin here; measured: with
            # no project pin the build served v2026.271.2317, whose reply carries a payload
            # and no package, and the image shipped without yay while the build stayed
            # green (opencharly/sdk#615). The host now REFUSES such a reply at its first message
            # (opencharly/sdk#619), so this pin is a normal out-of-process dependency rather than a
            # stopgap: a stale one fails loudly instead of shipping an image without the package.
            - '@github.com/opencharly/plugin-builder-aur/candy/plugin-builder-aur:v2026.327.0012'
        plan:
            - check: the AUR-installed yay the candy declares reaches the image, on PATH
              id: aur-probe-image-yay
              exit_status: 0
              command: command -v yay
            - check: yay runs inside the built image
              id: aur-probe-image-yay-version
              exit_status: 0
              stdout:
                - matches: "yay v[0-9]"
              command: yay --version
