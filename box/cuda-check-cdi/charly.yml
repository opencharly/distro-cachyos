cuda-check-cdi:
    candy:
        # GPU compute-smoke image for the VFIO-passthrough check: podcdi.pod-cdi —
        # the POD base, so NO baked driver user-space and no nvidia-ctk (the driver is
        # injected through CDI at runtime) — with the CUDA runtime stitched as
        # `libcudart`, plus the locally-vendored cuda-smoke layer (a baked
        # nvcc-compiled vector-add that prints CUDA-OK).
        # The check-cachyos-gpu-vm bed loads this into the GPU VM guest and runs it
        # as a `--device nvidia.com/gpu=all` container to prove real device compute.
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        candy:
            # CLASS 3 — this image COMPILES with nvcc, so it composes the toolkit itself; the
            # pod base no longer pulls it (pod-cdi#17).
            - '@github.com/opencharly/layer-cuda:v2026.329.2022'
            - cuda-smoke
