ollama:
    candy:
        base: nvidia
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): `layer-ollama-cuda`
            # provides `pod-ollama`, so the pod is not re-listed.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            # The CUDA backend is composed HERE, not required by the ollama candy:
            # this box sits on the NVIDIA base, so it opts into the GPU backend while
            # a CPU consumer of the same candy (openclaw-desktop) pays nothing for it.
            # On Arch this resolves to the split `ollama-cuda` package, which depends
            # on `ollama` and drops its backend into the same runner directory.
            # layer-ollama-cuda itself provides `pod-ollama`.
            - '@github.com/opencharly/layer-ollama-cuda:v2026.243.1754'
            - '@github.com/opencharly/pod-dbus:v2026.243.1831'
