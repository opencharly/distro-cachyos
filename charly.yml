              command:
                command: |
                    if [ -e /dev/nvidiactl ] || nvidia-smi >/dev/null 2>&1; then
                      command -v nvidia-ctk
                    else
                      echo "host NVIDIA driver not active (vfio passthrough or no GPU) — toolkit check N/A"
                    fi
                in_container: false
            - check: |
                command=if [ -e /dev/nvidiactl ] || nvidia-smi >/dev/null 2>&1; then
                  test -f /etc/cdi/nvidia.yaml
                else
                  echo "host NVIDIA driver not active (vfio passthrough or no GPU) — CDI spec N/A"
                fi
              id: nvidia-cdi-spec
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                    if [ -e /dev/nvidiactl ] || nvidia-smi >/dev/null 2>&1; then
                      test -f /etc/cdi/nvidia.yaml
                    else
                      echo "host NVIDIA driver not active (vfio passthrough or no GPU) — CDI spec N/A"
                    fi
                in_container: false
            # --- the DeepSeek Harness family (opencharly/pod-dsh) ---------------
            # The npm-global CLI + the dsh-TUI plugin. The `dsh-tui` candy ships the
            # `ollama-cloud` LLM route as ~/.dsh/cordis.patch.yml, so the route is
            # installed by the profile itself. The web GUI is deliberately NOT
            # composed here: `dsh-web` is a container (supervisord+socat) candy; the
            # host web UI is a user-scope systemd unit exposed with `tailscale
            # serve` — an operator step documented by /charly-tools:dsh. No `${...}`
            # in any command (a check command is variable-substituted, and an
            # unresolvable `${...}` silently SKIPS the step). The `check:` text is a
            # plain description; the executable lives in `command.command`.
            - check: the dsh and dsh-tui launchers are installed in the npm global bin directory
              id: dsh-cli-installed
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                    H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                    test -x "$H/.npm-global/bin/dsh" && test -x "$H/.npm-global/bin/dsh-tui"
                in_container: false
            - check: running dsh --version prints a semantic version
              id: dsh-version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              context:
                - runtime
              command:
                command: |
                    H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                    "$H/.npm-global/bin/dsh" --version
                in_container: false
            - check: the dsh-tui plugin is installed in the dsh-tui profile
              id: dsh-tui-profile-installed
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                    H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                    test -f "$H/.dsh/profiles/dsh-tui/package.json"
                in_container: false
            - check: running dsh-tui version reports the launcher and profile versions
              id: dsh-tui-version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
                - contains: "(launcher)"
                - contains: "profile:"
              context:
                - runtime
              command:
                command: |
                    H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                    "$H/.npm-global/bin/dsh-tui" version
                in_container: false
            - check: the ollama-cloud LLM route is installed in the dsh home patch
              id: dsh-ollama-route-installed
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                    H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                    test -f "$H/.dsh/cordis.patch.yml" && grep -q 'ollama-cloud' "$H/.dsh/cordis.patch.yml"
                in_container: false
# Disposable R10 witness for the two pod-dsh candy refs that charly-cachyos-app
# composes. The profile itself is a `target: local` template whose host IS the
# operator's real workstation, so the unattended R10 runs HERE, on the disposable
# CachyOS bootstrap VM: this bed `add_candy`s the SAME two refs the profile adds,
# installs them on a CachyOS guest over SSH, and then runs the SAME five probe
# COMMANDS (the shell bodies below are byte-identical to the profile's probes),
# in the venue-appropriate execution form — `command: <scalar>` routes to
# cc.Exec(), i.e. the guest's SSHExecutor, whereas the profile's probes use
# `command: {command: …, in_container: false}` because a local deploy's probe must
# run on the operator's host. The two forms differ ONLY because the venues differ;
# the bed therefore exercises the same probe commands and the same candy installs
# against a CachyOS guest, NOT the profile's literal `charly.yml` plan (a
# `target: local` plan's host-side probes cannot run against a guest). A broken
# ref, or a candy that fails to install on CachyOS, fails this bed.
check-dsh-cachyos-vm:
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole disposable R10 witness for the DeepSeek Harness family's
            composition into charly-cachyos-app. Boots the CachyOS bootstrap VM and
            deploys the two pod-dsh candy refs the profile adds — the dsh CLI
            (@deepseek-ai/dsh 0.2.0-rc.2) and the dsh-TUI plugin, whose candy ships
            the ollama-cloud route as ~/.dsh/cordis.patch.yml — then runs the same
            five probe COMMANDS as the profile's deploy-scope probes, against the
            guest (the launchers on disk, `dsh --version`, the dsh-tui profile
            manifest, `dsh-tui version`, and the ollama-cloud route). This proves
            the two refs install and behave on CachyOS; it does not execute the
            profile's own host-side plan.
        add_candy:
            - '@github.com/opencharly/pod-dsh/candy/dsh:v2026.279.1210'
            - '@github.com/opencharly/pod-dsh/candy/dsh-tui:v2026.279.1210'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            # The dsh candy ships a package.json (the npm builder installs
            # @deepseek-ai/dsh globally), so the guest deploy needs an npm-capable
            # builder image — the same published OCI ref the charly-cachyos-app
            # profile pins. Without it the walk fails: "no builder image for npm
            # (candy=dsh)".
            builder_image: ghcr.io/opencharly/arch-builder:2026.122.2252
        plan:
            - check: the dsh and dsh-tui launchers are installed in the npm global bin directory
              id: vm-dsh-cli-installed
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                test -x "$H/.npm-global/bin/dsh" && test -x "$H/.npm-global/bin/dsh-tui"
            - check: running dsh --version prints a semantic version
              id: vm-dsh-version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                "$H/.npm-global/bin/dsh" --version
            - check: the dsh-tui plugin is installed in the dsh-tui profile
              id: vm-dsh-tui-profile-installed
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                test -f "$H/.dsh/profiles/dsh-tui/package.json"
            - check: running dsh-tui version reports the launcher and profile versions
              id: vm-dsh-tui-version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
                - contains: "(launcher)"
                - contains: "profile:"
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                "$H/.npm-global/bin/dsh-tui" version
            - check: the ollama-cloud LLM route is installed in the dsh home patch
              id: vm-dsh-ollama-route-installed
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                test -f "$H/.dsh/cordis.patch.yml" && grep -q 'ollama-cloud' "$H/.dsh/cordis.patch.yml"
cachyos-vm:
    vm:
        # Bootstrap-from-scratch via cachyos-pacstrap-builder (local). The cachyos
        # distro config (pacstrap base packages, keyring, mirrors, repos) lives in
        # the embedded build vocabulary (`charly/charly.yml`).
        source:
            kind: bootstrap
            builder: pacstrap
            builder_image: cachyos-pacstrap-builder
            distro: cachyos
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
                # tmux + asciinema: the record: session capture verb (plugin-record)
                # requires tmux AND asciinema on the target. The instrument bed's
                # add_candy (layer-tmux + layer-asciinema) does NOT land in the guest
                # for a CLONE bed (no image rebuild — the clone uses the golden's
                # disk), so both must be baked into the base image the golden is
                # captured from.
                - tmux
                - asciinema
                # btrfs-progs supplies fsck.btrfs for the btrfs rootfs below.
                # Without a helper mkinitcpio warns "No fsck helpers found", and
                # its warnings escalate to "errors were encountered during the
                # build" -> `error: command failed to execute correctly`, which
                # trips charly's log-diagnostic gate on EVERY package install that
                # fires the initcpio hook. Measured live: the deploy exits 0 and
                # the gate fails the step on the error line.
                #
                # The charly#400 allowlist covers the BUILD-phase chroot noise
                # only; the deploy occurrence is not allowlistable, and should not
                # be -- the cause is a missing package.
                - btrfs-progs
            rootfs: btrfs
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 25G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
            # The charly MCP server's port, host-forwarded on a FIXED port so the
            # host-side mcp: check verb (substrate-neutral resolution, P4) can dial
            # it: the mcp_provide URL (127.0.0.1:18765/mcp) is dialed from the host
            # as-is, and the fixed 18765:18765 forward makes the host's 18765 reach
            # the guest server. The SHIPPED unit binds 127.0.0.1 (the P3 host
            # default, asserted by the bed's unit-file check); the charly-mcp-enable
            # candy writes a drop-in so the RUNNING server binds all interfaces — the
            # forward arrives on the guest's external interface. (An auto: forward
            # would need the unmerged check-env port threading; the fixed forward is
            # the merged-products design — normal inside a VM, the host system is the
            # security boundary.)
            port_forwards:
                - "18765:18765"
        # The MCP server this VM serves - the substrate-neutral mcp_provide
        # surface (P4): a kind:vm entity declares its MCP servers exactly like a
        # box does. The mcp: check verb resolves this declaration for VM/host
        # venues (no podman-inspectable OCI label on a VM).
        mcp_provide:
            - name: charly
              url: "http://127.0.0.1:18765/mcp"
              transport: http
              # Fixed-forward note: this URL's port (18765) is the FIXED host-forwarded
              # port declared above (18765:18765), so the host-side mcp: verb dials the
              # host loopback and reaches the guest server through the forward — no
              # runtime port substitution needed (plugin-mcp's fromEnv-loopback rule
              # dials host-local URLs as-is).
        ssh:
            user: cachy
            port_auto: true
            key_source: generate
        cloud_init:
            # The cachy account (sudo NOPASSWD + /bin/bash + ssh key + wheel) is
            # provisioned from ssh.user via the cloud-init create-pattern
            # (composeUsers), so no explicit users: block is needed here.
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
        # The recording surface (the instrument beds' screen capture): the distro
        # root carries ONE canonical spice channel + graphics + video set, inherited
        # by every clone/deploy (R3 — no per-bed duplication).
        libvirt:
            devices:
                channels: [{type: unix, name: org.qemu.guest_agent.0}, {type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
check-vm-clone-base:
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: 'CachyOS VM-on-VM R10 base: provisions the cachyos VM, waits for sshd + cloud-init, captures the golden snapshot at install finalize for the clone bed.'
        snapshot:
            on_finalize: golden
            mode: external
            # keep_venue: false (the shared-snapshot default) — the base VM must
            # release the golden after capture so clone VMs can open it read-only
            # (shared lock) and run in parallel. keep_venue: true left the base VM
            # holding the golden exclusively, blocking every clone at vm-create
            # ("Failed to get shared write lock"). The golden persists on disk
            # (external snapshot); the base VM is disposable and re-provisioned on
            # the next refresh run.
            keep_venue: false
        plan:
            - check: the cachyos guest reports its hostname (in-guest command probe)
              id: cvc-base-hostname
              command: "uname -n"
              stdout:
                matches: ".+"
              eventually: 300s
              retry_interval: 10s
              context: [runtime]
            - check: the guest reports its os-release (in-guest command probe)
              id: cvc-base-os
              command: "cat /etc/os-release"
              stdout:
                contains: "ID=arch"
              context: [runtime]
# Clone bed: deploys the clone entity of golden; probes prove the cloned
# guest boots and answers.
check-vm-clone:
    vm:
        from: check-vm-clone-base:golden
        disposable: true
        lifecycle: dev
        description: 'CachyOS VM-on-VM R10 clone: deploys the base at its golden snapshot (from: name:tag — the unified clone spelling), probes the cloned guest with real ssh/command verbs to prove it boots and answers.'
        plan:
            - check: the cloned guest reports its hostname (in-guest command probe)
              id: cvc-clone-hostname
              command: "uname -n"
              stdout:
                matches: ".+"
              eventually: 300s
              retry_interval: 10s
              context: [runtime]
            - check: the cloned guest reports its os-release (in-guest command probe)
              id: cvc-clone-os
              command: "cat /etc/os-release"
              stdout:
                contains: "ID=arch"
              context: [runtime]
check-instrument-cachyos-vm:
    vm:
        from: check-vm-clone-base:golden
        disposable: true
        lifecycle: dev
        add_candy:
            - '@github.com/opencharly/layer-tmux:v2026.272.0425'
            - '@github.com/opencharly/layer-asciinema:v2026.273.1825'
            # The instrument verbs' serving plugins, declared EXPLICITLY (the bed knows
            # which instruments it runs — core never maps a verb to a plugin).
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.272.0430'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.272.0412'
            - '@github.com/opencharly/plugin-media/candy/plugin-media:v2026.272.1009'
        instrument:
            - id: screen
              phase: [live]
              spice: {method: session, fps: 5}
              # The media contract's screen.mp4: the spice session's MJPEG is the
              # transcode verb's SOURCE (source_artifact), transcoded to an MP4
              # container (H.264 + yuv420p) by the host-side ffmpeg pipeline word.
              pipeline: [{transcode: {to: mp4}}]
            - id: term
              phase: [live]
              record: {method: session, record_mode: terminal}
        plan:
            - check: the cachyos instrument bed runs its subject steps
              id: subject-prove
              # The VM deploy delivers charly to a VERSIONED /tmp path
              # (/tmp/charly-<calver>-<hash>), never /usr/bin/charly — the deploy
              # "never changes PATH and never downgrades a target package". Probe
              # the actual delivery path (the glob expands to the versioned binary).
              command: 'ls /tmp/charly-*'
cachyos-bootstrap-vm-skill:
  skill:
    name: cachyos-bootstrap-vm
    family: vm
    owner: cachyos-os-skills
    triggers:
      - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"

# krun-host-vm — the VM the krun bed runs on. Reuses the Arch cloud VM entity the
# containerd beds boot (libvirt, user-mode network, generated key), so the bed needs
# no new substrate; it differs only in what is APPLIED to the guest.
#
# Why a VM and not a pod: libkrun is a microVM runtime. Its crun handler dlopens
# libkrun, loads the libkrunfw guest payload and needs /dev/kvm on the host it runs
# on — none of which a pod lease can offer, so a pod bed would re-prove the containerd
# contract under a different name rather than prove krun.
# check-krun-host-vm — the R10 bed opencharly/layer-krun#6 records as owed.
#
# WHAT IT PROVES, and why each check can FAIL for the defect it exists to prevent:
#
#   * krun-crun-handler-vocabulary — the INSTALLED crun carries the handler's own
#     annotation key. This is the check that matters: a distro crun advertises
#     `+LIBKRUN` while carrying NONE of the vocabulary the handler reads (measured:
#     Arch's crun 1.30.1-1 has ONE `krun` string and no `krun.*` keys, and a container
#     started through a handler pointing at it still reports the HOST kernel; a build
#     of ca04fdb6 with --with-libkrun has 110 and boots a 6.12.109 guest). So a
#     `+LIBKRUN` assertion alone passes for a runtime that cannot run a guest.
#   * krun-entry-point — `/usr/bin/krun` exists: that is the spelling the containerd
#     CRI handler names.
#   * krun-libraries — libkrun.so.1 AND libkrunfw.so.5 resolve through the loader.
#   * krun-kvm — /dev/kvm exists on the guest that will host guests.
#
# The `grep -aq` form is deliberate: the check runs in a minimal guest where
# `binutils` (`strings`) may not be installed, and adding a build dependency to a
# runtime assertion is how a gate starts testing its own toolchain.
check-krun-host-vm:
    vm:
        from: containerd-v4-vm
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the libkrun runtime host (opencharly/layer-krun#6): applies
            layer-krun to a disposable Arch guest and asserts the INSTALLED crun
            carries the krun handler's annotation vocabulary (not merely the
            +LIBKRUN flag), that the /usr/bin/krun entry point the containerd handler
            names exists, that libkrun 1.x and libkrunfw resolve through the loader,
            and that /dev/kvm is present for the guest it will host.
        add_candy:
            - '@github.com/opencharly/layer-krun:v2026.314.0707'
            # The bed deploys onto a VM, so the "vm" deploy substrate must be in this
            # bed's own candy closure — measured: without it, `deploy add` fails with
            # `the "vm" deploy substrate is not available in this project — its deploy
            # plugin (plugin-deploy-vm) is not in the candy closure`.
            - '@github.com/opencharly/plugin-deploy-vm/candy/plugin-deploy-vm:v2026.314.0712'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the installed crun carries the krun handler's annotation vocabulary, not just the +LIBKRUN flag
              id: krun-crun-handler-vocabulary
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: KRUN-HANDLER-VOCABULARY-PRESENT
              command: |
                set -eu
                crun --version 2>&1 | grep -q '+LIBKRUN' || {
                  echo "crun does not advertise +LIBKRUN at all" >&2
                  exit 1
                }
                grep -aq 'krun.ram_mib' /usr/bin/crun || {
                  echo "crun advertises +LIBKRUN but carries no krun handler vocabulary" >&2
                  exit 1
                }
                echo KRUN-HANDLER-VOCABULARY-PRESENT
            - check: the krun entry point the containerd handler names is installed
              id: krun-entry-point
              context:
                - runtime
              exit_status: 0
              command: |
                set -eu
                test -x /usr/bin/krun || {
                  echo "/usr/bin/krun is missing: the containerd handler has nothing to exec" >&2
                  exit 1
                }
            - check: libkrun and libkrunfw resolve through the dynamic loader
              id: krun-libraries
              context:
                - runtime
              exit_status: 0
              command: |
                set -eu
                ldconfig -p | grep -q 'libkrun.so.1' || {
                  echo "libkrun.so.1 is not on the loader path: crun's handler cannot dlopen it" >&2
                  exit 1
                }
                ldconfig -p | grep -q 'libkrunfw.so.5' || {
                  echo "libkrunfw.so.5 is not on the loader path: the guest payload cannot be loaded" >&2
                  exit 1
                }
            - check: the guest that will host krun guests exposes /dev/kvm
              id: krun-kvm
              context:
                - runtime
              exit_status: 0
              command: |
                set -eu
                test -c /dev/kvm || {
                  echo "/dev/kvm is absent: this venue cannot boot a libkrun guest" >&2
                  exit 1
                }

# =============================================================================
# check-cachyos-coder-tools-pod — the R10 bed for `cachyos-coder-tools`, and the COMPENSATING
# gate for FOUR of the six layer candies the retired non-CachyOS coder boxes were the
# only live proof of (opencharly/opencharly#1068): layer-pixi, layer-language-runtimes,
# layer-typst, layer-github-actions. The other two cannot be compensated here:
# - layer-google-cloud-npm -> its required layer-google-cloud cannot complete install.sh
#   inside a buildkit build container (opencharly/layer-google-cloud#5), measured A/B
#   against a plain container of the same base image;
# - layer-grafana-tools -> its plan needs unzip and the candy declares no distro: section,
#   so nothing installs it on pac (opencharly/layer-grafana-tools#4).
#
# The coder trio in distro-fedora / distro-debian / distro-ubuntu was the single
# gate for those six — no other bed in the org composes any of them, and each of
# their own repos declares no pod:/vm: entity. Retiring the boxes without this bed
# would leave six layer repos with no live proof at all (R7).
#
# WHY BINARY ASSERTIONS AND NOT JUST THE CANDY CHECKS: a candy whose per-distro
# section silently no-ops on a distro still builds clean (sdk#453 — a layer's
# `distro:` package section applies nothing and nothing reports it). The candy
# checks run per-candy and would each pass in isolation; only a COMPOSITION-level
# assert on the finished CachyOS container catches the silent no-op.
#
# layer-rpmfusion is deliberately absent: RPM Fusion is a Fedora repository driven
# by dnf/rpmkeys/rpm -E %fedora with no Arch analogue, so it keeps its own minimal
# Fedora bed instead of a doomed CachyOS one.
# =============================================================================
check-cachyos-coder-tools-pod:
    pod:
        image: cachyos-coder-tools
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the cachyos-coder-tools image AND the compensating gate for four of the six
            layer candies the retired non-CachyOS coder boxes were the only live proof of
            (opencharly/opencharly#1068). Builds the minimal tool gate on the CachyOS
            (x86_64_v3) base, deploys it, and runs every composed candy's baked check plus
            one representative binary assertion per compensated candy — pixi, typst, act,
            actionlint, dotnet/php/python3 —
            so a candy whose per-distro section silently no-ops on CachyOS (sdk#453)
            cannot pass, and pins the base identity so a stale base digest cannot pass
            either.
        plan:
            - check: one representative binary per compensated candy is present and executable on the composed CachyOS container, so none of the four compensable candies silently no-opped its per-distro section
              id: cachyos-coder-tools-compensation-bins
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: COMPENSATION-BINS-OK
              command: |
                set -eu
                for b in /usr/local/bin/pixi \
                         /usr/local/bin/typst \
                         /usr/bin/act \
                         /usr/local/bin/actionlint \
                         /usr/bin/dotnet \
                         /usr/bin/php \
                         /usr/bin/python3; do
                  if [ ! -x "$b" ]; then echo "MISSING $b"; exit 1; fi
                done
                echo "COMPENSATION-BINS-OK"
            - check: the composed image runs from the CachyOS base this box pins (ID=cachyos, VERSION_ID=20261018.0.612668), so a stale base digest cannot pass this bed
              id: cachyos-coder-tools-base-identity
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: ID=cachyos
                - contains: VERSION_ID=20261018.0.612668
              command: |
                grep -E '^(ID|VERSION_ID)=' /etc/os-release

# Re-homed from distro-ubuntu under operator decision D-3 (opencharly/opencharly#1068):
# the non-CachyOS images retire, and the org's review tool moves to the CachyOS base
# rather than disappearing with them.
check-clawsweeper-review-pod:
    pod:
        image: clawsweeper-review
        disposable: true
        lifecycle: dev
        plan:
            - check: the entrypoint runs the engine to a report and never dies on its own permissions
              id: review-verdict
              description: |
                A check bed exports NO secret, so `OLLAMA_API_KEY` can never resolve here (the
                runner resolves only its own auto-exported variables — a key guard in a check
                step is a DEAD assertion), and the model leg is therefore not exercised in this
                bed. It is never faked either (R8). What IS proven: the fixture exists, the
                entrypoint's flag contract holds, `jq` is present, the engine reaches the model
                boundary, and nothing fails on the image's own permissions.
              context: [runtime]
              exit_status: 0
              command: |
                  set -euo pipefail
                  # A check step prepares its own input: a `run:` step is SKIPPED in
                  # verify-only mode (measured: "skipped — verify-only mode (mutating step)").
                  rm -rf /tmp/fixture && mkdir -p /tmp/fixture
                  git init -q -b main /tmp/fixture
                  git -C /tmp/fixture config user.email fixture@example.invalid
                  git -C /tmp/fixture config user.name fixture
                  printf 'def add(a, b):\n    return a + b\n' > /tmp/fixture/calc.py
                  git -C /tmp/fixture add calc.py
                  git -C /tmp/fixture commit -qm "base: add() adds"
                  printf 'def add(a, b):\n    return a - b\n' > /tmp/fixture/calc.py
                  git -C /tmp/fixture add calc.py
                  git -C /tmp/fixture commit -qm "defect: add() subtracts"

                  command -v clawsweeper-review
                  help="$(clawsweeper-review --help)"
                  printf '%s\n' "$help" | grep -q -- '--local-range'
                  printf '%s\n' "$help" | grep -q -- '--result-format json'
                  jq --version

                  base="$(git -C /tmp/fixture rev-parse HEAD~1)"
                  out="$(CLAWSWEEPER_TARGET_REPO=opencharly/fixture BASE_SHA="$base" TARGET_DIR=/tmp/fixture clawsweeper-review 2>&1 || true)"
                  printf '%s\n' "$out" | tail -3

                  # The regression that killed every review: an unwritable CODEX_HOME dies at
                  # "failed to initialize in-process app-server client: Permission denied"
                  # before the model is reached.
                  if printf '%s\n' "$out" | grep -q 'Permission denied'; then
                    echo "the engine died on the image's own permissions"
                    exit 1
                  fi
                  # It reached the model boundary: a report was produced. NO key-shaped
                  # assertion — the check must not depend on the key being ABSENT, which is
                  # the trap the layer's own runtime check was blocked for.
                  printf '%s\n' "$out" | grep -q '"reports"'
                  echo REVIEW-ENGINE-REACHED-MODEL-BOUNDARY
        description: |
            R10 proof of the review image: the engine converges, accepts an opencharly/* target
            through the profile overlay, and reaches the model boundary. The live model
            round-trip needs a key, which a check bed cannot supply — that leg is the advisory
            workflow's job (opencharly/.github `clawsweeper-review.yml`).

