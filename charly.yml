# check-crabbox-pod — the minimal Crabbox CLI composition (agent-forwarding +
# layer-crabbox + plugin-crabbox) on the CachyOS base. Runs the `crabbox:` check
# verb's credential-free surface in-venue (version/providers/config/doctor with
# NO coordinator configured) plus the binary presence probe. The full-local loop
# (coordinator + broker-backed verbs + rootless-podman leases) is check-crabbox-e2e-pod.
check-crabbox-pod:
    pod:
        image: crabbox
        disposable: true
        lifecycle: dev
        description: >-
            Sole build+runtime witness for box:crabbox — the minimal Crabbox CLI composition (agent-forwarding + layer-crabbox + plugin-crabbox) on the CachyOS base. Deploys the CLI pod and runs the `crabbox:` check verb's credential-free surface IN-VENUE with NO coordinator configured: version (in-venue CLI, probe-verified exit 0), providers (credential-free matrix), config show (read-only), doctor (no-broker exit 0 — the provider-selection warning is informational). Binary presence is asserted directly.
        plan:
            - check: the crabbox CLI binary is present at /usr/local/bin/crabbox in the running pod
              id: cbx-cli-binary
              context:
                - runtime
              file:
                file: /usr/local/bin/crabbox
                exists: true
            - check: the crabbox verb reports the pinned 0.51.0 CLI version (in-venue CLI method)
              id: cbx-verb-version
              crabbox:
                method: version
              stdout:
                - contains: "0.51.0"
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
            - check: crabbox providers lists the credential-free local provider matrix
              id: cbx-verb-providers
              crabbox:
                method: providers
              stdout:
                - contains: "local-container"
              context:
                - runtime
            - check: crabbox config show runs read-only in the venue
              id: cbx-verb-config
              crabbox:
                method: config
              exit_status: 0
              context:
                - runtime
            - check: crabbox doctor passes with no broker configured (fresh venue)
              id: cbx-verb-doctor
              crabbox:
                method: doctor
              exit_status: 0
              stdout:
                - contains: "ok"
              context:
                - runtime
# check-crabbox-e2e-pod — the flagship: the FULL LOCAL Crabbox control plane on
# one CachyOS pod — CLI + Node/PostgreSQL coordinator + postgres + nested
# rootless podman (container-nesting). Proves the crabbox: verb host probes
# (/v1/health,/v1/ready), shared-token login, broker-backed method classes, and
# the FULL local loop: crabbox run --provider local-container leasing a nested
# rootless podman container with stdout asserted and the lease released — the
# authoritative nested-port-publish assertion (fallback matrix pre-loaded in the
# plan: localContainer.network host / podman socket). Stretch steps exercise the
# local capability surface (checkpoint/artifacts/desktop proof/pond), each
# documented with per-step verdicts.
check-crabbox-e2e-pod:
    pod:
        image: crabbox-e2e
        disposable: true
        lifecycle: dev
        network: host
        env:
            POSTGRES_DB: crabbox
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: crabbox-dev-token-0
            CRABBOX_SHARED_TOKEN: crabbox-dev-token-0
            CRABBOX_SHARED_OWNER: crabbox@local
            CRABBOX_PUBLIC_URL: http://127.0.0.1:8080
            CRABBOX_PROVIDER: local-container
        description: >-
            The flagship disposable bed: the complete LOCAL Crabbox control plane on one CachyOS pod — the crabbox CLI + the Node/PostgreSQL coordinator (supervised, postgres-backed) + nested rootless podman. (1) Coordinator liveness/readiness via the `crabbox:` verb host probes (health/ready on :8080); (2) shared-token login into the local broker; (3) broker-backed verb methods after login (doctor-after-ready, usage, leases); (4) THE FULL LOCAL LOOP: `crabbox run --provider local-container` leases a nested rootless podman container in-venue (loopback SSH publish), syncs a scratch git workdir, runs, streams, and releases — stdout asserted. Stretch steps exercise the local capability surface: checkpoint (workspace-archive), artifacts collect, desktop/browser proof, pond peers — each individually documented. Zero cloud credentials; everything is local (shared-token auth).
        plan:
            - check: pre-load the nesting smoke image into the host-backed storage (the volume starts empty and the baked smoke uses --pull=never; mutating check guarded by the smoke's own run)
              id: cbx-e2e-prepull
              exit_status: 0
              context:
                - runtime
              command: podman pull quay.io/libpod/alpine:latest >/dev/null 2>&1 || true
            - check: coordinator /v1/health responds 200 (host-side http verb — host-networking publishes no port mapping; the coordinator binds host-localhost :8080)
              id: cbx-e2e-health
              http:
                http: http://127.0.0.1:8080/v1/health
                status: 200
              eventually: 120s
              retry_interval: 5s
              context:
                - runtime
            - check: coordinator /v1/ready responds 200 (host-side http verb)
              id: cbx-e2e-ready
              http:
                http: http://127.0.0.1:8080/v1/ready
                status: 200
              context:
                - runtime
            - check: log the CLI into the local broker with the shared token (mutating setup under verify-only; truth = the broker-backed checks below)
              id: cbx-e2e-login
              exit_status: 0
              context:
                - runtime
              command: printf '%s' "$CRABBOX_SHARED_TOKEN" | crabbox login --url http://127.0.0.1:8080 --token-stdin || true
            - check: crabbox doctor passes once the coordinator is reachable (incl. its coord check)
              id: cbx-e2e-doctor
              crabbox:
                method: doctor
              exit_status: 0
              stdout:
                - contains: "ok"
              context:
                - runtime
            - check: broker-backed usage reports through the verb (login held)
              id: cbx-e2e-usage
              crabbox:
                method: usage
              exit_status: 0
              context:
                - runtime
            - check: broker-backed leases lists through the verb (empty lease set is fine)
              id: cbx-e2e-leases
              crabbox:
                method: leases
              exit_status: 0
              context:
                - runtime
            - check: the generated crabbox config exists in the venue (rendered by crabbox-nesting-dns via the config verb)
              id: cbx-config-file
              context:
                - runtime
              file:
                file: /home/user/.config/crabbox/config.yaml
                exists: true
            - check: crabbox config show reads the generated config (provider=local-container, noHostname opt-in from the file)
              id: cbx-config-show
              exit_status: 0
              stdout:
                - contains: "local-container"
              context:
                - runtime
              command: /usr/local/bin/crabbox config show
            # THE FULL LOCAL LOOP: the no-hostname opt-in comes from the GENERATED
            # config (crabbox-nesting-dns renders ~/.config/crabbox/config.yaml with
            # localContainer.noHostname: true via the charly config: verb — upstream
            # v0.51.0 #1924): the uid-1000 posture cannot set the lease hostname
            # (crun sethostname EPERM under the nesting recipe's userns=host), so the
            # loop leases hostname-less. No env knob. See plan/crabbox-loop-cutover.md.
            - check: THE FULL LOCAL LOOP — scratch git workdir, lease via local-container, sync, run, stream, release (exit-2 acceptance)
              id: cbx-e2e-loop
              exit_status: 0
              stdout:
                - contains: "crabbox-local-ok"
              context:
                - runtime
              command: |
                set -e
                mkdir -p /tmp/cbxw && cd /tmp/cbxw
                [ -d .git ] || git init -q
                printf 'probe\n' > probe.txt
                git add -A 2>/dev/null || true
                git -c user.name=probe -c user.email=probe@local commit -qm init 2>/dev/null || true
                crabbox run --provider local-container --ttl 15m --idle-timeout 5m -- printf 'crabbox-local-ok'
# charly-cachyos — the operator CachyOS workstation profile (target: local +
# host: local). It mutates the operator's REAL MACHINE — it installs packages as
# root and may change repo config — so it is an operator profile, NEVER a test bed.
#
# It carries NO `disposable:` flag, and must not regain one. `disposable: true` is
# not merely "unattended destroy is authorized": it is the SOLE definition of a
# check bed (a check bed IS a deploy marked `disposable: true`; there is no separate
# `check:` block — /charly-check:check). So the flag makes an entity a roster bed by
# construction: `/verify-beds` discovers every `disposable: true` entity and runs
# `charly check run` on it. With the flag present, a routine R10 roster provisioned
# this workstation unattended — 697s of `deploy-add` installing gstreamer, pipewire,
# gtk4, ghostty and more as root, until it died in the chrome AUR builder.
#
# Consequence, accepted deliberately: `charly update charly-cachyos` is no longer an
# unattended destroy+rebuild. It is a hard-to-reverse action on a non-disposable
# resource and requires operator confirmation, like every other such resource.
# Shares the name `charly-cachyos` with the kind:local template it applies
# (cross-kind name reuse).
charly-cachyos:
    local:
        from: charly-cachyos-app
        host: local
        description: Apply charly-cachyos to this workstation
        install_opts:
            with_service: true
            allow_repo_changes: true
            allow_root_tasks: true
        env:
            EDITOR: nvim
