#  opencharly/distro-cachyos — the CachyOS image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/cachyos.
#
#  SINGLE-FILE config: every entity (the cachyos base + pacstrap family + the 7
#  relocated app/fixture boxes under box/, the cachyos VMs, the disposable check
#  beds, the charly-cachyos operator profile + its kind:local template) is inlined
#  here or discovered under box/. This repo VENDORS its cachyos-exclusive layers
#  locally under candy/ (resolved via the discover: block); every shared layer is
#  an `@github.com/opencharly/<kind>-<name>:<tag>` ref to that candy's OWN repo (the
#  candy de-submodule cutover). NO exceptions remain: `charly` and `charly-mcp` were the
#  last two, held back in #33 because repointing them then surfaced a remote-candy-name
#  conflict, and repointed in #34 once that cleared. The
#  Arch base/builder stack lives in the opencharly/distro-arch submodule (2026-06 box
#  inversion).
#
#  import: a single namespaced entry — `arch: <ref>` mounts opencharly/distro-arch under
#  the `arch` namespace, so `arch.arch` (cachyos-pacstrap-builder's base),
#  `arch.arch-builder` (the cachyos base's builder), and `arch.cuda-arch-builder`
#  (the cuda GPU builder) resolve. One-directional — arch imports
#  nothing back; the former main↔cachyos mutual cycle is dissolved.
#
#  Directly buildable: `charly box build cachyos` (from the parent repo:
#  `charly -C box/cachyos box build cachyos`; anywhere:
#  `charly --repo opencharly/distro-cachyos box build cachyos`).
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    # A builder map does not cross a namespace boundary (stated in box/cachyos), so a box
    # composed FROM an import resolves its builder from THIS project, not from the
    # imported repo. Declared here so podcdi.pod-cdi composes and builds.
    builder:
        aur: arch.arch-builder
        cargo: arch.arch-builder
        npm: arch.arch-builder
        pixi: arch.arch-builder
    merge:
        auto: false
        max_mb: 128
import:
    # The Arch base/builder stack lives in the opencharly/distro-arch submodule (2026-06
    # box inversion). cachyos-pacstrap-builder bases on arch.arch; the cachyos base
    # + the GPU boxes route their pixi/npm/cargo/aur builders to arch.arch-builder
    # / arch.cuda-arch-builder. Candy layers resolve via @github refs (not this
    # namespace). One-directional import — arch imports nothing back.
    - arch: '@github.com/opencharly/distro-arch:v2026.326.1455'
    # The CDI POD base box. A pod takes its GPU driver from the HOST through the CDI
    # spec, so its image must bake NO driver user-space and carry NO nvidia-ctk.
    # v2026.329.2115 is the REQUIRE-FREE contract: the base composes layer-cdi, the
    # OpenCL ICD file and the build-time assertions — and NO toolkit, so a class-1 pod
    # (wheel or bundled runtime) pays nothing; a class-2/3 consumer composes
    # `layer-cuda` itself (opencharly/opencharly#1287).
    - podcdi: '@github.com/opencharly/pod-cdi:v2026.329.2115'
    # The `charly openwebui` command, imported so the R10 bed can drive the plugin against
    # the server it just started. An IMPORT, not a composition: the word registers from the
    # imported repo's own discover tree (charly#1136), and no image gains the binary.
    - owuicli: '@github.com/opencharly/plugin-openwebui:v2026.324.1215'
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
# Disposable R10 test bed for the cachyos bootstrap VM (kind:check — the
# 2026-05 deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the unattended
# destroy+rebuild driven by `charly check run check-cachyos-vm`.
# Disposable R10 bed for the ComfyUI POD, and the only proof that the CDI base
# actually yields a runnable GPU container. This exists because the pod image
# changed base from the VM contract (baked driver + nvidia-ctk) to the CDI
# contract (host-injected driver): "the box builds" is not "the pod runs with a
# GPU", and nothing in this repo asserted the second thing.
check-comfyui-pod:
    pod:
        image: comfyui-cdi
        disposable: true
        lifecycle: dev
        # The model cache is a HOST directory shared with the live ComfyUI deployment and the
        # other ComfyUI beds, so the ~12 GB Z-Image set is fetched once, not once per run. The
        # parent `comfyui` volume stays a FRESH named volume: only models are shared, while
        # every mutable state file (custom_nodes, user, database) is still seeded from zero.
        volume:
            - name: comfyui-models
              type: bind
              host: ~/.local/share/charly/models/comfyui/models
              path: /home/user/ComfyUI/models
        # GPU-CDI pod on the refcounted axis: the bed asserts a CUDA device below, so it must
        # claim the card through the arbiter (the older bed omitted this claim).
        requires_shared: [nvidia-gpu]
        description: >-
            Sole proof that the ComfyUI pod built through the CDI base RUNS, that the
            runtime injects the host driver (no baked user-space), and that the API
            answers on 8188.
        plan:
            - check: the ComfyUI HTTP API answers on its published port
              id: comfyui-api
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
              # On a FRESH volume the server is still fetching its model when this
              # first runs (pod-comfyui's own runtime check measures the same); the window makes
              # a cold boot a wait instead of a failure.
              eventually: 300s
              retry_interval: 10s
              context:
                - runtime
            - check: the running server reports the ComfyUI release this box pins (0.46.1)
              id: comfyui-served-version
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
                body:
                    - contains: '"comfyui_version": "0.46.1"'
              eventually: 300s
              retry_interval: 10s
              context: [runtime]
            - check: the bound pod runs with the image user's HOME, so the state volume and the models bind are used
              id: comfyui-home-pinned
              context: [runtime]
              exit_status: 0
              command:
                command: |
                  set -eu
                  test "$(printenv HOME)" = /home/user
                  test -s "/home/user/ComfyUI/models/checkpoints/$COMFYUI_MODEL"
              # This bed is a host-owned bind: the nested `comfyui-models` volume at
              # /home/user/ComfyUI/models makes charly run the container as root under keep-id,
              # where HOME is /root. The check is RED before the candy pins HOME and GREEN after.
            - check: ComfyUI sees a CUDA device — the runtime injected the host driver
              id: comfyui-cuda-device
              # `type` is the torch device type on each entry of `/system_stats.devices`
              # (ComfyUI v0.45.3 server.py: `"type": d.type`), so it reads "cuda" only when the
              # container actually resolved a GPU — which is what the CDI injection is for. An
              # image that baked no driver and got no injection reports "cpu". Asserted through
              # the documented `http:` verb with a body contains matcher, exactly as pod-comfyui
              # asserts its own `/system_stats` liveness, so no tool has to exist in the image.
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
                body:
                    - contains: '"type": "cuda"'
              eventually: 300s
              retry_interval: 10s
              context: [runtime]
            - check: no host-side nvidia-ctk is baked into the image
              id: comfyui-no-baked-driver
              # The LIBRARY half of "no baked driver" cannot be decided HERE: the CDI runtime
              # mounts the HOST's library into this very container, so a path probe under
              # /usr/lib{,64} finds the injected file on a CORRECT image. That half is proven at
              # build time by layer-cdi's `cdi-no-baked-driver-libs`, which runs where no
              # injection exists — one canonical assertion, not two. `nvidia-ctk` is different:
              # it is a HOST CLI that no CDI spec injects, so its absence here IS the image's own
              # state.
              context: [runtime]
              command:
                command: |
                  ! command -v nvidia-ctk
                in_container: true
check-cachyos-vm:
    # HOST REQUIREMENT: the bootstrap VM disk build stages a 25 GiB disk (the
    # cachyos-vm entity's disk_size) and the preflight requires disk + overhead —
    # 27.0 GiB as reported by `charly vm build` on 2026-10-20 (28,991,029,248
    # bytes). The staging dir honors TMPDIR (sdk/buildkit's privileged runner), so
    # a host whose /tmp is a tmpfs must point TMPDIR at a disk-backed path
    # (e.g. TMPDIR=$HOME/.cache/charly/tmp) — otherwise the preflight refuses with
    # 'insufficient free space on /tmp/charly-priv-N: 26.1 GiB free, 27.0 GiB
    # required' even though the home filesystem has room. CHARLY_VM_STATE_DIR
    # relocates the VM state tree the same way.
    # mkinitcpio 'failed to detect root filesystem' in the base-image build: the
    # chroot autodetect fallback, allowlisted by charly#400
    # (mkinitcpio-chroot-autodetect-fallback + mkinitcpio-chroot-warnings); this
    # repo's charly ref advance (v2026.236.2040) is the batch exit.
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: Sole proof of the CachyOS pacstrap-from-scratch bootstrap VM booting AND the charly toolchain installing as a native pac package (charly via the `charly generate-packages` plugin + pacman -U), distinct from the Arch cloud-VM pac witness. Pacstrap-builds a CachyOS rootfs, boots it under UEFI, deploys the charly + dev-tools layers over SSH (the charly localpkg builds the charly package via the `charly generate-packages` plugin from the candy's `packaging:` section), then runs the baked charly-binary/version + dev-tools command/file/package checks.
        # The cachyos bootstrap-VM R10 canary: pacstrap builds the cachyos rootfs
        # from scratch, the guest boots, the charly candy deploys onto it (its
        # localpkg: builds the charly package via the `charly generate-packages`
        # plugin (sdk/packagekit) from the candy's `packaging:` section and
        # `pacman -U`s it in — a failed install fails THIS bed at the deploy
        # step), and the baked charly-binary/charly-version checks run on the guest.
        # The explicit pac localpkg AUTO-RESOLVE assertion (pacman -U pulling the
        # mandatory repo deps podman/libvirt/tailscale/gocryptfs) lives ONCE, on
        # main's purpose-built `check-charly-vm` pac witness — the dedicated home for
        # that assertion, so it is not duplicated across beds.
        # dev-tools is composed here so this canary also validates the cachyos
        # workstation's core dev toolkit installs (golangci-lint / gopls / etc.).
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.328.0806'
            - '@github.com/opencharly/layer-dev-tools:v2026.272.0100'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
# Disposable R10 bed for the charly package's systemd integration + the full
# MCP surface on the CachyOS bootstrap VM (the HOST-install path): the charly
# toolchain installs as a native pac package carrying the systemd units +
# /etc/charly/charly.yml, the NON-AUTOSTARTING units start the MCP server on
# demand, and every MCP functionality is exercised via proper mcp: checks
# against the cachyos-vm's mcp_provide declaration (the substrate-neutral P4
# resolution — the mcp: verb dials the host-forwarded port).
check-cachyos-mcp-vm:
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the charly package's systemd units + /etc/charly/charly.yml +
            the MCP server on a fresh CachyOS VM. Installs charly as a native pac
            package (the shipped units + config), composes the charly-mcp-enable
            candy (the deploy does systemctl enable --now on the non-autostarting
            packaged unit - the charly-native start), and exercises every MCP
            functionality (ping / list-tools / call) via proper mcp: checks - the
            standing R10 gate for the host-install path. The non-autostarting
            contract (fresh-install is-enabled = disabled) is asserted by the
            per-distro install-tests.
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.328.0806'
            - charly-mcp-enable
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the packaged system unit is installed and binds loopback only (P3 - the host default)
              id: systemd-system-unit
              file:
                  file: /usr/lib/systemd/system/charly-mcp.service
                  exists: true
                  contains: "127.0.0.1:18765"
            - check: the packaged user unit is installed
              id: systemd-user-unit
              file:
                  file: /usr/lib/systemd/user/charly-mcp.service
                  exists: true
            - check: the MCP service is enabled and running after the deploy's systemctl enable --now (the charly-mcp-enable candy)
              id: unit-enabled-for-test
              service:
                  service: charly-mcp
                  enabled: true
                  running: true
              timeout: 30s
              eventually: 60s
              retry_interval: 3s
            - check: the system-wide /etc/charly/charly.yml is shipped
              id: etc-charly-config
              file:
                  file: /etc/charly/charly.yml
                  exists: true
            - check: the shipped config validates as a project
              id: etc-charly-validates
              command:
                  command: charly box validate -C /etc/charly
            - check: the MCP port is reachable from the host via the forwarded port
              id: mcp-port-reachable
              context: [runtime]
              # The FIXED forwarded host port (the entity's 18765:18765 forward) —
              # a literal, not a threaded env var: the check's ${...} variable
              # surface is binary-dependent (the 1212 build threaded HOST_PORT, the
              # 1226 build left it unresolved and SKIPped the step). The fixed
              # forward is the merged design; the literal dials it deterministically.
              addr: 127.0.0.1:18765
              timeout: 30s
              # eventually: the guest server may still be starting when check-live
              # begins (the 1212 signature: dial refused at the first probe, the
              # mcp: ping with eventually passed seconds later).
              eventually: 90s
              retry_interval: 3s
            - check: the MCP server answers ping
              id: mcp-charly-ping
              mcp:
                  method: ping
                  mcp_name: charly
              timeout: 30s
              eventually: 90s
              retry_interval: 3s
              stdout:
                  equals: ok
            - check: the MCP server exposes the charly tools
              id: mcp-charly-list-tools
              mcp:
                  method: list-tools
                  mcp_name: charly
              stdout:
                  - contains: box.list.boxes
                  - contains: version
            - check: the version tool round-trips a CalVer
              id: mcp-charly-call-version
              mcp:
                  method: call
                  tool: version
                  input: "{}"
                  mcp_name: charly
              exit_status: 0
              stdout:
                  - matches: '[0-9]{4}\.[0-9]+'
            - check: box.list.boxes resolves the /etc/charly project locally (no network fallback)
              id: mcp-charly-call-list-boxes
              mcp:
                  method: call
                  tool: box.list.boxes
                  input: "{}"
                  mcp_name: charly
              timeout: 90s
              exit_status: 0

# The charly-native start of the packaged (non-autostarting) charly-mcp unit: a
# service declaration with use_packaged + enable: true makes the deploy run
# systemctl enable --now on the shipped unit - the bed's test setup. The check
# phases are verify-only (run: steps never execute there), so the start must be
# a deploy-time action; this candy IS that action.
charly-mcp-enable:
    candy:
        description: >-
            Enables + starts the packaged charly-mcp unit on this deployment
            (systemctl enable --now via the use_packaged service declaration).
            The units ship non-autostarting; this candy is the bed's explicit,
            charly-native start for the MCP checks.
        # The use_packaged service requires the candy to declare the package that
        # provides the unit — the charly package (installed by the layer-charly
        # localpkg; the enable candy re-declares it so the service resolution has
        # its provider).
        package:
            - charly
        service:
            - name: charly-mcp
              use_packaged: charly-mcp.service
              enable: true
              scope: system
              # The SHIPPED unit binds 127.0.0.1 (the P3 host default, asserted by
              # the bed's unit-file check). The host-side mcp: checks reach the
              # server through the forwarded port (arrives on the VM's external
              # interface), so the deploy plan below writes a systemd drop-in
              # overriding the runtime ExecStart to 0.0.0.0 — the shipped unit is
              # untouched, the running server binds all interfaces (normal inside
              # a VM; the host system is the security boundary). The drop-in is
              # written with a deploy root command: step (install -d + printf),
              # NOT the schema `overrides:` field: sdk/deploykit's packaged-service
              # compile drops entry.Overrides, and the run: file step's provision
              # ran as the guest user (mkdir EACCES + unterminated here-doc, R1ed)
              # — the root command step + restart is the working bed-side
              # mechanism.
        plan:
            - run: write the all-interfaces drop-in (a root command step — the run:file step's provision ran as the guest user, mkdir Permission-denied, R1ed)
              id: write-bind-dropin
              command:
                  command: |
                      install -d -m 0755 /etc/systemd/system/charly-mcp.service.d
                      printf '%s\n' '[Service]' 'ExecStart=' 'ExecStart=/usr/bin/charly mcp serve --listen 0.0.0.0:18765' > /etc/systemd/system/charly-mcp.service.d/charly-bind.conf
                      chmod 0644 /etc/systemd/system/charly-mcp.service.d/charly-bind.conf
            - run: reload systemd and restart charly-mcp so the drop-in takes effect
              id: restart-mcp
              command:
                  command: systemctl daemon-reload && systemctl restart charly-mcp
            - check: the packaged charly-mcp unit is installed (the service declaration enables it)
              id: charly-mcp-unit-present
              file:
                  file: /usr/lib/systemd/system/charly-mcp.service
                  exists: true
            - check: the all-interfaces drop-in override is present
              id: bind-dropin-present
              file:
                  file: /etc/systemd/system/charly-mcp.service.d/charly-bind.conf
                  exists: true
                  contains: "0.0.0.0:18765"
punktfunk-vm:
    vm:
        source:
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            checksum:
                type: sha256
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        # BIOS: the Arch cloud image's EFI path boots a stale embedded grub.cfg and
        # loses the console to the simpledrm->virtio takeover race. See
        # /charly-vm:arch-cloud-vm Finding B.
        firmware: bios
        network:
            mode: user
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
                # curl is load-bearing, not incidental: the `punktfunk:` verb issues its
                # management-API requests from INSIDE the venue (the API is loopback-only
                # by punktfunk's design), and the candy's own mgmt-API check curls too.
                - curl
check-punktfunk-vm:
    vm:
        from: punktfunk-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the punktfunk SYSTEMD path: the candy installs from unom's signed pacman repo onto a real systemd guest, lingering is enabled for the deploying account, and the PACKAGED punktfunk-host user unit is enabled with the management API answering - none of which a supervisord container venue can demonstrate.
        add_candy:
            - '@github.com/opencharly/layer-punktfunk:v2026.272.0431'
        install_opts:
            # REQUIRED: the candy adds a third-party pacman repo, and needs root for
            # pacman-key, usermod and loginctl.
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: systemd is the running init in the guest, so the user-unit path is the one under test
              id: pf-vm-systemd-present
              exit_status: 0
              context:
                - runtime
              command: |
                test -d /run/systemd/system && echo SYSTEMD-OK
            - check: lingering is enabled for the deploying account
              id: pf-vm-lingering
              exit_status: 0
              stdout:
                - contains: "Linger=yes"
              context:
                - runtime
              command: |
                loginctl show-user "$(getent passwd 1000 | cut -d: -f1)" -p Linger
            # The next three assertions are stated HERE rather than relied on from the
            # punktfunk candy's own baked checks: when the candy arrives as an @github
            # `add_candy:` ref, its baked checks are not collected into this bed's
            # check-live run (measured: 2 steps, the bed's own). A bed has to assert what
            # its description claims, so the load-bearing claims are restated here.
            - check: the three punktfunk packages installed from unom's pacman repo in the guest
              id: pf-vm-packages
              exit_status: 0
              stdout:
                - contains: "PF-PKGS-OK"
              context:
                - runtime
              command: |
                pacman -Q punktfunk-host punktfunk-web punktfunk-scripting >/dev/null 2>&1 &&
                  echo PF-PKGS-OK
            - check: the PACKAGED punktfunk-host user unit is enabled under the lingering account
              id: pf-vm-user-unit-enabled
              # The claim a supervisord container structurally cannot make. Queried with
              # `--machine=<user>@.host --user`, which is what systemd prescribes for
              # another user's manager; `runuser -- systemctl --user` reaches no user bus.
              exit_status: 0
              stdout:
                - contains: "PF-USER-UNIT-OK"
              context:
                - runtime
              command: |
                PF_USER="$(getent passwd 1000 | cut -d: -f1)"
                systemctl --machine="$PF_USER@.host" --user is-enabled punktfunk-host.service >/dev/null 2>&1 &&
                  echo PF-USER-UNIT-OK
            - check: the management API answers in the guest, so the packaged unit actually reached serve
              id: pf-vm-mgmt-api
              # -k because the management API serves a self-signed certificate.
              exit_status: 0
              stdout:
                - contains: '"status":"ok"'
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
              command: |
                curl -sk https://127.0.0.1:47990/api/v1/health
# The VM the containerd v4 egress bed boots. An ARCH CLOUD IMAGE rather than the
# cachyos pacstrap bootstrap: containerd/crictl/crun/krun are the same packages on
# Arch and CachyOS, and a prebuilt qcow2 reaches a booted systemd guest without the
# bootstrap's ~100 GiB transient build. This is the same substrate decision
# punktfunk-vm records (a systemd path under test, not a distro build).
containerd-v4-vm:
    vm:
        source:
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            checksum:
                type: sha256
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        # BIOS: the Arch cloud image's EFI path boots a stale embedded grub.cfg and
        # loses the console to the simpledrm->virtio takeover race (punktfunk-vm's
        # measured note; /charly-vm:arch-cloud-vm Finding B).
        firmware: bios
        network:
            mode: user
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                # The bed's check steps run as the base user and need root for
                # install/restart/ss; charly's create-pattern grants NOPASSWD sudo.
                - sudo
                # python3 (stdlib json + tomllib only) renders the egress-validated JSON
                # pre-image to TOML and proves the rendered file parses.
                - python
# check-containerd-v4-egress-vm — the R10 bed opencharly/charly#929 records as
# missing: the ONLY assembled bed that drives a config through the real
# verb:egress validator. Three-step shape, so the bed fails on a tree whose
# plugin-egress predates the #ContainerdConfigV4 arm:
#
#   1. v4-config-not-yet-accepted — on the fresh guest, no version-4
#      /etc/containerd/config.toml exists and the CRI runtime map has no crun.
#   2. v4-config-validated-through-egress — generate the shipped fixture project,
#      whose config: step carries the CONTAINERD.md section 3.1 version-4 config
#      with validate: containerd_config. The generate is the egress validation;
#      on a v2-only schema it fails with "version: conflicting values 2 and 4".
#      The accepted pre-image is then rendered to the TOML the daemon loads, so
#      there is no second copy of the values and the rendered file parses back.
#   3. v4-config-accepted-and-served — the running daemon's crictl info lists the
#      crun and krun runtime handlers, ctr plugins ls shows the overlayfs
#      snapshotter, and ss -lx shows the v4
#      [plugins.'io.containerd.server.v1.grpc'] address
#      (/run/containerd-v4-egress/containerd.sock) and NOT the default socket.
#
# DAEMON SAFETY: the daemon is started INSIDE this disposable VM (user-mode
# network, no host socket mount), and its gRPC listener is a non-default guest
# path, so the host's /run/containerd/containerd.sock is never bound. The bed's
# own step 3 asserts the real listen address; the run's before/after host socket
# inode+mtime and ss -lx are pasted in the PR.
check-containerd-v4-egress-vm:
    vm:
        from: containerd-v4-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole assembled proof that a containerd version-4 config passes egress
            validation end to end (opencharly/charly#929). Generates a fixture project
            whose config: step carries the structured pre-image of the CONTAINERD.md
            section 3.1 version-4 config with validate: containerd_config, renders the
            accepted pre-image to the TOML the daemon loads, and asserts the running
            daemon serves the crun and krun runtime handlers + the overlayfs snapshotter
            on the v4 plugin-path gRPC address. Fails on a plugin-egress without the v4
            arm.
        add_candy:
            - containerd-v4-egress
        install_opts:
            # pacman sync + root package install/restart for the containerd stack.
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the fresh guest has NOT yet accepted the v4 config - no version-4 file and no crun runtime handler
              id: v4-config-not-yet-accepted
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: ABSENT-v4-config-not-yet-accepted
              command: |
                set -eu
                if [ -s /etc/containerd/config.toml ] && grep -qE '^[[:space:]]*version[[:space:]]*=[[:space:]]*4' /etc/containerd/config.toml; then
                  echo "PRESENT: a version-4 containerd config is already applied"
                  exit 1
                fi
                if sudo crictl --runtime-endpoint unix:///run/containerd-v4-egress/containerd.sock info 2>/dev/null | grep -q '"crun"'; then
                  echo "PRESENT: the crun runtime handler is already served"
                  exit 1
                fi
                echo ABSENT-v4-config-not-yet-accepted
            - check: the structured pre-image of the v4 config passes the real egress validator and its accepted render is installed and loaded
              id: v4-config-validated-through-egress
              context:
                - runtime
              timeout: 300s
              exit_status: 0
              stdout:
                - contains: VALIDATED-AND-APPLIED-v4-config
              command: |
                set -eu
                fixture="$HOME/containerd-v4-egress-fixture"
                test -f "$fixture/charly.yml"
                # The candy's copy: steps are system-scope (root-owned); hand the
                # fixture to the check user so box generate can create .build.
                sudo chown -R "$(id -u):$(id -g)" "$fixture"
                charly_bin="$(command -v charly || true)"
                if [ -z "$charly_bin" ]; then
                  # The delivered controller binary is /tmp/charly-<version>-<digest>; the
                  # leading digit excludes the /tmp/charly-plugins directory.
                  for candidate in $(ls -1t /tmp/charly-[0-9]* 2>/dev/null); do
                    if [ -f "$candidate" ] && [ -x "$candidate" ]; then charly_bin="$candidate"; break; fi
                  done
                fi
                test -n "$charly_bin"
                echo "binary-under-test: $charly_bin"
                "$charly_bin" version
                # The generate IS the egress validation: the fixture candy's config:
                # step is unified with #ContainerdConfig before the bytes are staged.
                "$charly_bin" -C "$fixture" box generate containerd-v4-fixture-box
                containerfile="$fixture/.build/containerd-v4-fixture-box/Containerfile"
                test -f "$containerfile"
                src="$(awk '$1=="COPY" { for (i=2;i<=NF;i++) if ($i=="/etc/containerd/config.preimage.json") { print $(i-1); exit } }' "$containerfile")"
                test -n "$src"
                test -f "$fixture/$src"
                # The validated artifact is the STRUCTURED PRE-IMAGE (the egress schema's
                # contract for a TOML output). Render it to the TOML the daemon reads, and
                # parse the rendered file back so a malformed render fails here.
                python3 - "$fixture/$src" > /tmp/containerd-v4-config.toml <<'PY'
                import json, sys
                def key(k):
                    if k and all(c.isalnum() or c in "_-" for c in k):
                        return k
                    return "'" + k.replace("'", "''") + "'"
                def val(v):
                    if isinstance(v, bool):
                        return "true" if v else "false"
                    if isinstance(v, (int, float)):
                        return str(v)
                    if isinstance(v, str):
                        return json.dumps(v)
                    if isinstance(v, list):
                        return "[" + ", ".join(val(x) for x in v) + "]"
                    raise TypeError(type(v).__name__)
                def emit(obj, path):
                    for k, v in obj.items():
                        if not isinstance(v, dict):
                            print(f"{key(k)} = {val(v)}")
                    for k, v in obj.items():
                        if isinstance(v, dict):
                            p = path + [k]
                            print("[" + ".".join(key(x) for x in p) + "]")
                            emit(v, p)
                emit(json.load(open(sys.argv[1])), [])
                PY
                python3 -c 'import sys, tomllib; d = tomllib.load(open(sys.argv[1], "rb")); assert d["version"] == 4' /tmp/containerd-v4-config.toml
                grep -qE '^[[:space:]]*version[[:space:]]*=[[:space:]]*4' /tmp/containerd-v4-config.toml
                sudo install -d -m0755 /etc/containerd
                sudo install -d -m0755 /run/containerd-v4-egress
                sudo install -m0644 /tmp/containerd-v4-config.toml /etc/containerd/config.toml
                sudo systemctl enable containerd
                sudo systemctl restart containerd
                echo VALIDATED-AND-APPLIED-v4-config
            - check: the running daemon serves the crun and krun runtime handlers, the overlayfs snapshotter, and the v4 plugin-path gRPC address
              id: v4-config-accepted-and-served
              context:
                - runtime
              timeout: 120s
              # The restart is Type=notify, but the CRI plugin's runtime map is read a
              # moment later; the standard eventually window covers that, no sleep.
              eventually: 60s
              retry_interval: 3s
              exit_status: 0
              stdout:
                - contains: SERVED-crun
                - contains: SERVED-krun
                - contains: SERVED-overlayfs
                - contains: SERVED-v4-config
              command: |
                set -eu
                endpoint="unix:///run/containerd-v4-egress/containerd.sock"
                if ! info="$(sudo crictl --runtime-endpoint "$endpoint" info 2>/tmp/crictl.err)"; then
                  echo "FAIL: crictl info could not reach $endpoint: $(head -1 /tmp/crictl.err)" >&2
                  exit 1
                fi
                if ! printf '%s\n' "$info" | grep -q '"crun"'; then
                  echo "FAIL: crictl info has no crun runtime handler" >&2
                  exit 1
                fi
                echo SERVED-crun
                if ! printf '%s\n' "$info" | grep -q '"krun"'; then
                  echo "FAIL: crictl info has no krun runtime handler" >&2
                  exit 1
                fi
                echo SERVED-krun
                # v4 configures the snapshotter on the CRI images plugin, not on the
                # runtime's containerd block (which has no Snapshotter field).
                if ! sudo containerd config dump | grep -A3 "io.containerd.cri.v1.images'" | grep -q "snapshotter = 'overlayfs'"; then
                  echo "FAIL: the CRI images plugin's snapshotter is not overlayfs" >&2
                  exit 1
                fi
                if ! sudo ctr --address /run/containerd-v4-egress/containerd.sock plugins ls | grep -E '^io\.containerd\.snapshotter\.v1[[:space:]]+overlayfs[[:space:]]' | grep -q 'ok'; then
                  echo "FAIL: ctr plugins ls does not show the overlayfs snapshotter as ok" >&2
                  exit 1
                fi
                echo SERVED-overlayfs
                if ! sudo ss -lx | grep -q '/run/containerd-v4-egress/containerd.sock'; then
                  echo "FAIL: the v4 custom gRPC address is not listening" >&2
                  exit 1
                fi
                # End-anchored: the default TTRPC socket is .../containerd.sock.ttrpc
                # and must not be mistaken for the default gRPC socket.
                if sudo ss -lx | grep -qE '/run/containerd/containerd\.sock$'; then
                  listeners="$(sudo ss -lx | grep containerd | awk '{print $5}' | tr '\n' ',')"
                  procs="$(sudo pgrep -a containerd | tr '\n' ';')"
                  echo "FAIL: default socket also listening; listeners=$listeners procs=$procs" >&2
                  exit 1
                fi
                sudo stat -c 'guest-containerd-socket inode=%i mtime=%Y' /run/containerd-v4-egress/containerd.sock
                echo SERVED-v4-config
# Disposable R10 pod beds for the CachyOS GPU image family. Each drives the
# full `charly check run` sequence (build → check box → deploy → check live →
# fresh update → tear down) on the cachyos-namespace image of the same name.
# Host ports are remapped into a dedicated 45xxx range so the beds never
# collide with an operator's production services on the canonical ports.
# Deploy- and build-scope check coverage is inherited from the composed
# layers (the "lowest level" principle) — the beds carry no check: of their
# own. The GPU base (nvidia-cdi) and python-ml-cdi carry no service, so they are
# proved by `charly check box` alone and need no pod bed.
check-cachyos-jupyter-ml-pod:
    pod:
        image: jupyter-ml-cdi
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU jupyter-ml-cdi image (JupyterLab + ML/spacy/quarto + jupyter MCP) composes on the Arch CUDA base — the cachyos-distro variant of the fedora jupyter-ml bed. Builds and deploys the jupyter-ml-cdi pod (podcdi.pod-cdi base) and runs the inherited jupyter-ml + notebook-templates + dbus baked checks — JupyterLab HTTP liveness, package/file/service probes, and jupyter MCP-server probes.
        requires_shared: [nvidia-gpu]
check-cachyos-ollama-pod:
    pod:
        image: ollama-cdi
        disposable: true
        lifecycle: dev
        requires_shared: [nvidia-gpu]
        # NO OLLAMA_PULL_MODELS override: the deployed pod carries the BOX's four-model default, so
        # the bed pulls and proves exactly what ships. The list is read back from the runtime env
        # (below), never restated here — one canonical list (R2).
        description: >-
            Sole proof the CachyOS GPU ollama-cdi LLM-server image composes and serves on the Arch CUDA base, that the packaged CUDA backend is present, that the compiled-in command:ollama plugin works end-to-end, AND that real inference runs on the passed-through NVIDIA GPU. Builds and deploys the ollama-cdi pod and runs the checks baked into the ollama, ollama-cuda and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the CUDA backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port — plus the bed's own GPU-inference plan: nvidia-smi enumerates the card via CDI, a tiny model answers a prompt (a real generation pass), and `ollama ps` reports the model 100% GPU-resident (proving the CUDA backend executed it, not CPU fallback). The `requires_shared: [nvidia-gpu]` makes the arbiter flip the IOMMU group vfio→nvidia at deploy and back at teardown, so the pod reaches the card through CDI. On Arch the server comes from the split `ollama` package rather than the upstream tarball, so this bed is also the proof of that install path.
        plan:
            - check: the passed-through NVIDIA GPU is visible inside the container via CDI — nvidia-smi enumerates the card
              id: ollama-gpu-visible
              context:
                - runtime
              command: nvidia-smi -L
              stdout:
                - contains: "NVIDIA"
            - check: ollama runs a real generation pass — a tiny model answers a prompt (the first run pulls the model, hence the raised timeout)
              id: ollama-gpu-inference
              context:
                - runtime
              timeout: 5m
              exit_status: 0
              command: ollama run qwen2.5:0.5b "What is 2+2? Reply with just the number."
            # The R7 discriminator for the box's default set: EVERY model the deployed env declares
            # must be in the store, put there by the SERVICE WRAPPER'S start-time pull — no step in
            # this plan pulls them. It goes RED on an image whose service still execs `ollama serve`
            # directly, and RED for a mistyped or removed tag (exact match, `grep -qxF "$m"`).
            #
            # This is an ASSERTION with a bounded wait, not a second pull. Two earlier versions of
            # this check failed for reasons unrelated to the store and are recorded here so they are
            # not retried: (1) run 2026.328.0220 started a SECOND scratch wrapper on another port and
            # sat out its deadline because that second `ollama serve` never answered; (2) run
            # 2026.328.0315 pulled the models ITSELF and was killed while racing the wrapper's own
            # concurrent pull of the same 6 GB. And run 2026.328.0152 failed because THAT run raised
            # the bed's GPU gate to 2 GiB on a contended card, so the wrapper refused to start the
            # server at all and the start-time pull never ran — an artefact of the gate experiment,
            # not of this check. The wrapper pulls at start; this asserts the result.
            - check: every model the box declares in OLLAMA_PULL_MODELS is present in the model store
              id: ollama-default-models-present
              context:
                - runtime
              timeout: 40m
              exit_status: 0
              command:
                command: |
                  models="$OLLAMA_PULL_MODELS"
                  if [ -z "$models" ]; then echo "the deployed env declares no OLLAMA_PULL_MODELS"; exit 1; fi
                  echo "declared: $models"
                  i=0
                  while [ "$i" -lt 900 ]; do
                    all=1
                    for m in $models; do
                      ollama list | awk 'NR>1 {print $1}' | grep -qxF "$m" || all=0
                    done
                    if [ "$all" -eq 1 ]; then break; fi
                    sleep 2
                    i=$((i+1))
                  done
                  for m in $models; do
                    if ollama list | awk 'NR>1 {print $1}' | grep -qxF "$m"; then echo "PRESENT $m"; else echo "MISSING $m"; exit 1; fi
                  done
                in_container: true
            - check: the model is resident on the GPU — ollama ps reports 100% GPU in the processor column, proving the CUDA backend executed the generation rather than CPU fallback
              id: ollama-gpu-resident
              context:
                - runtime
              command: |
                set -eu
                # LOAD a model WITH a keep-alive first. `ollama ps` lists only LOADED models, and a
                # bare `ollama ps` at this point lists none: the preceding checks can run after the
                # server's default keep-alive window, so the check was red on a CLEAN image and its
                # subject (the CUDA backend executed) was already proven by ollama-gpu-inference.
                m=$(ollama list | awk 'NR>1 {print $1}' | head -1)
                curl -fsS http://127.0.0.1:11434/api/generate \
                  -d "{\"model\":\"$m\",\"prompt\":\"hi\",\"keep_alive\":\"10m\",\"stream\":false}" >/dev/null
                ollama ps
              stdout:
                - contains: "100% GPU"
# check-cachyos-ollama-rocm-pod — the AMD sibling of check-cachyos-ollama-pod, and
# the sole consumer that proves candy/ollama-rocm. Plain cachyos base (no NVIDIA),
# so it also proves the base ollama candy composes without any GPU candy at all.
# SCOPE BOUNDARY, stated so nobody reads more into a green run than it earns: on a
# host with no AMD card this proves composition, that the ROCm backend library
# actually ships, and that the server reaches steady state — NOT that inference
# runs on an AMD GPU. Live GPU enumeration needs a real card passed through, the
# same limit candy/rocm states for itself. Ollama falls back to CPU here, which is
# why every inherited runtime check still passes.
check-cachyos-ollama-rocm-pod:
    pod:
        image: ollama-rocm
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS AMD ollama-rocm image composes on the plain CachyOS base and serves, and the sole consumer proving the ollama-rocm backend candy. Builds and deploys the ollama-rocm pod and runs the checks baked into the ollama, ollama-rocm and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the ROCm/HIP backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port. Without an AMD card passed through the server runs CPU inference, so this bed proves the backend SHIPS, not that it executes on a GPU.
check-cachyos-ai-toolkit-pod:
    pod:
        image: ai-toolkit-cdi
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU AI Toolkit training pod composes and serves on the Arch CUDA base. Builds and deploys the ai-toolkit-cdi pod and runs the inherited candy + dbus baked checks AND the shipping candy's own contract — the pinned upstream COMMIT (ai-toolkit publishes no tags), PyTorch seeing the real GPU, the diffusers revision carrying ZImagePipeline, the Z-Image model handler reporting arch=zimage, both supervised services (the UI server and its job worker) reaching RUNNING, the state tree spliced into the volume by symlink, and the shared LoRA shelf existing at the path pod-comfyui mounts as its models/loras.
        requires_shared: [nvidia-gpu]
        plan:
            - check: both supervised services reach RUNNING — the UI server and the job worker
              # Two services, so a dead worker cannot hide behind a live UI. supervisorctl
              # reports the STATE by name, which is the thing that matters: a FATAL worker
              # still leaves the GUI answering.
              id: ai-toolkit-services-running
              context: [runtime]
              timeout: 120s
              exit_status: 0
              command:
                in_container: true
                command: |
                  set -eu
                  supervisorctl status | tee /tmp/st
                  for svc in ai-toolkit-ui ai-toolkit-worker; do
                    grep -qE "^${svc}[[:space:]]+RUNNING" /tmp/st || {
                      echo "service not RUNNING: ${svc}" >&2
                      exit 1
                    }
                  done
            - check: the GUI answers on the toolkit port
              id: ai-toolkit-ui-live
              context: [runtime]
              timeout: 30s
              eventually: 3m
              retry_interval: 5s
              http:
                http: http://127.0.0.1:${HOST_PORT:8675}/
                status: 200
            - check: PyTorch sees the real GPU, not just an installed CUDA build
              # The candy's own check proves `import torch` works at BUILD time, where there is
              # no device. This is the runtime half: the device must actually enumerate.
              id: ai-toolkit-cuda-device
              context: [runtime]
              stdout:
                - contains: "cuda True"
              exit_status: 0
              command:
                in_container: true
                command: |
                  test -x /home/user/.pixi/envs/default/bin/python3 || { echo "no venv python" >&2; exit 1; }
                  /home/user/.pixi/envs/default/bin/python3 -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
            - check: the pinned upstream COMMIT is what is checked out — not a branch that moved
              id: ai-toolkit-pinned-commit
              context: [runtime]
              exit_status: 0
              command:
                in_container: true
                command: |
                  set -eu
                  ref=$(cat /opt/ai-toolkit/.charly-ref)
                  test "$(git -C /opt/ai-toolkit rev-parse HEAD)" = "$ref"
                  printf 'pinned commit: %s\n' "$ref"
            - check: the pinned diffusers carries ZImagePipeline, and the handler reports arch=zimage
              # The single contract every Z-Image job depends on. It is a property of the
              # diffusers revision ai-toolkit pins, so it is asserted against the built image.
              id: ai-toolkit-zimage-contract
              context: [runtime]
              stdout:
                # BOTH halves of the description, not just the first: the check also prints
                # "arch zimage" from the handler, so assert it here or the claim is half-proven.
                - contains: ZImagePipeline
                - contains: arch zimage
              exit_status: 0
              command:
                in_container: true
                command: |
                  set -eu
                  # The VENV interpreter explicitly, never bare `python3`: the claim is about the
                  # diffusers THAT AI-TOOLKIT PINS, and a bare python3 may resolve to the system
                  # interpreter, whose diffusers is a different package that proves nothing here.
                  PY=/home/user/.pixi/envs/default/bin/python3
                  test -x "$PY"
                  "$PY" -c "from diffusers import ZImagePipeline; print('ZImagePipeline')"
                  cd /opt/ai-toolkit
                  "$PY" -c "from extensions_built_in.diffusion_models.z_image.z_image import ZImageModel; print('arch', ZImageModel.arch)"
            - check: the mutable state is SPLICED into the volume, not left in the image
              # ai-toolkit has no --base-directory flag, so the volume is linked in at start.
              # If this regresses, training output silently lands in the image and is lost on
              # rebuild — the exact failure the symlink exists to prevent.
              id: ai-toolkit-state-spliced
              context: [runtime]
              exit_status: 0
              command:
                in_container: true
                command: |
                  set -eu
                  for d in config output datasets; do
                    test -L "/opt/ai-toolkit/$d" || { echo "not a symlink: /opt/ai-toolkit/$d" >&2; exit 1; }
                    test -d "$HOME/ai-toolkit/$d" || { echo "missing volume dir: $HOME/ai-toolkit/$d" >&2; exit 1; }
                  done
                  echo "state dirs spliced"
            - check: the shared LoRA shelf exists at the path the ComfyUI pod mounts as models/loras
              # This is the PAIRING contract: pod-comfyui mounts the same host directory at
              # ~/ComfyUI/models/loras, so a LoRA trained here is loadable there with no copy.
              id: ai-toolkit-lora-shelf
              context: [runtime]
              exit_status: 0
              command:
                in_container: true
                command: |
                  set -eu
                  test -d /workspace/shared-loras
                  echo "shared LoRA shelf: /workspace/shared-loras"
            - check: the shipped Z-Image LoRA example config is present in the volume's config dir
              id: ai-toolkit-zimage-config
              context: [runtime]
              exit_status: 0
              command:
                in_container: true
                command: |
                  set -eu
                  test -s "$HOME/ai-toolkit/config/z-image-lora-de-turbo.yml"
                  echo "example config seeded"

check-cachyos-comfyui-pod:
    pod:
        image: comfyui-cdi
        disposable: true
        lifecycle: dev
        # Shared model cache, fresh state: see check-comfyui-pod.
        volume:
            - name: comfyui-models
              type: bind
              host: ~/.local/share/charly/models/comfyui/models
              path: /home/user/ComfyUI/models
        description: Sole proof the CachyOS GPU comfyui-cdi image-generation server composes and serves on the Arch CUDA base. Builds and deploys the comfyui-cdi pod and runs the inherited comfyui + dbus baked checks (ComfyUI HTTP UI liveness plus service/port/file/command probes) AND the shipping candy's own contract — the pinned upstream tag, the app/state split (application in the image at /opt/comfyui, every mutable byte in the volume via --base-directory), the absence of the retired ltdrdata Manager checkout, and a real generation round trip (POST /prompt, then the SAME prompt id recorded success in /history).
        requires_shared: [nvidia-gpu]
        plan:
            - check: the serving ComfyUI reports the VERSION this bed pins, from its own API
              id: comfyui-pinned-version
              context: [runtime]
              timeout: 30s
              eventually: 3m
              retry_interval: 2s
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
                body:
                  - contains: '"comfyui_version": "0.46.1"'
            - check: the APPLICATION lives in the image at the pinned tag, not in the state volume
              id: comfyui-app-in-image
              context: [runtime]
              exit_status: 0
              command:
                command: |
                  set -eu
                  test -s /opt/comfyui/.charly-ref
                  grep -qx 'v0.46.1' /opt/comfyui/.charly-ref
                  test -x /opt/comfyui/start-comfyui.sh
                  # the volume path must NOT hold the application
                  test ! -e "${HOME}/ComfyUI/main.py"
            - check: the retired ltdrdata Manager checkout is ABSENT — the built-in manager replaces it
              id: comfyui-legacy-manager-absent
              context: [runtime]
              exit_status: 0
              command:
                command: |
                  set -eu
                  test ! -e /opt/comfyui/custom_nodes/ComfyUI-Manager
            - check: the state tree the start script seeds is complete, inside the volume
              id: comfyui-state-tree
              context: [runtime]
              exit_status: 0
              command:
                command: |
                  set -eu
                  for d in custom_nodes input output user models/checkpoints models/loras; do
                    test -d "${HOME}/ComfyUI/$d" || { echo "missing state dir: $d" >&2; exit 1; }
                  done
            - check: a REAL generation round trip — the prompt is queued and the SAME prompt id reports success in /history
              id: comfyui-generation-roundtrip
              context: [runtime]
              timeout: 300s
              exit_status: 0
              command:
                # IN the container, not on the host: the workflow must name the checkpoint the
                # CONTAINER has, and $COMFYUI_MODEL only exists in its environment. A host-side
                # ${COMFYUI_MODEL} does not resolve and the step SKIPS -- measured on run
                # 2026.319.0028 ("unresolved variables"), which is a green over nothing.
                in_container: true
                command: |
                  set -eu
                  base="http://127.0.0.1:8188"
                  test -n "$COMFYUI_MODEL"
                  wf='{"3":{"class_type":"KSampler","inputs":{"seed":7,"steps":4,"cfg":8,"sampler_name":"euler","scheduler":"normal","denoise":1,"model":["4",0],"positive":["6",0],"negative":["7",0],"latent_image":["5",0]}},"4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":"'"$COMFYUI_MODEL"'"}},"5":{"class_type":"EmptyLatentImage","inputs":{"width":64,"height":64,"batch_size":1}},"6":{"class_type":"CLIPTextEncode","inputs":{"text":"a red cube","clip":["4",1]}},"7":{"class_type":"CLIPTextEncode","inputs":{"text":"blurry","clip":["4",1]}},"8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},"9":{"class_type":"SaveImage","inputs":{"filename_prefix":"bed","images":["8",0]}}}'
                  pid=$(curl -fsS -X POST -H 'Content-Type: application/json' \
                          --data "{\"prompt\":${wf},\"client_id\":\"charly-bed\"}" "$base/prompt" \
                        | sed -E 's/.*"prompt_id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
                  test -n "$pid"
                  echo "queued prompt_id=$pid"
                  i=0
                  while [ "$i" -lt 100 ]; do
                    h=$(curl -fsS "$base/history/$pid" || true)
                    case "$h" in
                      *"\"$pid\""*)
                        case "$h" in
                          *'"status_str": "success"'*|*'"completed": true'*) echo "history: $pid succeeded"; exit 0 ;;
                        esac ;;
                    esac
                    i=$((i+1)); sleep 2
                  done
                  echo "prompt $pid did not reach success in /history" >&2
                  exit 1
check-cachyos-unsloth-studio-pod:
