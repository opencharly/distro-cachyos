        description: Sole proof the maximal headless openclaw-full non-browser gateway + tool stack (gogcli@latest go-install on Arch go 1.26.x, ffmpeg/sqlite) composes and runs on the CachyOS (Arch) base. Builds (npm + go install multistage) and deploys the openclaw-full pod, then runs the inherited agent-forwarding + openclaw-full baked checks asserting gogcli, ffmpeg, sqlite, and the gateway/tool stack present, plus the openclaw verb's health probe against the running 2.0 gateway.
        plan:
            - check: the openclaw verb reaches the gateway's /healthz liveness endpoint on the running 2.0 gateway
              id: openclaw-full-verb-health
              openclaw:
                method: health
              stdout:
                - contains: "ok"
              eventually: 90s
              retry_interval: 5s
              context:
                - runtime
