# Disposable R10 pod beds for the CachyOS GPU image family. Each drives the
# full `charly check run` sequence (build → check box → deploy → check live →
# fresh update → tear down) on the cachyos-namespace image of the same name.
# Host ports are remapped into a dedicated 45xxx range so the beds never
# collide with an operator's production services on the canonical ports.
# Deploy- and build-scope check coverage is inherited from the composed
# layers (the "lowest level" principle) — the beds carry no check: of their
# own. The GPU base (nvidia) and python-ml carry no service, so they are
# proved by `charly check box` alone and need no pod bed.
check-cachyos-jupyter-ml-pod:
    pod:
        image: jupyter-ml
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU jupyter-ml image (JupyterLab + ML/spacy/quarto + jupyter MCP) composes on the Arch CUDA base — the cachyos-distro variant of the fedora jupyter-ml bed. Builds and deploys the jupyter-ml pod (cachyos.nvidia base) and runs the inherited jupyter-ml + notebook-templates + dbus baked checks — JupyterLab HTTP liveness, package/file/service probes, and jupyter MCP-server probes.
        requires_shared: [nvidia-gpu]
check-cachyos-ollama-pod:
    pod:
        image: ollama
        disposable: true
        lifecycle: dev
        requires_shared: [nvidia-gpu]
        description: >-
            Sole proof the CachyOS GPU ollama LLM-server image composes and serves on the Arch CUDA base, that the packaged CUDA backend is present, that the compiled-in command:ollama plugin works end-to-end, AND that real inference runs on the passed-through NVIDIA GPU. Builds and deploys the ollama pod and runs the checks baked into the ollama, ollama-cuda and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the CUDA backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port — plus the bed's own GPU-inference plan: nvidia-smi enumerates the card via CDI, a tiny model answers a prompt (a real generation pass), and `ollama ps` reports the model 100% GPU-resident (proving the CUDA backend executed it, not CPU fallback). The `requires_shared: [nvidia-gpu]` makes the arbiter flip the IOMMU group vfio→nvidia at deploy and back at teardown, so the pod reaches the card through CDI. On Arch the server comes from the split `ollama` package rather than the upstream tarball, so this bed is also the proof of that install path.
        plan:
            - check: the passed-through NVIDIA GPU is visible inside the container via CDI — nvidia-smi enumerates the card
              id: ollama-gpu-visible
              context:
                - runtime
              command: nvidia-smi -L
              stdout:
                - contains: "NVIDIA"
            - check: ollama runs a real generation pass — a tiny model answers a prompt (the first run pulls the model, hence the raised timeout)
              id: ollama-gpu-inference
              context:
                - runtime
              timeout: 5m
              exit_status: 0
              command: ollama run qwen2.5:0.5b "What is 2+2? Reply with just the number."
            - check: the model is resident on the GPU — ollama ps reports 100% GPU in the processor column, proving the CUDA backend executed the generation rather than CPU fallback
              id: ollama-gpu-resident
              context:
                - runtime
              command: ollama ps
              stdout:
                - contains: "100% GPU"
# check-cachyos-ollama-rocm-pod — the AMD sibling of check-cachyos-ollama-pod, and
# the sole consumer that proves candy/ollama-rocm. Plain cachyos base (no NVIDIA),
# so it also proves the base ollama candy composes without any GPU candy at all.
# SCOPE BOUNDARY, stated so nobody reads more into a green run than it earns: on a
# host with no AMD card this proves composition, that the ROCm backend library
# actually ships, and that the server reaches steady state — NOT that inference
# runs on an AMD GPU. Live GPU enumeration needs a real card passed through, the
# same limit candy/rocm states for itself. Ollama falls back to CPU here, which is
# why every inherited runtime check still passes.
check-cachyos-ollama-rocm-pod:
    pod:
        image: ollama-rocm
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS AMD ollama image composes on the plain CachyOS base and serves, and the sole consumer proving the ollama-rocm backend candy. Builds and deploys the ollama-rocm pod and runs the checks baked into the ollama, ollama-rocm and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the ROCm/HIP backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port. Without an AMD card passed through the server runs CPU inference, so this bed proves the backend SHIPS, not that it executes on a GPU.
check-cachyos-comfyui-pod:
    pod:
        image: comfyui
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU comfyui image-generation server composes and serves on the Arch CUDA base. Builds and deploys the comfyui pod and runs the inherited comfyui + dbus baked checks — ComfyUI HTTP UI liveness plus service/port/file/command probes.
        requires_shared: [nvidia-gpu]
check-cachyos-unsloth-studio-pod:
    pod:
        image: unsloth-studio
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU unsloth-studio fine-tuning notebook + API composes on the Arch CUDA base (no MCP candy, unlike jupyter-ml). Builds and deploys the unsloth-studio pod and runs the inherited unsloth-studio + notebook-finetuning + dbus baked checks — notebook/API HTTP liveness plus file/service/port/command probes.
        requires_shared: [nvidia-gpu]
check-cachyos-immich-ml-pod:
    pod:
        image: immich-ml
        disposable: true
        lifecycle: dev
        description: Sole proof the full 9-candy Immich photo stack (Immich + PostgreSQL + VectorChord + Redis + CUDA ML) composes and reaches steady-state together on the Arch CUDA base — the heaviest multi-service pod bed. Builds and deploys the immich-ml pod (nodejs + python-ml + supervisord + postgresql + vectorchord + redis + immich + immich-ml) via the build [pac, aur] + npm multistage, then runs the inherited multi-service HTTP/port/service/command/file/package liveness checks.
        requires_shared: [nvidia-gpu]
check-selkies-kde-pod:
    pod:
        image: selkies-kde
        disposable: true
        lifecycle: dev
        description: Sole proof of the full KDE Plasma selkies streaming desktop (de-SDDM startplasma-wayland nested in pixelflux, VAAPI/x264 HW-encode) on the plain CachyOS base — the wl-probe-bearing compositor variant. Builds (pixi pixelflux Rust + AUR chrome/wlrctl multistage) and deploys the selkies-kde pod, then runs the inherited kde-selkies wl probes (compositor=kwin, toplevel, clipboard, type), the selkies HTTPS :3000 stream check, chrome-devtools-mcp probes, and the VAAPI H264 encode probe (HW-encodes on the AMD iGPU host).
# check-selkies-labwc-pod deploys the CPU streaming desktop on the CachyOS
# (Arch) base. Exercises the cachyos→arch-builder pixi build of selkies
# (pixelflux Rust compile) AND the AUR build of google-chrome + wlrctl, plus
# the labwc/waybar/swaync/pipewire/traefik/sshd layer stack. Ports are
# remapped off the canonical 3000/9222/9224/2222 to avoid host clashes with a
# running selkies-labwc or the other desktop beds. The deploy-scope probes
# assert the AUR-built binaries actually landed on the running container; the
# baked layer/image checks (incl. the Selkies HTTPS 200 UI probe) cover the
# rest of the deploy surface. selkies-labwc's canonical home (relocated from
# the retired opencharly/selkies submodule, alongside its GPU sibling).
check-selkies-labwc-pod:
    pod:
        image: selkies-labwc
        disposable: true
        lifecycle: dev
        description: Sole proof of the CPU labwc selkies streaming desktop building from the cachyos→arch-builder pixi path — the labwc compositor variant (no wl probe) and the base box for android-emulator. Builds (pixi pixelflux + AUR chrome/wlrctl multistage) and deploys the selkies-labwc pod, then runs the inherited selkies-desktop baked checks — labwc/waybar/swaync/pavucontrol/chrome package+service probes, the selkies HTTPS :3000 UI probe, and chrome-devtools-mcp probes.
check-cardwire-vm:
    vm:
        # HOST REQUIREMENT: the bootstrap VM disk build needs >= 102.0 GiB of free space
        # on the build host's /tmp (charly vm builds the disk there); redirect the build
        # to a larger filesystem with TMPDIR + CHARLY_VM_STATE_DIR (see plan §2.3).
        from: cachyos-gpu-vm
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for plugin-cardwire + plugin-bpf facts on the REAL VFIO surface: a CachyOS pacstrap VM receiving the passed-through NVIDIA GPU (auto-allocated hostdev via requires_exclusive: [nvidia-gpu]) with a SPICE terminal (sway + ghostty on the virtio head, host-side plugin-spice probes) and cardwire installed from the OGC pacman repo with defaults. T1 (always): guest bpf LSM active, cardwired active, CLI + config defaults. T2 (this host): NVIDIA 0x10de present in-guest; cardwire exposes it as the block target and the mode/block gates are asserted as cardwire's REAL upstream contract on this 2-GPU topology (set manual REFUSED with the Laptop-classification message; per-GPU block REFUSED with the manual-mode-only message; the blocked flag stays clear), plus config persistence across daemon restart via the toml. The block->ENOENT->unblock->open-OK semantics are proven by the Phase-0 spike on a Manual-classified guest (docs, not replayed here). The bed REQUIRES the nvidia-gpu token (auto-allocate or fail hard), so the full tier always runs here.
        requires_exclusive: [nvidia-gpu]
        add_candy:
            - nvidia-driver
            - wheel-nopasswd
            - ghostty
            - cardwire-seat
            - '@github.com/opencharly/plugin-cardwire/candy/plugin-cardwire:v2026.243.1202'
            - '@github.com/opencharly/plugin-cardwire/candy/cardwire-install:v2026.243.1202'
            - '@github.com/opencharly/plugin-bpf/candy/plugin-bpf:v2026.243.1059'
        install_opts:
            with_service: true
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true
            verify: true
        plan:
            # ---- T1 (always) ----
            - check: guest bpf LSM active (the eBPF blocker's gate, /sys/kernel/security/lsm)
              id: t1-bpf-lsm-active
              exit_status: 0
              stdout:
                - contains: bpf
              context: [runtime]
              command: cat /sys/kernel/security/lsm
            - check: cardwired is active after install
              id: t1-cardwired-active
              exit_status: 0
              stdout:
                - contains: active
              context: [runtime]
              command: systemctl is-active cardwired
            - check: the cardwire CLI is installed at /usr/bin/cardwire
              id: t1-cardwire-cli
              file:
                file: /usr/bin/cardwire
                exists: true
              context: [runtime]
            - check: the cardwire defaults config carries experimental_nvidia_block=true
              id: t1-cardwire-config-defaults
              file:
                file: /etc/cardwire/cardwire.toml
                contains: 'experimental_nvidia_block = true'
              context: [runtime]
            - check: the SPICE terminal seat is up (sway compositor + ghostty)
              id: t1-seat-up
              exit_status: 0
              stdout:
                - contains: sway
              context: [runtime]
              command: pgrep -af 'sway --unsupported-gpu' | head -1
            # ---- T2 (in-guest NVIDIA driver present — full tier on this host) ----
            - check: the passed-through NVIDIA GPU is visible in-guest (vendor 0x10de)
              id: t2-nvidia-visible
              exit_status: 0
              stdout:
                - contains: NVIDIA
              context: [runtime]
              command: lspci | grep -i nvidia | head -1
            - check: cardwire list exposes the NVIDIA GPU as the block target (non-default id)
              id: t2-nvidia-nondefault
              exit_status: 0
              stdout:
                - matches: '.*NVIDIA.*'
              context: [runtime]
              command: sudo -n cardwire list | grep -i NVIDIA
            - check: the mode gate contract — on this 2-GPU Laptop-classified topology set manual is REFUSED by upstream design and hybrid still applies
              id: t2-mode-gate
              exit_status: 0
              stdout:
                - contains: T2-MANUAL-GATE-REFUSED
                - contains: T2-MODE-SET-HYBRID
              context: [runtime]
              command: |
                set -e
                out=$(sudo -n cardwire set manual 2>&1) && { echo "T2-MANUAL-UNEXPECTED-OK: $out"; exit 1; } || true
                echo "$out" | grep -q 'Manual mode is only available' && echo 'T2-MANUAL-GATE-REFUSED'
                sudo -n cardwire set hybrid >/dev/null 2>&1 && echo 'T2-MODE-SET-HYBRID'
            - check: the block-surface contract — per-GPU block is manual-mode-only upstream; on this topology both gates REFUSE, the blocked flag stays clear, and the block->ENOENT->unblock->OK semantics are Phase-0-spike-proven on a Manual-classified guest
              id: t2-block-surface-gate
              exit_status: 0
              stdout:
                - contains: T2-BLOCK-SURFACE-GATED
                - contains: T2-MANUAL-GATE-STILL-REFUSED
                - contains: T2-BLOCKED-FLAG-CLEAR
              context: [runtime]
              command: |
                set -e
                nvidia_id=$(sudo -n cardwire list | awk '/NVIDIA/{print $1}' | head -1)
                if [ -z "$nvidia_id" ]; then echo 'T2-NO-NVIDIA (portable N/A)'; exit 0; fi
                out=$(sudo -n cardwire gpu "$nvidia_id" --block 2>&1) && { echo "T2-BLOCK-UNEXPECTED-OK: $out"; exit 1; } || true
                echo "$out" | grep -q 'Per GPU block is only available on manual mode' && echo 'T2-BLOCK-SURFACE-GATED'
                m=$(sudo -n cardwire set manual 2>&1) || true
                echo "$m" | grep -q 'Manual mode is only available' && echo 'T2-MANUAL-GATE-STILL-REFUSED'
                f=$(sudo -n cardwire list | awk -v id="$nvidia_id" '$1==id{print $NF}' | head -1)
                echo "blocked-flag: $f"
                echo "$f" | grep -q false && echo 'T2-BLOCKED-FLAG-CLEAR'
            - check: config persistence across daemon restart (auto-apply-gpu-state survives cardwired restart via the toml)
              id: t2-mode-persistence
              exit_status: 0
              stdout:
                - contains: T2-CONFIG-PERSISTED
                - contains: T2-CONFIG-PERSISTED-2
              context: [runtime]
              command: |
                set -e
                sudo -n cardwire config auto-apply-gpu-state false
                sudo -n systemctl restart cardwired
                sleep 2
                out=$(sudo -n cardwire config auto-apply-gpu-state)
                echo "after-restart: $out"
                echo "$out" | grep -qi 'false' && echo 'T2-CONFIG-PERSISTED'
                sudo -n cardwire config auto-apply-gpu-state true
                sudo -n systemctl restart cardwired
                sleep 2
                out2=$(sudo -n cardwire config auto-apply-gpu-state)
                echo "restored: $out2"
                echo "$out2" | grep -qi 'true' && echo 'T2-CONFIG-PERSISTED-2'
            # ---- SPICE terminal probes (host-side, plugin-spice) ----
            - check: spice=status — the SPICE wire is connected to the guest seat
              id: spice-connected
              spice: status
              stdout: {contains: display}
              context: [runtime]
