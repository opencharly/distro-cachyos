#  opencharly/distro-cachyos — the CachyOS image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/cachyos.
#
#  SINGLE-FILE config: every entity (the cachyos base + pacstrap family + the 7
#  relocated app/fixture boxes under box/, the cachyos VMs, the disposable check
#  beds, the charly-cachyos operator profile + its kind:local template) is inlined
#  here or discovered under box/. This repo VENDORS its cachyos-exclusive layers
#  locally under candy/ (resolved via the discover: block); every shared layer is
#  an `@github.com/opencharly/<kind>-<name>:<tag>` ref to that candy's OWN repo (the
#  candy de-submodule cutover). NO exceptions remain: `charly` and `charly-mcp` were the
#  last two, held back in #33 because repointing them then surfaced a remote-candy-name
#  conflict, and repointed in #34 once that cleared. The
#  Arch base/builder stack lives in the opencharly/distro-arch submodule (2026-06 box
#  inversion).
#
#  import: a single namespaced entry — `arch: <ref>` mounts opencharly/distro-arch under
#  the `arch` namespace, so `arch.arch` (cachyos-pacstrap-builder's base),
#  `arch.arch-builder` (the cachyos base's builder), and `arch.cuda-arch-builder`
#  (the selkies-*-nvidia GPU builder) resolve. One-directional — arch imports
#  nothing back; the former main↔cachyos mutual cycle is dissolved.
#
#  Directly buildable: `charly box build cachyos` (from the parent repo:
#  `charly -C box/cachyos box build cachyos`; anywhere:
#  `charly --repo opencharly/distro-cachyos box build cachyos`).
version: 2026.249.2125
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
import:
    # The Arch base/builder stack lives in the opencharly/distro-arch submodule (2026-06
    # box inversion). cachyos-pacstrap-builder bases on arch.arch; the cachyos base
    # + selkies images route their pixi/npm/cargo/aur builders to arch.arch-builder
    # / arch.cuda-arch-builder. Candy layers resolve via @github refs (not this
    # namespace). One-directional import — arch imports nothing back.
    - arch: '@github.com/opencharly/distro-arch:v2026.250.0229'
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
# Disposable R10 test bed for the cachyos bootstrap VM (kind:check — the
# 2026-05 deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the unattended
# destroy+rebuild driven by `charly check run check-cachyos-vm`.
check-cachyos-vm:
    # HOST REQUIREMENT: the bootstrap VM disk build needs >= 102.0 GiB of free space
    # on the build host's /tmp (charly vm builds the disk there); a host with less
    # fails with 'insufficient free space on /tmp/charly-priv-N'. Redirect the build
    # to a larger filesystem with TMPDIR + CHARLY_VM_STATE_DIR.
    # mkinitcpio 'failed to detect root filesystem' in the base-image build: the
    # chroot autodetect fallback, allowlisted by charly#400
    # (mkinitcpio-chroot-autodetect-fallback + mkinitcpio-chroot-warnings); this
    # repo's charly ref advance (v2026.236.2040) is the batch exit.
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: Sole proof of the CachyOS pacstrap-from-scratch bootstrap VM booting AND the charly toolchain installing as a native pac package (charly via the `charly generate-packages` plugin + pacman -U), distinct from the Arch cloud-VM pac witness. Pacstrap-builds a CachyOS rootfs, boots it under UEFI, deploys the charly + dev-tools layers over SSH (the charly localpkg builds the charly package via the `charly generate-packages` plugin from the candy's `packaging:` section), then runs the baked charly-binary/version + dev-tools command/file/package checks.
        # The cachyos bootstrap-VM R10 canary: pacstrap builds the cachyos rootfs
        # from scratch, the guest boots, the charly candy deploys onto it (its
        # localpkg: builds the charly package via the `charly generate-packages`
        # plugin (sdk/packagekit) from the candy's `packaging:` section and
        # `pacman -U`s it in — a failed install fails THIS bed at the deploy
        # step), and the baked charly-binary/charly-version checks run on the guest.
        # The explicit pac localpkg AUTO-RESOLVE assertion (pacman -U pulling the
        # mandatory repo deps podman/libvirt/tailscale/gocryptfs) lives ONCE, on
        # main's purpose-built `check-charly-vm` pac witness — the dedicated home for
        # that assertion, so it is not duplicated across beds.
        # dev-tools is composed here so this canary also validates the cachyos
        # workstation's core dev toolkit installs (golangci-lint / gopls / etc.).
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
            - '@github.com/opencharly/layer-dev-tools:v2026.239.1624'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
# Disposable R10 bed for the charly package's systemd integration + the full
# MCP surface on the CachyOS bootstrap VM (the HOST-install path): the charly
# toolchain installs as a native pac package carrying the systemd units +
# /etc/charly/charly.yml, the NON-AUTOSTARTING units start the MCP server on
# demand, and every MCP functionality is exercised via proper mcp: checks
# against the cachyos-vm's mcp_provide declaration (the substrate-neutral P4
# resolution — the mcp: verb dials the host-forwarded port).
check-cachyos-mcp-vm:
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the charly package's systemd units + /etc/charly/charly.yml +
            the MCP server on a fresh CachyOS VM. Installs charly as a native pac
            package (the shipped units + config), composes the charly-mcp-enable
            candy (the deploy does systemctl enable --now on the non-autostarting
            packaged unit - the charly-native start), and exercises every MCP
            functionality (ping / list-tools / call) via proper mcp: checks - the
            standing R10 gate for the host-install path. The non-autostarting
            contract (fresh-install is-enabled = disabled) is asserted by the
            per-distro install-tests.
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
            - charly-mcp-enable
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the packaged system unit is installed and binds loopback only (P3 - the host default)
              id: systemd-system-unit
              file:
                  file: /usr/lib/systemd/system/charly-mcp.service
                  exists: true
                  contains: "127.0.0.1:18765"
            - check: the packaged user unit is installed
              id: systemd-user-unit
              file:
                  file: /usr/lib/systemd/user/charly-mcp.service
                  exists: true
            - check: the MCP service is enabled and running after the deploy's systemctl enable --now (the charly-mcp-enable candy)
              id: unit-enabled-for-test
              service:
                  service: charly-mcp
                  enabled: true
                  running: true
              timeout: 30s
              eventually: 60s
              retry_interval: 3s
            - check: the system-wide /etc/charly/charly.yml is shipped
              id: etc-charly-config
              file:
                  file: /etc/charly/charly.yml
                  exists: true
            - check: the shipped config validates as a project
              id: etc-charly-validates
              command:
                  command: charly box validate -C /etc/charly
            - check: the MCP port is reachable from the host via the forwarded port
              id: mcp-port-reachable
              context: [runtime]
              # The FIXED forwarded host port (the entity's 18765:18765 forward) —
              # a literal, not a threaded env var: the check's ${...} variable
              # surface is binary-dependent (the 1212 build threaded HOST_PORT, the
              # 1226 build left it unresolved and SKIPped the step). The fixed
              # forward is the merged design; the literal dials it deterministically.
              addr: 127.0.0.1:18765
              timeout: 30s
              # eventually: the guest server may still be starting when check-live
              # begins (the 1212 signature: dial refused at the first probe, the
              # mcp: ping with eventually passed seconds later).
              eventually: 90s
              retry_interval: 3s
            - check: the MCP server answers ping
              id: mcp-charly-ping
              mcp:
                  method: ping
                  mcp_name: charly
              timeout: 30s
              eventually: 90s
              retry_interval: 3s
              stdout:
                  equals: ok
            - check: the MCP server exposes the charly tools
              id: mcp-charly-list-tools
              mcp:
                  method: list-tools
                  mcp_name: charly
              stdout:
                  - contains: box.list.boxes
                  - contains: version
            - check: the version tool round-trips a CalVer
              id: mcp-charly-call-version
              mcp:
                  method: call
                  tool: version
                  input: "{}"
                  mcp_name: charly
              exit_status: 0
              stdout:
                  - matches: '[0-9]{4}\.[0-9]+'
            - check: box.list.boxes resolves the /etc/charly project locally (no network fallback)
              id: mcp-charly-call-list-boxes
              mcp:
                  method: call
                  tool: box.list.boxes
                  input: "{}"
                  mcp_name: charly
              timeout: 90s
              exit_status: 0

# The charly-native start of the packaged (non-autostarting) charly-mcp unit: a
# service declaration with use_packaged + enable: true makes the deploy run
# systemctl enable --now on the shipped unit - the bed's test setup. The check
# phases are verify-only (run: steps never execute there), so the start must be
# a deploy-time action; this candy IS that action.
charly-mcp-enable:
    candy:
        version: 2026.249.2125
        description: >-
            Enables + starts the packaged charly-mcp unit on this deployment
            (systemctl enable --now via the use_packaged service declaration).
            The units ship non-autostarting; this candy is the bed's explicit,
            charly-native start for the MCP checks.
        # The use_packaged service requires the candy to declare the package that
        # provides the unit — the charly package (installed by the layer-charly
        # localpkg; the enable candy re-declares it so the service resolution has
        # its provider).
        package:
            - charly
        service:
            - name: charly-mcp
              use_packaged: charly-mcp.service
              enable: true
              scope: system
              # The SHIPPED unit binds 127.0.0.1 (the P3 host default, asserted by
              # the bed's unit-file check). The host-side mcp: checks reach the
              # server through the forwarded port (arrives on the VM's external
              # interface), so the deploy plan below writes a systemd drop-in
              # overriding the runtime ExecStart to 0.0.0.0 — the shipped unit is
              # untouched, the running server binds all interfaces (normal inside
              # a VM; the host system is the security boundary). The drop-in is
              # written with a deploy root command: step (install -d + printf),
              # NOT the schema `overrides:` field: sdk/deploykit's packaged-service
              # compile drops entry.Overrides, and the run: file step's provision
              # ran as the guest user (mkdir EACCES + unterminated here-doc, R1ed)
              # — the root command step + restart is the working bed-side
              # mechanism.
        plan:
            - run: write the all-interfaces drop-in (a root command step — the run:file step's provision ran as the guest user, mkdir Permission-denied, R1ed)
              id: write-bind-dropin
              command:
                  command: |
                      install -d -m 0755 /etc/systemd/system/charly-mcp.service.d
                      printf '%s\n' '[Service]' 'ExecStart=' 'ExecStart=/usr/bin/charly mcp serve --listen 0.0.0.0:18765' > /etc/systemd/system/charly-mcp.service.d/charly-bind.conf
                      chmod 0644 /etc/systemd/system/charly-mcp.service.d/charly-bind.conf
            - run: reload systemd and restart charly-mcp so the drop-in takes effect
              id: restart-mcp
              command:
                  command: systemctl daemon-reload && systemctl restart charly-mcp
            - check: the packaged charly-mcp unit is installed (the service declaration enables it)
              id: charly-mcp-unit-present
              file:
                  file: /usr/lib/systemd/system/charly-mcp.service
                  exists: true
            - check: the all-interfaces drop-in override is present
              id: bind-dropin-present
              file:
                  file: /etc/systemd/system/charly-mcp.service.d/charly-bind.conf
                  exists: true
                  contains: "0.0.0.0:18765"
# Disposable R10 bed mirroring the cachyos-gpu WORKSTATION's exact dual-desktop
# config — the acceptance gate for the live Part C migration:
#   host (IOMMU on) → cachyos-gpu-vm (VFIO GPU passthrough, nvidia-open kernel
#   module) running BOTH (a) the full in-guest KDE Plasma SDDM seat (the
#   bare-metal desktop on the virtual head) AND (b) a nested selkies-kde-nvidia
#   POD (the headless WebRTC streaming desktop, real NVENC).
# The bed applies the nvidia toolkit + nvidia-driver kernel layer to the guest
# (the driver layer reboots the guest, via the RebootStep), then runVM deploys
# the nested `selkies-kde` pod as a PERSISTENT in-guest quadlet
# (deployNestedPodsInGuest: host-build selkies-kde-nvidia → cp-box into the
# guest → the guest's own project-free `charly deploy from-box`, lingering on so
# it survives a guest reboot). This is the nested-pod-in-VM capability under
# test. The deploy-scope checks below run inside the guest over SSH.
#
# PORTABLE: every GPU/NVENC check gates on an active in-guest NVIDIA driver and
# passes with an explanatory N/A when none is present — so the bed runs
# anywhere. On a host with the cachyos-gpu-vm hostdev block added locally, the
# same checks assert real GPU encode. See cachyos-gpu-vm in vm.yml.
# ---------------------------------------------------------------------------
# punktfunk — the streaming host, proved on BOTH venues because the two halves
# of the candy cannot be proved by one.
#
#   check-punktfunk-pod  the CONTAINER venue: supervisord cannot use a systemd
#                        user unit, so the host is launched by the candy's
#                        wrapper, which waits for sway's IPC socket. This bed is
#                        the only place the compositor path and the `punktfunk:`
#                        verb's live dispatch are exercised.
#   check-punktfunk-vm   the SYSTEMD venue: the PACKAGED punktfunk-host user
#                        unit, lingering, and the management plane under a real
#                        init — the claim a supervisord container structurally
#                        cannot make.
# ---------------------------------------------------------------------------
check-punktfunk-pod:
    pod:
        image: punktfunk-host
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the punktfunk CONTAINER venue and of the `punktfunk:` check verb against a live host. Builds punktfunk-host on cachyos, deploys it with a headless sway compositor, and runs the candy's baked package/key/host.env/wrapper checks plus the verb's own health, status, compositors, clients and json_path probes - the status/clients probes proving the verb discovers the host-generated bearer token inside the venue.
        plan:
            - check: the punktfunk verb reaches the management API's unauthenticated health route
              id: pf-verb-health
              punktfunk:
                method: health
              stdout:
                - contains: '"status":"ok"'
              eventually: 90s
              retry_interval: 5s
              context:
                - runtime
            - check: the verb discovers the host-generated bearer token in the venue and reads host identity
              id: pf-verb-status
              punktfunk:
                method: status
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
            - check: the verb reports the compositor backends the host can drive
              id: pf-verb-compositors
              punktfunk:
                method: compositors
              context:
                - runtime
            - check: the verb lists paired native clients (empty on a fresh host, but authenticated)
              id: pf-verb-clients
              punktfunk:
                method: clients
              context:
                - runtime
            - check: json_path extracts a single field instead of matching the whole document
              id: pf-verb-jsonpath
              punktfunk:
                method: health
                json_path: status
              stdout:
                - equals: ok
              context:
                - runtime
# The VM this bed boots. An Arch CLOUD IMAGE rather than the cachyos pacstrap
# bootstrap: what is under test is the systemd USER-unit path, and a prebuilt
# qcow2 reaches a booted systemd guest in a fraction of the time without changing
# anything about that. punktfunk's pacman repo is the same on Arch and CachyOS.
punktfunk-vm:
    vm:
        source:
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            checksum:
                type: sha256
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        # BIOS: the Arch cloud image's EFI path boots a stale embedded grub.cfg and
        # loses the console to the simpledrm->virtio takeover race. See
        # /charly-vm:arch-cloud-vm Finding B.
        firmware: bios
        network:
            mode: user
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
                # curl is load-bearing, not incidental: the `punktfunk:` verb issues its
                # management-API requests from INSIDE the venue (the API is loopback-only
                # by punktfunk's design), and the candy's own mgmt-API check curls too.
                - curl
check-punktfunk-vm:
    vm:
        from: punktfunk-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the punktfunk SYSTEMD path: the candy installs from unom's signed pacman repo onto a real systemd guest, lingering is enabled for the deploying account, and the PACKAGED punktfunk-host user unit is enabled with the management API answering - none of which a supervisord container venue can demonstrate.
        add_candy:
            - '@github.com/opencharly/layer-punktfunk:v2026.242.1658'
        install_opts:
            # REQUIRED: the candy adds a third-party pacman repo, and needs root for
            # pacman-key, usermod and loginctl.
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: systemd is the running init in the guest, so the user-unit path is the one under test
              id: pf-vm-systemd-present
              exit_status: 0
              context:
                - runtime
              command: |
                test -d /run/systemd/system && echo SYSTEMD-OK
            - check: lingering is enabled for the deploying account
              id: pf-vm-lingering
              exit_status: 0
              stdout:
                - contains: "Linger=yes"
              context:
                - runtime
              command: |
                loginctl show-user "$(getent passwd 1000 | cut -d: -f1)" -p Linger
            # The next three assertions are stated HERE rather than relied on from the
            # punktfunk candy's own baked checks: when the candy arrives as an @github
            # `add_candy:` ref, its baked checks are not collected into this bed's
            # check-live run (measured: 2 steps, the bed's own). A bed has to assert what
            # its description claims, so the load-bearing claims are restated here.
            - check: the three punktfunk packages installed from unom's pacman repo in the guest
              id: pf-vm-packages
              exit_status: 0
              stdout:
                - contains: "PF-PKGS-OK"
              context:
                - runtime
              command: |
                pacman -Q punktfunk-host punktfunk-web punktfunk-scripting >/dev/null 2>&1 &&
                  echo PF-PKGS-OK
            - check: the PACKAGED punktfunk-host user unit is enabled under the lingering account
              id: pf-vm-user-unit-enabled
              # The claim a supervisord container structurally cannot make. Queried with
              # `--machine=<user>@.host --user`, which is what systemd prescribes for
              # another user's manager; `runuser -- systemctl --user` reaches no user bus.
              exit_status: 0
              stdout:
                - contains: "PF-USER-UNIT-OK"
              context:
                - runtime
              command: |
                PF_USER="$(getent passwd 1000 | cut -d: -f1)"
                systemctl --machine="$PF_USER@.host" --user is-enabled punktfunk-host.service >/dev/null 2>&1 &&
                  echo PF-USER-UNIT-OK
            - check: the management API answers in the guest, so the packaged unit actually reached serve
              id: pf-vm-mgmt-api
              # -k because the management API serves a self-signed certificate.
              exit_status: 0
              stdout:
                - contains: '"status":"ok"'
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
              command: |
                curl -sk https://127.0.0.1:47990/api/v1/health
check-cachyos-gpu-vm:
    # HOST REQUIREMENT: the bootstrap VM disk build needs >= 102.0 GiB of free space
    # on the build host's /tmp (charly vm builds the disk there); a host with less
    # fails with 'insufficient free space on /tmp/charly-priv-N'. Redirect the build
    # to a larger filesystem with TMPDIR + CHARLY_VM_STATE_DIR.
    vm:
        from: cachyos-gpu-vm
        disposable: true
        lifecycle: dev
        description: Sole proof of the operator's dual-desktop GPU workstation config — a VFIO GPU-passthrough VM running BOTH a bare-metal KDE/SDDM seat AND a nested selkies-kde-nvidia streaming pod with real NVENC; the only bed exercising spice+wl+mcp + gpu-passthrough + preempt + nested + localpkg + multistage together. Pacstrap GPU-passthrough VM (preempts the preemptible nvidia-gpu holder) installs the KDE seat + nvidia driver/CDI + charly localpkg + npm AI CLIs, deploys a nested selkies-kde-nvidia quadlet, then over SSH runs ~14 command checks plus the inherited cachyos-gpu-desktop-check spice probes; GPU/NVENC checks N/A cleanly without a VFIO host.
        # Claims the single physical NVIDIA GPU. The resource arbiter
        # (candy/plugin-preempt's verb:arbiter — the former charly/preempt.go is
        # DELETED, K-wave 2) gracefully preempts any RUNNING preemptible holder of
        # the `nvidia-gpu` token — e.g. the operator's vm:cachyos-gpu workstation
        # when its PER-HOST `~/.config/charly/deploy.yml` overlay marks it
        # `preemptible: {holds: [nvidia-gpu]}` — before this bed brings up its VM,
        # and restores it after teardown. The
        # token is portable (a name); on a host with no preemptible nvidia-gpu
        # holder the arbiter finds nothing to preempt (no-op), so the bed still
        # runs anywhere. See /charly-internals:disposable "The resource-arbitration
        # axis", /charly-core:deploy.
        requires_exclusive: [nvidia-gpu]
        add_candy:
            # Order matters: everything before nvidia-driver, whose reboot: true
            # emits a trailing RebootStep — so the guest reboots ONCE after the
            # whole stack is installed and the enabled workspace.mount + guest
            # agent come back clean on the fresh boot. All packages arrive via
            # these layers (never the VM bootstrap package list).
            - podman
            - '@github.com/opencharly/pod-qemu-guest-agent:v2026.239.1632'
            - '@github.com/opencharly/layer-workspace-mount:v2026.239.1626'
            # nodejs + claude-code exercise the cross-host npm builder on a VM:
            # the npm builder runs on the host and the ~/.npm-global artifacts are
            # tarred into the guest home. Proves the AI-CLI stack installs on a VM
            # (the bug that made claude/codex/etc. silently absent) plus the
            # deploy-time {{.Home}} env.d resolution + env.d-sourcing managed block.
            - '@github.com/opencharly/layer-nodejs:v2026.239.1624'
            - '@github.com/opencharly/layer-claude-code:v2026.239.1626'
            # Full bare-metal KDE Plasma SEAT — the in-guest half of the workstation
            # (Plasma + SDDM + graphical .target on the virtual head), CachyOS
            # theming, fonts/codecs/dev-gap. The WebRTC STREAMING desktop is NOT an
            # in-guest layer here — it runs as the nested selkies-kde pod below
            # (kde-selkies moved into the selkies-kde-nvidia image). This mirrors the
            # workstation's dual-desktop split: bare-metal seat + headless stream.
            - '@github.com/opencharly/pod-kde-desktop:v2026.243.1806'
            - cachyos-kde-settings
            # Shared desktop/monitor/SPICE/selkies + mouse/keyboard/screenshot
            # checks (+ ydotool test tool). charly check live collects this layer's
            # deploy-scope checks for BOTH the bed and the operator VM (R3).
            - cachyos-gpu-desktop-check
            - '@github.com/opencharly/layer-fonts-extended:v2026.240.0218'
            - '@github.com/opencharly/layer-desktop-media:v2026.243.1041'
            - '@github.com/opencharly/layer-cachyos-extras:v2026.239.1610'
            # charly (→ charly layer) exercises the charly-layer-on-VM-deploy path: on
            # this Arch/CachyOS guest the charly layer's localpkg builds the charly
            # package via the `charly generate-packages` plugin (sdk/packagekit) from
            # the candy's `packaging:` section + pacman -U's it into the guest at
            # /usr/bin/charly — proving the proper-package install
            # (not the stale curl-a-binary fallback). Matches the operator
            # cachyos-gpu workstation, which lists charly. Placed before
            # nvidia-driver so nvidia-driver's reboot: still trails the whole stack.
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
            - '@github.com/opencharly/layer-nvidia:v2026.236.116'
            - nvidia-driver
        install_opts:
            # with_service gates the systemd unit enable for sddm (the bare-metal
            # KDE seat). The persistent cachyos-gpu deploy sets it; the bed must
            # too, or the desktop services install but never enable (the R10
            # failure). The selkies STREAM is now in the nested pod, not these
            # in-guest layers.
            with_service: true
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true
            verify: true
