# Disposable R10 pod beds for the CachyOS GPU image family. Each drives the
# full `charly check run` sequence (build → check box → deploy → check live →
# fresh update → tear down) on the cachyos-namespace image of the same name.
# Host ports are remapped into a dedicated 45xxx range so the beds never
# collide with an operator's production services on the canonical ports.
# Deploy- and build-scope check coverage is inherited from the composed
# layers (the "lowest level" principle) — the beds carry no check: of their
# own. The GPU base (nvidia) and python-ml carry no service, so they are
# proved by `charly check box` alone and need no pod bed.
check-cachyos-jupyter-ml-pod:
    pod:
        image: jupyter-ml
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU jupyter-ml image (JupyterLab + ML/spacy/quarto + jupyter MCP) composes on the Arch CUDA base — the cachyos-distro variant of the fedora jupyter-ml bed. Builds and deploys the jupyter-ml pod (cachyos.nvidia base) and runs the inherited jupyter-ml + notebook-templates + dbus baked checks — JupyterLab HTTP liveness, package/file/service probes, and jupyter MCP-server probes.
        requires_shared: [nvidia-gpu]
check-cachyos-ollama-pod:
    pod:
        image: ollama
        disposable: true
        lifecycle: dev
        requires_shared: [nvidia-gpu]
        description: >-
            Sole proof the CachyOS GPU ollama LLM-server image composes and serves on the Arch CUDA base, that the packaged CUDA backend is present, that the compiled-in command:ollama plugin works end-to-end, AND that real inference runs on the passed-through NVIDIA GPU. Builds and deploys the ollama pod and runs the checks baked into the ollama, ollama-cuda and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the CUDA backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port — plus the bed's own GPU-inference plan: nvidia-smi enumerates the card via CDI, a tiny model answers a prompt (a real generation pass), and `ollama ps` reports the model 100% GPU-resident (proving the CUDA backend executed it, not CPU fallback). The `requires_shared: [nvidia-gpu]` makes the arbiter flip the IOMMU group vfio→nvidia at deploy and back at teardown, so the pod reaches the card through CDI. On Arch the server comes from the split `ollama` package rather than the upstream tarball, so this bed is also the proof of that install path.
        plan:
            - check: the passed-through NVIDIA GPU is visible inside the container via CDI — nvidia-smi enumerates the card
              id: ollama-gpu-visible
              context:
                - runtime
              command: nvidia-smi -L
              stdout:
                - contains: "NVIDIA"
            - check: ollama runs a real generation pass — a tiny model answers a prompt (the first run pulls the model, hence the raised timeout)
              id: ollama-gpu-inference
              context:
                - runtime
              timeout: 5m
              exit_status: 0
              command: ollama run qwen2.5:0.5b "What is 2+2? Reply with just the number."
            - check: the model is resident on the GPU — ollama ps reports 100% GPU in the processor column, proving the CUDA backend executed the generation rather than CPU fallback
              id: ollama-gpu-resident
              context:
                - runtime
              command: ollama ps
              stdout:
                - contains: "100% GPU"
# check-cachyos-ollama-rocm-pod — the AMD sibling of check-cachyos-ollama-pod, and
# the sole consumer that proves candy/ollama-rocm. Plain cachyos base (no NVIDIA),
# so it also proves the base ollama candy composes without any GPU candy at all.
# SCOPE BOUNDARY, stated so nobody reads more into a green run than it earns: on a
# host with no AMD card this proves composition, that the ROCm backend library
# actually ships, and that the server reaches steady state — NOT that inference
# runs on an AMD GPU. Live GPU enumeration needs a real card passed through, the
# same limit candy/rocm states for itself. Ollama falls back to CPU here, which is
# why every inherited runtime check still passes.
check-cachyos-ollama-rocm-pod:
    pod:
        image: ollama-rocm
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS AMD ollama image composes on the plain CachyOS base and serves, and the sole consumer proving the ollama-rocm backend candy. Builds and deploys the ollama-rocm pod and runs the checks baked into the ollama, ollama-rocm and dbus candies — server HTTP/API liveness, binary/service/port/file probes, the ROCm/HIP backend library, and the host-side charly ollama help/version/list steps over the auto-allocated host port. Without an AMD card passed through the server runs CPU inference, so this bed proves the backend SHIPS, not that it executes on a GPU.
check-cachyos-comfyui-pod:
    pod:
        image: comfyui
        disposable: true
        lifecycle: dev
        description: Sole proof the CachyOS GPU comfyui image-generation server composes and serves on the Arch CUDA base. Builds and deploys the comfyui pod and runs the inherited comfyui + dbus baked checks — ComfyUI HTTP UI liveness plus service/port/file/command probes.
        requires_shared: [nvidia-gpu]
check-cachyos-unsloth-studio-pod:
