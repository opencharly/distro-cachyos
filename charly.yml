        disposable: true
        lifecycle: dev
        description: Sole build+runtime witness for box:openclaw — the MINIMAL openclaw composition (agent-forwarding + openclaw + dbus); NOT redundant with check-openclaw-full-pod because the dbus candy is composed ONLY here, never in the 27-candy box:openclaw-full meta. Builds (npm) and deploys the minimal openclaw pod on the CachyOS (Arch) base, exercising the cachyos→arch-builder npm build of the openclaw package plus the dbus/charly/socat/supervisord layer stack, and runs the inherited agent-forwarding + openclaw + dbus baked checks — the gateway CLI binary under ~/.npm-global/bin, the supervised service, and the openclaw :18789 TCP reachability.
# check-openclaw-full-pod deploys the maximal headless openclaw-full on the
# CachyOS (Arch) base — a non-browser gateway (no chrome/chrome-cdp). Exercises
# the tool stack incl. gogcli@latest (Arch go 1.26.x) and the ffmpeg/sqlite
# Arch package coverage. The check: block asserts those migration-critical
# artifacts are present on the running container.
check-openclaw-full-pod:
    pod:
        image: openclaw-full
        disposable: true
        lifecycle: dev
        description: Sole proof the maximal headless openclaw-full non-browser gateway + tool stack (gogcli@latest go-install on Arch go 1.26.x, ffmpeg/sqlite) composes and runs on the CachyOS (Arch) base. Builds (npm + go install multistage) and deploys the openclaw-full pod, then runs the inherited agent-forwarding + openclaw-full baked checks asserting gogcli, ffmpeg, sqlite, and the gateway/tool stack present.
# check-openclaw-desktop-pod deploys the all-in-one openclaw-desktop image on
# the CachyOS (Arch) base — the selkies streaming desktop fused with the
# openclaw-full gateway/tool stack (claude-code/codex/gemini), a CPU ollama,
# and the full nested charly toolchain (charly + container-nesting + golang + gh).
# Ports are remapped into a free 340xx block to coexist with the
# selkies/openclaw beds. The image-level check (baked) carries the nested-
# rootless posture + nested-podman + libvirt-session + charly version/doctor +
# the three services' liveness; this bed's deploy-scope probes assert the
# cross-stack headline artifacts (AUR chrome, selkies HTTPS UI, the AI CLIs,
# the ollama binary) actually landed on the running combined container.
check-openclaw-desktop-pod:
    pod:
        image: openclaw-desktop
        disposable: true
        lifecycle: dev
        description: Sole proof of the all-in-one openclaw-desktop image fusing the selkies streaming desktop + openclaw-full gateway/AI-CLI stack + CPU ollama + full nested charly toolchain on one CachyOS image. Builds (AUR chrome + npm openclaw + go multistage, plus the packaged CPU ollama) and deploys the openclaw-desktop pod, then runs baked checks (nested-rootless posture, nested podman, libvirt-session, charly version/doctor, three services) plus deploy-scope probes — AUR chrome, the selkies HTTPS UI, the AI CLIs (claude-code/codex/gemini), the ollama binary, chrome-devtools-mcp.
# check-crabbox-pod — the minimal Crabbox CLI composition (agent-forwarding +
# layer-crabbox + plugin-crabbox) on the CachyOS base. Runs the `crabbox:` check
# verb's credential-free surface in-venue (version/providers/config/doctor with
# NO coordinator configured) plus the binary presence probe. The full-local loop
# (coordinator + broker-backed verbs + rootless-podman leases) is check-crabbox-e2e-pod.
check-crabbox-pod:
    pod:
        image: crabbox
        disposable: true
        lifecycle: dev
        description: >-
            Sole build+runtime witness for box:crabbox — the minimal Crabbox CLI
            composition (agent-forwarding + layer-crabbox + plugin-crabbox) on
            the CachyOS base. Deploys the CLI pod and runs the `crabbox:` check
            verb's credential-free surface IN-VENUE with NO coordinator
            configured: version (in-venue CLI, probe-verified exit 0),
            providers (credential-free matrix), config show (read-only), doctor
            (no-broker exit 0 — the provider-selection warning is
            informational). Binary presence is asserted directly.
        plan:
            - check: the crabbox CLI binary is present at /usr/local/bin/crabbox in the running pod
              id: cbx-cli-binary
              context:
                - runtime
              file:
                file: /usr/local/bin/crabbox
                exists: true
            - check: the crabbox verb reports the pinned 0.48.1 CLI version (in-venue CLI method)
              id: cbx-verb-version
              crabbox:
                method: version
              stdout:
                - contains: "0.48.1"
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
            - check: crabbox providers lists the credential-free local provider matrix
              id: cbx-verb-providers
              crabbox:
                method: providers
              stdout:
                - contains: "local-container"
              context:
                - runtime
            - check: crabbox config show runs read-only in the venue
              id: cbx-verb-config
              crabbox:
                method: config
              exit_status: 0
              context:
                - runtime
            - check: crabbox doctor passes with no broker configured (fresh venue)
              id: cbx-verb-doctor
              crabbox:
                method: doctor
              exit_status: 0
              stdout:
                - contains: "ok"
              context:
                - runtime

# check-crabbox-e2e-pod — the flagship: the FULL LOCAL Crabbox control plane on
# one CachyOS pod — CLI + Node/PostgreSQL coordinator + postgres + nested
# rootless podman (container-nesting). Proves the crabbox: verb host probes
# (/v1/health,/v1/ready), shared-token login, broker-backed method classes, and
# the FULL local loop: crabbox run --provider local-container leasing a nested
# rootless podman container with stdout asserted and the lease released — the
# authoritative nested-port-publish assertion (fallback matrix pre-loaded in the
# plan: localContainer.network host / podman socket). Stretch steps exercise the
# local capability surface (checkpoint/artifacts/desktop proof/pond), each
# documented with per-step verdicts.
check-crabbox-e2e-pod:
    pod:
        image: crabbox-e2e
        disposable: true
        lifecycle: dev
        network: host
        env:
            POSTGRES_DB: crabbox
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: crabbox-dev-token-0
            CRABBOX_SHARED_TOKEN: crabbox-dev-token-0
            CRABBOX_SHARED_OWNER: crabbox@local
            CRABBOX_PUBLIC_URL: http://127.0.0.1:8080
            CRABBOX_PROVIDER: local-container
        description: >-
            The flagship disposable bed: the complete LOCAL Crabbox control
            plane on one CachyOS pod — the crabbox CLI + the Node/PostgreSQL
            coordinator (supervised, postgres-backed) + nested rootless podman.
            (1) Coordinator liveness/readiness via the `crabbox:` verb host
            probes (health/ready on :8080); (2) shared-token login into the
            local broker; (3) broker-backed verb methods after login
            (doctor-after-ready, usage, leases); (4) THE FULL LOCAL LOOP:
            `crabbox run --provider local-container` leases a nested rootless
            podman container in-venue (loopback SSH publish), syncs a scratch
            git workdir, runs, streams, and releases — stdout asserted. Stretch
            steps exercise the local capability surface: checkpoint
            (workspace-archive), artifacts collect, desktop/browser proof,
            pond peers — each individually documented. Zero cloud credentials;
            everything is local (shared-token auth).
        plan:
            - check: coordinator /v1/health responds 200 (host-side http verb — host-networking publishes no port mapping; the coordinator binds host-localhost :8080)
              id: cbx-e2e-health
              http:
                http: http://127.0.0.1:8080/v1/health
                status: 200
              eventually: 120s
              retry_interval: 5s
              context:
                - runtime
            - check: coordinator /v1/ready responds 200 (host-side http verb)
              id: cbx-e2e-ready
              http:
                http: http://127.0.0.1:8080/v1/ready
                status: 200
              context:
                - runtime
            - check: log the CLI into the local broker with the shared token (mutating setup under verify-only; truth = the broker-backed checks below)
              id: cbx-e2e-login
              exit_status: 0
              context:
                - runtime
              command: printf '%s' "$CRABBOX_SHARED_TOKEN" | crabbox login --url http://127.0.0.1:8080 --token-stdin || true
            - check: crabbox doctor passes once the coordinator is reachable (incl. its coord check)
              id: cbx-e2e-doctor
              crabbox:
                method: doctor
              exit_status: 0
              stdout:
                - contains: "ok"
              context:
                - runtime
            - check: broker-backed usage reports through the verb (login held)
              id: cbx-e2e-usage
              crabbox:
                method: usage
              exit_status: 0
              context:
                - runtime
            - check: broker-backed leases lists through the verb (empty lease set is fine)
              id: cbx-e2e-leases
              crabbox:
                method: leases
              exit_status: 0
              context:
                - runtime
            - check: THE FULL LOCAL LOOP — scratch git workdir, lease a nested rootless podman container, sync, run, stream, release (check-form so it executes under verify-only; the stdout assertion is the loop verdict)
              id: cbx-e2e-loop
              exit_status: 0
              stdout:
                - contains: "crabbox-local-ok"
              context:
                - runtime
              command: |
                set -e
                mkdir -p /tmp/cbxw && cd /tmp/cbxw
                [ -d .git ] || git init -q
                printf 'probe\n' > probe.txt
                git add -A 2>/dev/null || true
                git -c user.name=probe -c user.email=probe@local commit -qm init 2>/dev/null || true
                crabbox run --provider local-container --ttl 15m --idle-timeout 5m -- printf 'crabbox-local-ok'
            - check: stretch — workspace-archive checkpoint lifecycle on a kept local-container lease
              id: cbx-e2e-stretch-checkpoint
              exit_status: 0
              context:
                - runtime
              command: |
                set -e
                cd /tmp/cbxw
                crabbox warmup --provider local-container --keep --slug checkpoint-probe --ttl 15m --idle-timeout 5m
                crabbox checkpoint create --name cbx-probe --provider local-container
                crabbox checkpoint list
                crabbox stop checkpoint-probe
            - check: stretch — retained run-session handle (documented 0.48 lease-output surface + cleanup)
              id: cbx-e2e-stretch-artifacts
              exit_status: 0
              context:
                - runtime
              command: |
                set -e
                cd /tmp/cbxw
                crabbox run --provider local-container --keep --no-sync --ttl 15m --idle-timeout 5m --lease-output session.json -- true
                test -s session.json && grep -q cleanupCommand session.json && echo ARTIFACTS_LEASE_OK
                crabbox cleanup --provider local-container >/dev/null 2>&1 || true
            - check: stretch — desktop+browser capability lease proof (in-lease XFCE+Xvfb+noVNC bootstrap)
              id: cbx-e2e-stretch-desktop
              exit_status: 0
              context:
                - runtime
              command: |
                set -e
                cd /tmp/cbxw
                crabbox run --provider local-container --desktop --browser --ttl 20m --idle-timeout 10m -- sh -c 'test -x /usr/bin/xfce4-session || true'
            - check: stretch — pond peer group (two leases sharing a --pond label + peers)
              id: cbx-e2e-stretch-pond
              exit_status: 0
              context:
                - runtime
              command: |
                set -e
                cd /tmp/cbxw
                crabbox warmup --provider local-container --pond smoke --slug pond-a --ttl 15m --idle-timeout 5m
                crabbox pond peers --pond smoke
                crabbox stop pond-a

# charly-cachyos — the operator CachyOS workstation profile (target: local +
# host: local). It mutates the operator's REAL MACHINE — it installs packages as
# root and may change repo config — so it is an operator profile, NEVER a test bed.
#
# It carries NO `disposable:` flag, and must not regain one. `disposable: true` is
# not merely "unattended destroy is authorized": it is the SOLE definition of a
# check bed (a check bed IS a deploy marked `disposable: true`; there is no separate
# `check:` block — /charly-check:check). So the flag makes an entity a roster bed by
# construction: `/verify-beds` discovers every `disposable: true` entity and runs
# `charly check run` on it. With the flag present, a routine R10 roster provisioned
# this workstation unattended — 697s of `deploy-add` installing gstreamer, pipewire,
# gtk4, ghostty and more as root, until it died in the chrome AUR builder.
#
# Consequence, accepted deliberately: `charly update charly-cachyos` is no longer an
# unattended destroy+rebuild. It is a hard-to-reverse action on a non-disposable
# resource and requires operator confirmation, like every other such resource.
# Shares the name `charly-cachyos` with the kind:local template it applies
# (cross-kind name reuse).
charly-cachyos:
    local:
        from: charly-cachyos-app
        host: local
        description: Apply charly-cachyos to this workstation
        install_opts:
            with_service: true
            allow_repo_changes: true
            allow_root_tasks: true
        env:
            EDITOR: nvim
# cachyos-gpu — the PERSISTENT operator GPU workstation VM (target: vm,
# vm: cachyos-gpu). The VM analog of the charly-cachyos local profile, evolved
# into a full graphical <distro>-coder workstation: the full charly-cachyos dev
# stack PLUS a complete KDE Plasma desktop synced to the host, provisioned
# ONCE over SSH into the GPU-passthrough VM (persisted on the guest disk,
# survives the autostart reboot), plus the VM-only layers — nvidia-driver
# (kernel module + KDE/Wayland userspace + reboot), qemu-guest-agent (full
# RPC surface), workspace-mount (/workspace), and kde-selkies (remote WebRTC
# KDE stream, NVENC). Supersedes the earlier headless charly-cachyos-gpu.
#
# NOT disposable: this is a real workstation, not a rebuildable test bed. The
# full machinery is R10-proven on the disposable check-cachyos-gpu-vm bed;
# this entry just composes it. builder_image is the cuda-arch-builder so the
# cross-host pixi build of pixelflux links the real NVENC encoder.
#
# The @github layer pins are aligned to the newest main tag by
# `charly box reconcile` (the new main-repo desktop/stream layers — kde-desktop,
# fonts-extended, desktop-media, cachyos-extras, kde-selkies — resolve only at
