            DevOps/container tooling (docker, kubectl, helm, AWS CLI, jq).
            Targets the operator's CachyOS host via direct local exec.
        candy:
            - wheel-nopasswd
            - '@github.com/opencharly/layer-yay:v2026.272.0425'
            - '@github.com/opencharly/layer-dev-tools:v2026.272.0100'
            - '@github.com/opencharly/layer-gh:v2026.272.0136'
            - '@github.com/opencharly/layer-pre-commit:v2026.274.0641'
            - '@github.com/opencharly/layer-tmux:v2026.272.0425'
            - '@github.com/opencharly/layer-direnv:v2026.272.0057'
            - '@github.com/opencharly/layer-gnupg:v2026.272.0138'
            - '@github.com/opencharly/layer-keepassxc:v2026.272.0232'
