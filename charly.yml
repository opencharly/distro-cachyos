check-cstream-gpu-vm:
    # HOST REQUIREMENT, inherited from cachyos-gpu-vm: the bootstrap disk build needs
    # ~100 GiB of free space where charly builds it -- `<project>/output/qcow2/` AND
    # `$TMPDIR/charly-priv-N`. Both default to /tmp; on a host whose /tmp is a tmpfs
    # (this one: 62G) BOTH must be redirected with TMPDIR + CHARLY_VM_STATE_DIR or the
    # build dies with 'insufficient free space'.
    vm:
        from: cachyos-gpu-vm
        disposable: true
        lifecycle: dev
        description: >-
            The GPU venue for cstream. Increment 1: it establishes that the card is really passed through and MEASURES the VA capability inventory, which is the premise every later encoder claim depends on. It deliberately does not yet gate encoder selection -- see the plan note in the checks below.
        # Auto-allocated hostdev: the token maps to a vendor selector (0x10de) and
        # charly writes THIS host's whole-IOMMU-group <hostdev> block, so no
        # host-specific PCI address is committed. Without a matching card the bed
        # SKIPS rather than fails, which is what makes it safe in CI.
        requires_exclusive: [nvidia-gpu]
        add_candy:
            - '@github.com/opencharly/pod-qemu-guest-agent:v2026.239.1632'
            - nvidia-driver
            - cstream-gpu-va-tooling
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true
        plan:
            - check: the passed-through NVIDIA card is visible to the guest
              id: cstream-gpu-passthrough
              context:
                - runtime
              exit_status: 0
              command: |
                # The whole venue rests on this. If the hostdev did not attach, every
                # check below would report something true about a GPU-less guest.
                lspci -nn 2>/dev/null | grep -qi "10de:" || {
                    echo "GPU-NOT-PASSED-THROUGH: no 0x10de device in the guest" >&2
                    lspci -nn 2>/dev/null | head -20 >&2
                    exit 1; }
                echo GPU-PASSTHROUGH-OK
              stdout:
                - contains: GPU-PASSTHROUGH-OK
            - check: the guest render-node inventory, which encoder selection reads
              id: cstream-gpu-render-nodes
              context:
                - runtime
              exit_status: 0
              command: |
                # Reports the inventory rather than asserting a count: how many nodes a
                # VFIO guest exposes depends on whether virtio-gpu is also present, and
                # guessing that number is how a gate ends up asserting the host's shape
                # instead of the guest's.
                nodes=$(ls -1 /dev/dri/render* 2>/dev/null | tr '\n' ' ')
                test -n "$nodes" || {
                    echo "NO-RENDER-NODE: /dev/dri has no render* -- encoder selection has nothing to pick from" >&2
                    ls -la /dev/dri 2>&1 | head -10 >&2
                    exit 1; }
                echo "RENDER-NODES: $nodes"
                echo RENDER-NODE-INVENTORY-OK
              stdout:
                - contains: RENDER-NODE-INVENTORY-OK
            - check: no render node offers VA H.264 EncSlice -- the plan's premise, asserted
              id: cstream-gpu-va-encslice
              context:
                - runtime
              exit_status: 0
              command: |
                # THE measurement this bed exists for -- now an ASSERTION, not a report.
                #
                # The first version printed one marker in EVERY branch, including the
                # branch where vainfo was missing, so it passed having determined
                # nothing. And charly retains only the PASS line for a passing check,
                # so the inventory it "recorded" was unreadable afterwards. Both halves
                # are fixed here: the cstream-gpu-va-tooling fixture supplies vainfo,
                # and the finding is asserted. A check that gathers information it
                # cannot surface is not a measurement.
                #
                # The plan states "a passed-through 4080 has no VA EncSlice" and builds
                # three encoder claims on it -- `encode: va` must fail loudly on this
                # venue, `encode: auto` must land on software. Asserting it here is what
                # stops that premise from silently ceasing to be true.
                command -v vainfo >/dev/null 2>&1 || {
                    echo "VA-TOOLING-ABSENT: vainfo missing -- the cstream-gpu-va-tooling fixture did not land, so this bed cannot answer the question it exists to ask" >&2
                    exit 1; }
                probed=0
                offenders=""
                for n in /dev/dri/render*; do
                    test -e "$n" || continue
                    probed=$((probed + 1))
                    out=$(vainfo --display drm --device "$n" 2>&1 || true)
                    printf '%s\n' "$out" | grep -qE "VAProfileH264.*VAEntrypointEncSlice" && offenders="$offenders $n"
                done
                test "$probed" -gt 0 || {
                    echo "NO-RENDER-NODE-PROBED: nothing under /dev/dri/render* -- see cstream-gpu-render-nodes" >&2
                    exit 1; }
                if [ -n "$offenders" ]; then
                    echo "VA-ENCSLICE-PRESENT on:$offenders" >&2
                    echo "The PREMISE HAS CHANGED -- this is NOT a cstream regression. The guest" >&2
                    echo "now offers a VA H.264 encode entrypoint the plan assumed absent, so the" >&2
                    echo "encoder gates must be re-decided before this check is relaxed." >&2
                    for n in $offenders; do
                        echo "--- $n ---" >&2
                        vainfo --display drm --device "$n" 2>&1 | grep -E "VAProfile|Driver version" >&2
                    done
                    exit 1
                fi
                echo "NO-VA-H264-ENCSLICE across $probed render node(s) -- the premise holds"
              stdout:
                - contains: NO-VA-H264-ENCSLICE
check-cstream-vm:
    vm:
        from: cstream-vm
        disposable: true
        lifecycle: dev
        description: >-
            The SYSTEMD venue for cstream. Gates what check-cstream-pod structurally cannot: the daemons render as real systemd units rather than supervisord [program:] entries, the session target loads, and the nested compositor is installed session-scoped instead of being started at boot. logind sessions, linger and cross-user PAM are what this venue EXISTS to make gateable, but they are not asserted here yet -- they need the broker serving and two provisioned accounts, and a description may only claim what its plan actually checks.
        add_candy:
            - '@github.com/opencharly/layer-cstream-desktop:v2026.243.1831'
            # BED FIXTURE: the second account. Cross-user PAM is the reason this
            # venue exists, and it needs an account that is NOT the deploy user.
            - cstream-vm-probe-account
        install_opts:
            # The candy provisions system accounts, a PAM stack and systemd units.
            allow_root_tasks: true
        plan:
            - check: systemd is the running init, so the unit path is the one under test
              id: cstream-vm-systemd
              context:
                - runtime
              exit_status: 0
              command: |
                test -d /run/systemd/system && echo SYSTEMD-OK
              stdout:
                - contains: SYSTEMD-OK
            - check: the cstream daemons rendered as REAL systemd units, not supervisord programs
              id: cstream-vm-units-rendered
              context:
                - runtime
              exit_status: 0
              command: |
                # The whole point of the two-venue split: the SAME `service:` list
                # must render as units here and as [program:] entries in the pod.
                # A supervisord container cannot make this assertion at all.
                # charly names a rendered unit charly-<candy>-<service>.service --
                # NOT the bare service name. Asserting the bare name would fail
                # against a correctly-rendered unit, so the prefix is part of the
                # claim: this is charly's systemd naming convention under test.
                miss=""
                for u in charly-cstream-cstream-parent charly-cstream-cstream-gateway; do
                    systemctl list-unit-files 2>/dev/null | grep -q "^$u.service" || miss="$miss $u"
                done
                [ -z "$miss" ] || { echo "UNITS-MISSING:$miss" >&2; exit 1; }
                echo UNITS-RENDERED
              stdout:
                - contains: UNITS-RENDERED
            - check: the session target itself is a real, loadable systemd unit
              id: cstream-vm-session-target-installed
              context:
                - runtime
              exit_status: 0
              command: |
                # The target the compositor is scoped to. Asserting the file exists
                # is not enough -- a .target with a syntax error still exists on
                # disk while systemd refuses to load it, and the compositor's
                # WantedBy would then point at nothing. `systemctl show` forces the
                # load, so LoadState=loaded is the claim that actually discriminates.
                T=/etc/systemd/system/cstream-session.target
                test -f "$T" || { echo "TARGET-NOT-STAGED: the unit: step did not install it" >&2; exit 1; }
                ls=$(systemctl show -p LoadState --value cstream-session.target 2>/dev/null)
                [ "$ls" = "loaded" ] || { echo "TARGET-NOT-LOADABLE: LoadState=$ls" >&2; systemctl status cstream-session.target >&2 2>&1 | head -5; exit 1; }
                # and it must NOT pull itself in at boot, or it re-creates the
                # deploy-time start one level up
                if systemctl is-enabled cstream-session.target 2>/dev/null | grep -q '^enabled$'; then
                    echo "TARGET-WRONGLY-ENABLED-AT-BOOT: it must be pulled in by a session, not by boot" >&2; exit 1
                fi
                echo SESSION-TARGET-LOADED
              stdout:
                - contains: SESSION-TARGET-LOADED
            - check: the compositor unit is INSTALLED but session-scoped, not started at boot
              id: cstream-vm-compositor-session-scoped
              context:
                - runtime
              exit_status: 0
              command: |
                # The WP9b claim, gated on the only venue that can express it.
                # A nested compositor has no business in multi-user.target: it needs
                # a parent Wayland display that does not exist at deploy time, and
                # charly STARTS what it enables. So the unit must be rendered (the
                # candy still declares the service) and must NOT be enabled into
                # multi-user.target, with [Install] naming the session target instead.
                U=/etc/systemd/system/charly-hyprland-cstream-hyprland.service
                test -f "$U" || { echo "UNIT-NOT-RENDERED: charly did not write the compositor unit" >&2; exit 1; }
                if [ -e /etc/systemd/system/multi-user.target.wants/charly-hyprland-cstream-hyprland.service ]; then
                    echo "WRONGLY-ENABLED-INTO-multi-user.target: enable: false did not take" >&2; exit 1
                fi
                grep -q "^WantedBy=cstream-session.target" "$U" || {
                    echo "INSTALL-SECTION-WRONG: [Install] does not name cstream-session.target" >&2; sed -n "/\[Install\]/,$ p" "$U" >&2; exit 1; }
                echo COMPOSITOR-SESSION-SCOPED
              stdout:
                - contains: COMPOSITOR-SESSION-SCOPED
            - check: the PAM stack and session leader the login path needs are installed
              id: cstream-vm-login-path-present
              context:
                - runtime
              exit_status: 0
              command: |
                miss=""
                for f in /usr/local/bin/cstream-leader /usr/local/bin/cstream-login-probe /etc/pam.d/cstream; do
                    test -e "$f" || miss="$miss $f"
                done
                [ -z "$miss" ] || { echo "LOGIN-PATH-MISSING:$miss" >&2; exit 1; }
                echo LOGIN-PATH-PRESENT
              stdout:
                - contains: LOGIN-PATH-PRESENT
            - check: PAM authenticates a DIFFERENT account than the caller — the claim the pod venue structurally cannot make
              id: cstream-vm-pam-cross-user-accept
              context:
                - runtime
              exit_status: 0
              command: |
                # The guard IS the claim. In a rootless pod pam_unix delegates to
                # unix_chkpwd, which only verifies the CALLING user's own account --
                # so an accept leg that happened to target the caller would pass
                # there too and would prove nothing about cross-user auth. Assert
                # the target is somebody else BEFORE authenticating.
                me=$(id -un)
                [ "$me" != cstreamprobe ] || { echo "NOT-CROSS-USER: running as the target account ($me)" >&2; exit 1; }
                sudo -n /usr/local/bin/cstream-login-probe cstreamprobe accept 'cstream-vm-probe-pw'
              stdout:
                - contains: LOGIN-ACCEPTED
            - check: a WRONG password for that same other account is REFUSED
              id: cstream-vm-pam-cross-user-reject
              context:
                - runtime
              exit_status: 0
              command: |
                # Without this leg the accept leg is vacuous: a PAM stack that
                # admits anything passes it. Same account, same caller, wrong
                # credential -- the only variable is the password.
                sudo -n /usr/local/bin/cstream-login-probe cstreamprobe reject 'cstream-vm-probe-pw-WRONG'
              stdout:
                - contains: LOGIN-REJECTED
            - check: the streamer binary installed on the systemd venue too
              id: cstream-vm-streamer-installed
              context:
                - runtime
              file:
                file: /usr/local/bin/cstream-streamer
                exists: true
cstream-vm:
    vm:
        # The SYSTEMD venue for cstream. It exists to carry the claims the pod bed
        # structurally CANNOT make:
        #
        #   * the cstream daemons render as REAL systemd units rather than
        #     supervisord [program:] entries. One `service:` list, two renderings;
        #     only this venue exercises the systemd one.
        #   * CROSS-USER PAM -- the reason this entity exists, and still ungated
        #     (see the bed's description). In a rootless pod `pam_unix` delegates to the setuid
        #     helper `unix_chkpwd`, which verifies only the CALLING user's own
        #     account -- measured: uid 1000 asking about another account fails for
        #     a RIGHT password exactly as it does for a wrong one, so a reject leg
        #     there proves nothing. That is why the pod bed authenticates only the
        #     account it runs as, and why cross-user auth is this bed's gate.
        #   * logind sessions, linger, and per-user `user@UID.service` trees.
        #
        # A FULL spec, not a derivation: VM entities do not inherit (`from:` is
        # bed-only), so this mirrors cachyos-vm's pacstrap bootstrap and raises
        # only what the desktop needs -- the guest compiles a Rust streamer and
        # runs a nested compositor, neither of which fits 2 CPU / 4G.
        source:
            kind: bootstrap
            builder: pacstrap
            builder_image: cachyos-pacstrap-builder
            distro: cachyos
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
                # btrfs-progs supplies fsck.btrfs. Without a helper for the root
                # filesystem mkinitcpio warns "No fsck helpers found", and its
                # warnings escalate to "errors were encountered during the build"
                # -> `error: command failed to execute correctly`, which trips
                # charly's log-diagnostic gate on EVERY package install that fires
                # the initcpio hook. Fixing the cause rather than allowlisting the
                # line, per the arch bootstrap block's own precedent.
                - btrfs-progs
            rootfs: btrfs
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: cachy
            port_auto: true
            key_source: generate
        libvirt:
            devices:
                # accel3d is load-bearing, not decoration: gst-wayland-display
                # creates the zwp_linux_dmabuf_v1 global ONLY on a hardware render
                # target, and Aquamarine's Wayland backend hard-requires it. Without
                # a real render node the nested Hyprland cannot start at all -- the
                # same rule the pod bed satisfies with the host's iGPU render node.
                # accel3d makes the renderer emit virtio-vga-gl, which REQUIRES a
                # GL-capable display backend. With the default headless display
                # qemu refuses to start: "The display backend does not have OpenGL
                # support enabled" -- measured, a 7-second vm-create failure.
                # egl-headless is that backend, and charly already emits
                # <gl rendernode=.../> for it (the plan's Spike 3 configuration).
                graphics:
                    - type: egl-headless
                video:
                    - model: virtio
                      accel3d: true
                      # NO cloud_init: block -- it would be INERT here, and that is measured,
                      # not assumed. cloud-init seeding is a `kind: cloud_image` feature
                      # (plugin-vm/vm_cloud_image.go). For this `kind: bootstrap` guest charly
                      # BUILDS output/qcow2/cstream-vm/seed.iso and then never attaches it:
                      # `virsh dumpxml` shows no <disk device='cdrom'> at all, and the guest
                      # reports `cloud-init status: error / No instance datasource found`,
                      # with /var/lib/cloud/instance/scripts/runcmd absent entirely.
                      #
                      # A pacstrapped guest is configured in the CHROOT instead -- charly's
                      # arch bootstrap already runs `arch-chroot systemctl enable sshd
                      # qemu-guest-agent cloud-init-*`. That is the only reason ssh works
                      # here, and it is exactly what makes an inert runcmd list look like it
                      # works: the two lines everyone copies are already done by the chroot.
                      #
                      # Confirmed NOT caused by this entity's `libvirt:` block -- removing
                      # that and re-creating the domain still yields zero cdrom devices.
cachyos-vm:
    vm:
        # Bootstrap-from-scratch via cachyos-pacstrap-builder (local). The cachyos
        # distro config (pacstrap base packages, keyring, mirrors, repos) lives in
        # the embedded build vocabulary (`charly/charly.yml`).
        source:
            kind: bootstrap
            builder: pacstrap
            builder_image: cachyos-pacstrap-builder
            distro: cachyos
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
                # tmux + asciinema: the record: session capture verb (plugin-record)
                # requires tmux AND asciinema on the target. The instrument bed's
                # add_candy (layer-tmux + layer-asciinema) does NOT land in the guest
                # for a CLONE bed (no image rebuild — the clone uses the golden's
                # disk), so both must be baked into the base image the golden is
                # captured from.
                - tmux
                - asciinema
                # btrfs-progs supplies fsck.btrfs for the btrfs rootfs below.
                # Without a helper mkinitcpio warns "No fsck helpers found", and
                # its warnings escalate to "errors were encountered during the
                # build" -> `error: command failed to execute correctly`, which
                # trips charly's log-diagnostic gate on EVERY package install that
                # fires the initcpio hook. Measured on check-cstream-gpu-vm: the
                # deploy exits 0 and the gate fails the step on the error line.
                #
                # The charly#400 allowlist covers the BUILD-phase chroot noise
                # only; the deploy occurrence is not allowlistable, and should not
                # be -- the cause is a missing package. Same fix as cstream-vm.
                - btrfs-progs
            rootfs: btrfs
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 25G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
            # The charly MCP server's port, host-forwarded on a FIXED port so the
            # host-side mcp: check verb (substrate-neutral resolution, P4) can dial
            # it: the mcp_provide URL (127.0.0.1:18765/mcp) is dialed from the host
            # as-is, and the fixed 18765:18765 forward makes the host's 18765 reach
            # the guest server. The SHIPPED unit binds 127.0.0.1 (the P3 host
            # default, asserted by the bed's unit-file check); the charly-mcp-enable
            # candy writes a drop-in so the RUNNING server binds all interfaces — the
            # forward arrives on the guest's external interface. (An auto: forward
            # would need the unmerged check-env port threading; the fixed forward is
            # the merged-products design — normal inside a VM, the host system is the
            # security boundary.)
            port_forwards:
                - "18765:18765"
        # The MCP server this VM serves - the substrate-neutral mcp_provide
        # surface (P4): a kind:vm entity declares its MCP servers exactly like a
        # box does. The mcp: check verb resolves this declaration for VM/host
        # venues (no podman-inspectable OCI label on a VM).
        mcp_provide:
            - name: charly
              url: "http://127.0.0.1:18765/mcp"
              transport: http
              # Fixed-forward note: this URL's port (18765) is the FIXED host-forwarded
              # port declared above (18765:18765), so the host-side mcp: verb dials the
              # host loopback and reaches the guest server through the forward — no
              # runtime port substitution needed (plugin-mcp's fromEnv-loopback rule
              # dials host-local URLs as-is).
        ssh:
            user: cachy
            port_auto: true
            key_source: generate
        cloud_init:
            # The cachy account (sudo NOPASSWD + /bin/bash + ssh key + wheel) is
            # provisioned from ssh.user via the cloud-init create-pattern
            # (composeUsers), so no explicit users: block is needed here.
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
                # Disable nvidia-container-toolkit's install-time CDI-generate
                # alpm hook. On a VM the passed-through GPU's driver only loads
                # AFTER the nvidia-driver layer's reboot, so `nvidia-ctk cdi
                # generate` at toolkit-install time fails ("NVML: Driver Not
                # Loaded"), pacman exits non-zero, and the deploy aborts at the
                # nvidia layer. CDI is (re)generated post-reboot by the
                # nvidia-driver layer's charly-nvidia-cdi oneshot once the driver is
                # up. Symlinking a hook to /dev/null is pacman's canonical
                # "disable this hook". Runs at first boot, before any deploy.
                - sh -c 'mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/nvidia-ctk-cdi.hook'
        # The recording surface (the instrument beds' screen capture): the distro
        # root carries ONE canonical spice channel + graphics + video set, inherited
        # by every clone/deploy (R3 — no per-bed duplication).
        libvirt:
            devices:
                channels: [{type: unix, name: org.qemu.guest_agent.0}, {type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
cachyos-gpu-vm:
    vm:
        # GPU-passthrough VM guest that receives a physical NVIDIA GPU via a VFIO
        # <hostdev>. Driven by the check-cachyos-gpu-vm bed, which mirrors the
        # operator workstation: a bare-metal KDE Plasma seat in-guest plus a nested
        # selkies-kde-nvidia streaming pod (real NVENC) deployed as a persistent
        # in-guest quadlet.
        #
        # SUBSTRATE = CachyOS bootstrap (pacstrap) under UEFI/OVMF. UEFI is
        # MANDATORY for a modern GPU: the RTX 4080's 16 GB VRAM sits behind a
        # 64-bit large BAR that SeaBIOS cannot map, so under BIOS the guest nvidia
        # driver fails GSP boot ("bad register read 0xbadf…"). The Arch cloud image
        # can't boot under UEFI (stale BOOTX64.EFI; see /charly-vm:arch), so a fresh
        # pacstrap install with its own EFI bootloader is used — it boots the
        # passed-through GPU cleanly under OVMF. pacstrap needs the rootful builder
        # (`charly settings set engine.rootful sudo`).
        #
        # PORTABLE — this committed entity carries NO host-specific devices: no
        # `libvirt.devices.hostdevs:` (a PCI bus/slot address is host-specific) and
        # no host-path `filesystems:` (a virtiofs share rooted at an absolute host
        # path). The GPU hostdev is AUTO-ALLOCATED: the bed declares
        # `requires_exclusive: [nvidia-gpu]`, the embedded resource: vocabulary maps that
        # token to a `resource: {nvidia-gpu: {gpu: {vendor: "0x10de"}}}` selector, and
        # `charly vm create` (autoAllocateExclusiveGPUs) detects the matching NVIDIA
        # card, writes its whole-IOMMU-group `<hostdev>` block into THIS host's
        # instance overlay (~/.local/share/charly/vm/charly-cachyos-gpu-vm/
        # instance.yml), and injects it via VmInstanceOverride.ApplyToVmSpec — so the
        # bed attaches this host's real RTX 4080 (real GPU passthrough + NVENC) with
        # NO manual `charly vm gpu list` step and no PCI address in version control.
        # An operator-authored hostdev (committed here or in instance.yml) ALWAYS
        # wins — auto-allocation defers to it. If the resource is required but no
        # matching card is present, `charly vm create` FAILS HARD (operator directive:
        # auto-allocate or fail hard). The host-path `filesystems:` overlay (if any)
        # is still operator-authored in instance.yml. See /charly-vm:vm "GPU
        # passthrough", /charly-internals:disposable "resource-arbitration axis".
        #
        # backend: libvirt is mandatory — <hostdev> PCI passthrough only renders
        # on the libvirt backend. Rootless passthrough also needs a raised memlock
        # limit + /dev/vfio access — see `charly vm gpu status`.
        source:
            kind: bootstrap
            builder: pacstrap
            builder_image: cachyos-pacstrap-builder
            distro: cachyos
            package:
                # Bootstrap essentials ONLY — enough to boot + reach the guest
                # over SSH so layers apply. App packages arrive via add_layer.
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
                # btrfs-progs supplies fsck.btrfs for the btrfs rootfs below.
                # Without a helper mkinitcpio warns "No fsck helpers found", its
                # warnings escalate to "errors were encountered during the build"
                # -> `error: command failed to execute correctly`, and charly's
                # log-diagnostic gate then fails the step even though deploy-add
                # itself exits 0. Measured on check-cstream-gpu-vm.
                #
                # The charly#400 allowlist covers the BUILD-phase chroot occurrence
                # only; the deploy-phase one is not allowlistable and should not be
                # -- the cause is a missing package. Same fix as cstream-vm and
                # cachyos-vm.
                - btrfs-progs
            rootfs: btrfs
            # modprobe.blacklist=nouveau: blacklist the in-tree driver at early
            # boot so the open NVIDIA module binds the passed-through GPU (no
            # initramfs regen needed — see the nvidia-driver layer).
            kernel_args: console=tty0 console=ttyS0,115200 modprobe.blacklist=nouveau nvidia-drm.modeset=1
        backend: libvirt
        # 100G (sparse qcow2): the full KDE+GPU+dev rootfs PLUS the nested
        # selkies-kde-nvidia pod image (~15 GB) loaded into the guest user's
        # rootless podman storage (/home/cachy/.local/share/containers) — 50G
        # ran out of space mid-load. The disk grows on demand, so the larger
        # ceiling costs nothing until used.
        disk_size: 100G
        ram: 8G
        cpu: 4
        machine: q35
        firmware: uefi-insecure
        # Exercises the autostart code path (DomainSetAutostart + linger +
        # virtqemud.socket) on a disposable target — the bed is torn down, so
        # nothing persistently autostarts. This is the R10 vehicle for the
        # generic autostart machinery the cachyos-gpu operator VM relies on.
        autostart: true
        network:
            mode: user
        ssh:
            user: cachy
            port_auto: true
            key_source: generate
        cloud_init:
            # /etc/pacman.conf is written into the rootfs by the cachyos pacstrap
            # bootstrap (the embedded distro.cachyos.pacstrap.runtime_pacman_conf vocabulary) —
            # the single source for every cachyos pacstrap VM, so no per-VM
            # write_files block is needed here.
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
                # Disable nvidia-container-toolkit's install-time CDI-generate
                # alpm hook. On a VM the passed-through GPU's driver only loads
                # AFTER the nvidia-driver layer's reboot, so `nvidia-ctk cdi
                # generate` at toolkit-install time fails ("NVML: Driver Not
                # Loaded"), pacman exits non-zero, and the deploy aborts at the
                # nvidia layer. CDI is (re)generated post-reboot by the
                # nvidia-driver layer's charly-nvidia-cdi oneshot once the driver is
                # up. Symlinking a hook to /dev/null is pacman's canonical
                # "disable this hook". Runs at first boot, before any deploy.
                - sh -c 'mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/nvidia-ctk-cdi.hook'
        libvirt:
            # memfd/shared backing is auto-paired by the renderer for the virtiofs
            # share; declared here too so the bed asserts the explicit path works.
            memory_backing:
                source: memfd
                access: shared
            devices:
                # SPICE virtual monitor: the headless display the GPU-passthrough
                # KDE session renders to, so `charly check spice screenshot` captures the
                # live desktop (the bed asserts a non-uniform frame = it rendered).
                # The virtio-gpu head is the seat-0 primary scanout — the passed-
                # through NVIDIA GPU has no connected output.
                graphics:
                    - type: spice
                      listen:
                        - type: socket
                video:
                    - model: virtio
                      vram: 65536
                      heads: 1
                      accel3d: false
                      primary: true
                # Guest-agent control channel + the SPICE agent channel (spicevmc) —
                # exercises the structured unix channel render + qemu-guest-agent.
                channels:
                    - type: unix
                      name: org.qemu.guest_agent.0
                    - type: spicevmc
                      name: com.redhat.spice.0
                      # NO host-path `filesystems:` and NO `hostdevs:` committed here —
                      # both are host-specific and live in THIS host's instance overlay
                      # (~/.local/share/charly/vm/charly-cachyos-gpu-vm/instance.yml), merged at
                      # `charly vm create` by VmInstanceOverride.ApplyToVmSpec:
                      #   - the GPU <hostdev> (RTX 4080, IOMMU group = 01:00.0 + 01:00.1);
                      #   - a virtiofs `workspace` share rooted at an operator-provisioned
                      #     mode-0700 scratch dir (NOT world-writable /tmp) so the
                      #     guest-user idmap is actually exercised: the guest user owns +
                      #     writes it ONLY when the auto-injected idmap maps guest-uid-1000
                      #     → the host operator (libvirt's default maps guest-ROOT →
                      #     operator, leaving it root-owned + unreadable to the guest user).
cachyos-gpu-workstation-vm:
    vm:
        # PERSISTENT operator GPU workstation VM — the full charly-cachyos dev stack
        # PLUS a complete KDE Plasma desktop synced to the host, inside a
        # GPU-passthrough VM that auto-starts with the host. The VM analog of the
        # `charly-cachyos` local workstation profile, evolved into a full graphical
        # `<distro>-coder` workstation; provisioned once via the `cachyos-gpu`
        # kind:deploy (full layer stack over SSH, persisted on the guest disk),
        # then it just boots. Supersedes the earlier headless charly-cachyos-gpu.
        #
        # Two ways to use the SAME GPU: a physical monitor on the RTX 4080
        # (SDDM/Plasma on DRM), and a remote KDE-selkies WebRTC browser stream
        # (port 3000, NVENC) of a nested Plasma.
        #
        # PORTABLE (like local.charly-cachyos): this committed entity carries NO
        # host-specific config — the NVIDIA PCI <hostdev> and the operator's
        # /home/<operator> share both live in THIS host's instance overlay
        # (~/.local/share/charly/vm/charly-cachyos-gpu/instance.yml), merged at
        # `charly vm create` by VmInstanceOverride.ApplyToVmSpec. Generate the hostdev
        # block with `charly vm gpu list`. (Unlike the disposable bed, this
        # persistent workstation deploy declares no `requires_exclusive:` resource,
        # so its hostdev is operator-authored here — auto-allocation
        # (gpu_allocate.go) fires for a `requires_exclusive: [nvidia-gpu]` CLAIMANT
        # like the check-cachyos-gpu-vm bed; an operator-authored hostdev always
        # wins regardless.) NOT a disposable test bed — there is no disposable
        # deploy for it; the full machinery is R10-proven on the disposable
        # check-cachyos-gpu-vm bed instead.
        #
        # SUBSTRATE = CachyOS pacstrap under UEFI/OVMF (same rationale as
        # cachyos-gpu-vm: the RTX 4080's 64-bit large BAR needs UEFI). On this host
        # the passed-through card is vfio-pci-bound and the host drives display
        # from the AMD GPU, so autostarting this VM costs the host no display.
        source:
            kind: bootstrap
            builder: pacstrap
            builder_image: cachyos-pacstrap-builder
            distro: cachyos
            package:
                - sudo
                - openssh
                - qemu-guest-agent
                - cloud-init
                - grub
                - efibootmgr
            rootfs: btrfs
            kernel_args: console=tty0 console=ttyS0,115200 modprobe.blacklist=nouveau nvidia-drm.modeset=1
        backend: libvirt
        # 1 TB VIRTUAL — the qcow2 is sparse (truncate + qemu-img convert with no
        # preallocation), so it grows on demand and the operator's data lives on
        # the /workspace virtiofs share (host passthrough), not on this disk.
        disk_size: 1T
        ram: 64G
        cpu: 12
        machine: q35
        firmware: uefi-insecure
        # Start with the host. Sets libvirt's domain autostart flag AND wires the
        # qemu:///session boot trigger (loginctl enable-linger + virtqemud.socket).
        autostart: true
        network:
            mode: user
        ssh:
            user: cachy
            port_auto: true
            key_source: generate
        cloud_init:
            # /etc/pacman.conf is written into the rootfs by the cachyos pacstrap
            # bootstrap (the embedded distro.cachyos.pacstrap.runtime_pacman_conf vocabulary) —
            # the single source for every cachyos pacstrap VM. (A persistent
            # workstation can later harden SigLevel after pacman-key init.)
            runcmd:
                - systemctl enable --now sshd
                - systemctl enable --now qemu-guest-agent
                # Disable nvidia-container-toolkit's install-time CDI-generate
                # alpm hook. On a VM the passed-through GPU's driver only loads
                # AFTER the nvidia-driver layer's reboot, so `nvidia-ctk cdi
                # generate` at toolkit-install time fails ("NVML: Driver Not
                # Loaded"), pacman exits non-zero, and the deploy aborts at the
                # nvidia layer. CDI is (re)generated post-reboot by the
                # nvidia-driver layer's charly-nvidia-cdi oneshot once the driver is
                # up. Symlinking a hook to /dev/null is pacman's canonical
                # "disable this hook". Runs at first boot, before any deploy.
                - sh -c 'mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/nvidia-ctk-cdi.hook'
        libvirt:
            # memfd/shared is auto-paired for the virtiofs share by the renderer;
            # declared explicitly here for clarity on a persistent operator entity.
            memory_backing:
                source: memfd
                access: shared
            devices:
                # NO SPICE, no emulated display head. The passed-through RTX 4080
                # drives the operator's PHYSICAL monitors directly over DRM — the
                # KDE desktop lives there, and (via the ScreenCast-portal browser
                # mirror) is streamed to the browser as the SAME desktop. SPICE + a
                # virtio-gpu head are intentionally BED-ONLY: the portable check bed
                # (cachyos-gpu-vm) has no physical GPU, so it needs a virtual head to
                # screenshot. On this operator the GPU IS the display; early-boot
                # output is the serial console (console=ttyS0 in kernel_args above).
                # Dropping the virtio head also removes the spurious "Virtual-1"
                # output that otherwise becomes the Plasma primary at 0,0.
                video:
                    - model: none
                # qemu-guest-agent control channel (host↔guest). No spicevmc — the
                # operator runs no SPICE server.
                channels:
                    - type: unix
                      name: org.qemu.guest_agent.0
                      # NO host-path `filesystems:` and NO `hostdevs:` committed here —
                      # both are host-specific and live in THIS host's instance overlay
                      # (~/.local/share/charly/vm/charly-cachyos-gpu/instance.yml), merged at
                      # `charly vm create` by VmInstanceOverride.ApplyToVmSpec:
                      #   - the GPU <hostdev> (RTX 4080, IOMMU group = 01:00.0 + 01:00.1);
                      #   - the operator's home (/home/<operator>) shared into the guest at
                      #     /workspace via virtiofs passthrough (mounted by the
                      #     workspace-mount layer; passthrough preserves uid/gid).
# In-pod emulator device — the android-emulator image bakes the Android 16
# (API 36, google_apis_playstore x86_64) system image + the pixel_9a AVD;
# this device REFERENCES it (the API level / system image are build-time
# properties, not driven from here). apkeep runs in-pod; adb reaches the
# emulator via the pod. google_account names the credential-store secret
# keys the apkeep google-play source reads (an AAS token, NOT a password).
pixel9a-36:
    android:
        box: android-emulator
        device: pixel_9a
        api_level: 36
        google_account:
            email_secret: GOOGLE_ACCOUNT_EMAIL
            token_secret: GOOGLE_AAS_TOKEN
# Remote/physical device example — addresses an adb SERVER over the network
# (a host running `adb connect` to a phone, OR an emulator pod's published
# 5037). apkeep runs on the HOST and the APK is pushed via goadb to the
# endpoint; the host needs apkeep + android-tools (adb) for the `package:`
# download path (PKGBUILD optdepends). The `apk: <committed-file>` path
# needs neither (pure goadb push). The 127.0.0.1:35002 value here matches
# the check-android-emulator-pod bed's published ADB port — it lets the
# remote/endpoint code path be exercised against the bed's own emulator
# with no physical hardware.
pixel9a-endpoint:
    android:
        adb:
            # ${HOST_PORT:5037} resolves at deploy time to the PARENT emulator
            # pod's host-mapped adb-server port (container 5037), so the endpoint
            # follows the pod's published port instead of hard-coding it. Used
            # nested under check-android-emulator-pod (which publishes …:5037).
            host: 127.0.0.1:${HOST_PORT:5037}
        serial: emulator-5554
        device: pixel_9a
check-cstream-pod:
    pod:
        image: cstream-check
        disposable: true
        lifecycle: dev
        add_candy:
            # plugin-cstream serves the `cstream:` verb these steps authors. Nothing in this
            # bed's image closure requires it, so it rides in here and the host check runner
            # loads it — the same mechanism distro-arch uses for plugin-spice and
            # distro-omarchy for plugin-wl.
            #
            # It is also what makes the SCALAR shorthand (`cstream: status`) parse. That
            # desugars at PARSE time from the primary charly's prescan registers off a plugin
            # candy manifest's `plugin: primary:` block, and the prescan can only read a
            # manifest it can REACH — i.e. one pinned from a file it walks. Unpinned, this
            # bed parsed here (where its file is the root) and failed the moment charly
            # composed it as box/cachyos, with "declares no primary field for the scalar
            # shorthand". That took `charly box validate` on charly's main to exit 1.
            - '@github.com/opencharly/plugin-cstream/candy/plugin-cstream:v2026.242.1502'
        security:
            group_add:
                - keep-groups
        description: >-
            The WP9 pod bed for cstream. Proves the stack STREAMS rather than merely starts: frames pulled through the pipeline must change when a client window maps, and hardware H.264 must actually produce a stream.
        plan:
            - check: the Wayland parent service is running
              id: cstream-parent-service
              context:
                - runtime
              service:
                service: cstream-parent
            - check: the gateway service is running
              id: cstream-gateway-service
              context:
                - runtime
              service:
                service: cstream-gateway
            - check: the gateway reports ready only when a render node AND a compositor socket exist
              id: cstream-gateway-ready
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/healthz
                status: 200
                body:
                    - contains: '"ready":true'
              eventually: 120s
              retry_interval: 10s
            - check: the GWD pipeline carries LIVE compositor content (frames change when the desktop changes)
              id: cstream-stream-live
              context:
                - runtime
              command:
                command: /usr/local/bin/stream-probe
                in_container: true
              stdout:
                - contains: STREAM-CLIENT-MAPPED
                - contains: STREAM-LIVE-OK
              eventually: 600s
              retry_interval: 150s
            - check: hardware H.264 encode actually produces a stream (no silent CPU fallback)
              id: cstream-encoder-hardware
              context:
                - runtime
              command:
                command: /usr/local/bin/encoder-probe
                in_container: true
              stdout:
                - contains: ENCODER-VA-OK
              eventually: 300s
              retry_interval: 120s
            - check: a real PAM login through the session leader is ACCEPTED for a correct password
              id: cstream-login-accepted
              context:
                - runtime
              command:
                in_container: true
                command: /usr/local/bin/cstream-login-probe "$(id -un)" accept 'cstream-bed-pw'
              stdout:
                - contains: LOGIN-ACCEPTED
            - check: a WRONG password is REJECTED by the same stack that just accepted the right one
              id: cstream-login-rejected
              context:
                - runtime
              command:
                in_container: true
                command: /usr/local/bin/cstream-login-probe "$(id -un)" reject 'cstream-bed-pw-WRONG'
              stdout:
                - contains: LOGIN-REJECTED
            - check: the streamer builds its own graph, reaches PLAYING, and the VA encoder it picked actually OPENS
              id: cstream-streamer-graph
              context:
                - runtime
              command:
                in_container: true
                command: |
                    # --probe runs the SHIPPED binary: it builds the real
                    # waylanddisplaysrc-to-webrtcsink graph, brings it to PLAYING, and
                    # then opens the encoder it selected. `encode: va` is what makes this
                    # discriminating -- on a VA-capable node the streamer must report the
                    # hardware encoder and REFUSE rather than quietly use the CPU.
                    #
                    # The second marker exists because registration is not capability: a
                    # VA element is registered wherever the plugin loads, including on a
                    # host whose render node it cannot open. Only bringing it to READY
                    # tells those apart.
                    #
                    # NOT claimed here: that webrtcsink hands a frame to that encoder.
                    # Its encoder-setup fires only once a consumer negotiates, and this
                    # probe has no signalling server. Frames actually moving is the
                    # separate two-way streaming gate above.
                    CSTREAM_ENCODE=va CSTREAM_RENDER_NODE=/dev/dri/renderD128 \
                      timeout 60 /usr/local/bin/cstream-streamer --probe
              stdout:
                - contains: 'CSTREAM-PIPELINE-PLAYING encoder=hardware:vah264enc'
                - contains: 'CSTREAM-ENCODER-OPENABLE encoder=hardware:vah264enc'
              eventually: 180s
              retry_interval: 60s
            - check: a terminal is mapped for keyboard input to be delivered INTO
              id: wl-input-fixture
              context:
                - runtime
              command:
                in_container: true
                command: |
                    set -e
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    NEST=$(hyprctl -j instances | sed -n 's/.*"wl_socket"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    # A DEDICATED terminal: the focus/close fixtures' windows are
                    # targets of dispatchers that move or destroy them, and typing
                    # into one of those would race those gates.
                    pgrep -f "foot -T cstream-input" >/dev/null 2>&1 || \
                      (WAYLAND_DISPLAY=$NEST setsid foot -T cstream-input >/dev/null 2>&1 &)
                    for _ in $(seq 40); do
                        hyprctl -j clients | grep -q '"initialTitle": *"cstream-input"' && break
                        sleep 1
                    done
                    hyprctl -j clients | grep -q '"initialTitle": *"cstream-input"' || {
                        echo "INPUT-FIXTURE-NO-WINDOW: foot never mapped" >&2; exit 1; }
                    echo INPUT-FIXTURE-READY
              stdout:
                - contains: INPUT-FIXTURE-READY
              eventually: 120s
              retry_interval: 30s
            - check: the wl verb focuses the input terminal, so keystrokes have a destination
              id: wl-input-focus
              context:
                - runtime
              wl:
                method: focus
                target: initialtitle:cstream-input
            - check: the input terminal is now the active window -- typing will reach IT
              id: wl-input-focus-observed
              context:
                - runtime
              command:
                in_container: true
                command: |
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    hyprctl -j activewindow | grep -q '"initialTitle": *"cstream-input"' && echo ACTIVE-IS-INPUT
              stdout:
                - contains: ACTIVE-IS-INPUT
              eventually: 60s
              retry_interval: 5s
            - check: wl type sends a command line to the focused client
              id: wl-type-command
              context:
                - runtime
              wl:
                method: type
                text: sleep 313
            - check: wl key Return submits it
              id: wl-key-return
              context:
                - runtime
              wl:
                method: key
                key: Return
            - check: the typed line actually RAN -- the process exists
              id: wl-type-observed
              context:
                - runtime
              exit_status: 0
              command:
                in_container: true
                command: |
                    # The whole point of the pair: `wl: type` and `wl: key` both exit 0
                    # even when nothing is delivered. A live process with the exact
                    # argument that was typed is the only thing that proves the
                    # keystrokes crossed the compositor, reached the focused client,
                    # and were executed by its shell.
                    pgrep -f 'sleep 313' >/dev/null || {
                        echo "TYPE-NOT-DELIVERED: no 'sleep 313' process -- keystrokes did not reach the shell" >&2; exit 1; }
                    echo TYPE-DELIVERED
              stdout:
                - contains: TYPE-DELIVERED
              eventually: 60s
              retry_interval: 5s
            - check: wl key-combo sends ctrl+c to the same client
              id: wl-keycombo-interrupt
              context:
                - runtime
              wl:
                method: key-combo
                combo: ctrl+c
            - check: ctrl+c actually interrupted it -- the process is GONE
              id: wl-keycombo-observed
              context:
                - runtime
              exit_status: 0
              command:
                in_container: true
                command: |
                    # A modifier that never reached the client leaves the sleep running,
                    # and `wl: key-combo` still exits 0. Absence of the process is the
                    # observation; the preceding check proved it was there to begin with,
                    # so this cannot pass vacuously.
                    if pgrep -f 'sleep 313' >/dev/null; then
                        echo "KEYCOMBO-NOT-DELIVERED: 'sleep 313' still running after ctrl+c" >&2; exit 1
                    fi
                    echo KEYCOMBO-DELIVERED
              stdout:
                - contains: KEYCOMBO-DELIVERED
              eventually: 60s
              retry_interval: 5s
            # The GWD half of "dual-sided" is NOT re-checked here. It is already
            # gated by layer-gst-wayland-display's own `gwd-keymap-properties`
            # (gst-inspect asserting xkb-layout / xkb-variant / xkb-options),
            # which is the right owner: the layer builds the plugin, so it is
            # what can tell a patched fork from upstream. A copy here was written
            # and removed -- the bed ran both and reported the same id twice.
            - check: the compositor keyboard starts on the default layout, so a switch is observable
              id: hypr-keymap-baseline
              context:
                - runtime
              exit_status: 0
              command:
                in_container: true
                command: |
                    # Without this the next observation is vacuous: if the layout were
                    # already "de", asserting "de" after the switch would prove nothing.
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    dev=$(hyprctl -j devices 2>&1)
                    printf '%s' "$dev" | grep -q '"layout": *"de"' && {
                        echo "KEYMAP-BASELINE-ALREADY-DE: the switch below would prove nothing" >&2; exit 1; }
                    echo KEYMAP-BASELINE-NOT-DE
              stdout:
                - contains: KEYMAP-BASELINE-NOT-DE
            - check: wl hypr-eval switches the compositor keymap to de
              id: hypr-keymap-set
              context:
                - runtime
              wl:
                method: hypr-eval
                command: hl.config({ input = { kb_layout = "de" } })
            - check: the compositor REPORTS the new layout -- the eval actually applied
              id: hypr-keymap-observed
              context:
                - runtime
              exit_status: 0
              command:
                in_container: true
                command: |
                    # Half two of "dual-sided", and the reason this is an observation
                    # rather than an exit-code check: `hyprctl eval` answers "ok" for
                    # ANY expression -- valid, invalid or no-op -- so the verb's
                    # success says nothing about whether the config changed. Only the
                    # compositor's own device report does.
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    dev=$(hyprctl -j devices 2>&1)
                    printf '%s' "$dev" | grep -q '"layout": *"de"' || {
                        echo "KEYMAP-NOT-APPLIED: no keyboard reports layout de" >&2
                        printf '%s' "$dev" | grep -A6 -i 'keyboards' | head -30 >&2
                        exit 1; }
                    echo KEYMAP-APPLIED-DE
              stdout:
                - contains: KEYMAP-APPLIED-DE
              eventually: 60s
              retry_interval: 5s
            - check: two windows are mapped, so focus has somewhere to move BETWEEN
              id: wl-focus-fixture
              context:
                - runtime
              command:
                in_container: true
                command: |
                    set -e
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    NEST=$(hyprctl -j instances | sed -n 's/.*"wl_socket"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    # -T sets the INITIAL title. foot rewrites its live title from the
                    # shell prompt within a second of mapping, so `title:` selectors are
                    # useless for automation here -- every window reports "@host:~".
                    # initialtitle: is the stable one (measured).
                    for n in focus-a focus-b close-keep close-target; do
                        pgrep -f "foot -T cstream-$n" >/dev/null 2>&1 || \
                          (WAYLAND_DISPLAY=$NEST setsid foot -T "cstream-$n" >/dev/null 2>&1 &)
                    done
                    for _ in $(seq 40); do
                        [ "$(hyprctl -j clients | grep -c 'cstream-\(focus\|close\)-')" -ge 4 ] && break
                        sleep 1
                    done
                    test "$(hyprctl -j clients | grep -c 'cstream-\(focus\|close\)-')" -ge 4
                    echo FOCUS-FIXTURE-READY
              stdout:
                - contains: FOCUS-FIXTURE-READY
              eventually: 120s
              retry_interval: 30s
            - check: the wl verb focuses window A on Hyprland
              id: wl-focus-a
              context:
                - runtime
              wl:
                method: focus
                target: initialtitle:cstream-focus-a
            - check: window A is now the active one -- the focus actually moved
              id: wl-focus-a-observed
              context:
                - runtime
              command:
                in_container: true
                command: |
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    # Asserting the ACTIVE WINDOW, not the verb's exit code. A dispatcher
                    # that silently did nothing still exits 0 -- that is the whole failure
                    # mode this gate exists for.
                    hyprctl -j activewindow | grep -q '"initialTitle": *"cstream-focus-a"' && echo ACTIVE-IS-A
              stdout:
                - contains: ACTIVE-IS-A
              eventually: 60s
              retry_interval: 15s
            - check: the wl verb focuses window B on Hyprland
              id: wl-focus-b
              context:
                - runtime
              wl:
                method: focus
                target: initialtitle:cstream-focus-b
            - check: window B is now active -- focus moves BOTH ways, so A was not a coincidence
              id: wl-focus-b-observed
              context:
                - runtime
              command:
                in_container: true
                command: |
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    hyprctl -j activewindow | grep -q '"initialTitle": *"cstream-focus-b"' && echo ACTIVE-IS-B
              stdout:
                - contains: ACTIVE-IS-B
              eventually: 60s
              retry_interval: 15s
            - check: the wl verb minimizes window B on Hyprland
              id: wl-minimize-b
              context:
                - runtime
              wl:
                method: minimize
                target: initialtitle:cstream-focus-b
            - check: window B really left for the special workspace -- Hyprland's minimize
              id: wl-minimize-b-observed
              context:
                - runtime
              command:
                in_container: true
                command: |
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    # Two assertions, because either alone is satisfiable by a no-op:
                    # the special workspace must EXIST (it is created on first use), and
                    # B must be ON it -- a window that merely lost focus would satisfy the
                    # first but not the second.
                    hyprctl -j workspaces | grep -q 'special:minimized' || { echo NO-SPECIAL-WORKSPACE; exit 1; }
                    # Plain `hyprctl clients` is one blank-line-separated paragraph per
                    # window, so awk in paragraph mode reads the pair (initialTitle,
                    # workspace) off the SAME window. Splitting the JSON would not:
                    # `workspace` precedes `initialTitle` inside each object, so a naive
                    # record split attributes one window's workspace to the next.
                    hyprctl clients | awk -v RS= '/initialTitle: cstream-focus-b/ {for(i=1;i<=NF;i++) if($i=="workspace:"){w=$(i+2); gsub(/[()]/,"",w); print "B-WORKSPACE=" w}}'
              stdout:
                - contains: 'B-WORKSPACE=special:minimized'
              eventually: 60s
              retry_interval: 15s
            - check: focus the window that must SURVIVE the close, so the regression can bite
              id: wl-close-focus-keep
              context:
                - runtime
              wl:
                method: focus
                target: initialtitle:cstream-close-keep
            - check: the wl verb closes the NAMED window, not the focused one
              id: wl-close-target
              context:
                - runtime
              wl:
                method: close
                target: initialtitle:cstream-close-target
            - check: the named window is gone AND the focused one survived
              id: wl-close-observed
              context:
                - runtime
              command:
                in_container: true
                command: |
                    export XDG_RUNTIME_DIR=/tmp/cstream-rt
                    export HYPRLAND_INSTANCE_SIGNATURE=$(hyprctl -j instances | sed -n 's/.*"instance"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
                    # BOTH halves are the assertion. Measured on 0.56.2 before the fix:
                    # hl.dsp.window.close(<selector>) ACCEPTS the selector and ignores it,
                    # closing the ACTIVE window instead -- so "the target is gone" alone
                    # passes while the wrong window died. The survivor is what catches it.
                    hyprctl clients | grep -q 'initialTitle: cstream-close-target' && { echo TARGET-STILL-OPEN; exit 1; }
                    hyprctl clients | grep -q 'initialTitle: cstream-close-keep' || { echo WRONG-WINDOW-CLOSED; exit 1; }
                    echo CLOSED-THE-NAMED-WINDOW
              stdout:
                - contains: CLOSED-THE-NAMED-WINDOW
              eventually: 60s
              retry_interval: 15s
            - check: the cstream verb dispatches through the provider registry and reports the gateway's readiness
              id: cstream-verb-status
              context:
                - runtime
              cstream: status
              stdout:
                - contains: '"ready":true'
              eventually: 120s
              retry_interval: 15s
            - check: the cstream verb ACCEPTS a correct credential through the real session leader
              id: cstream-verb-login-accept
              context:
                - runtime
              cstream:
                method: login
                user: user
                password: cstream-bed-pw
                expect: accept
              stdout:
                - contains: LOGIN-ACCEPTED
              eventually: 120s
              retry_interval: 20s
            - check: the cstream verb REFUSES a wrong credential against the same stack
              id: cstream-verb-login-reject
              context:
                - runtime
              cstream:
                method: login
                user: user
                password: cstream-bed-pw-WRONG
                expect: reject
              stdout:
                - contains: LOGIN-REJECTED
              eventually: 120s
              retry_interval: 20s
            # The `wl:` verb against the nested compositor. These are the first
            # checks to exercise it here: the binaries it shells out to
            # (wl-clipboard, wtype, wlr-randr) reached this image only when
            # pod-hyprland shipped them beside grim, so the verbs previously failed
            # on `command not found` rather than on anything about the desktop.
            #
            # DELIBERATELY NOT GATED: `wl: resolution`. It SETS the output through
            # wlr-randr, a second writer to a property the cstream control socket
            # owns. Measured on this bed: it moved the compositor to 1280x720 while
            # the streamer's capsfilter stayed at 640x480 -- encoder and compositor
            # desynced with no error anywhere. Resize goes through the control
            # socket (the cstream-resize-* checks above) only.
            # Tracked as opencharly/pod-cstream#11.
            - check: the clipboard accepts a value through the wl verb
              id: wl-clipboard-set
              context:
                - runtime
              wl:
                method: clipboard
                action: set
                text: cstream-clipboard-canary
            - check: the clipboard returns EXACTLY what was set -- a set alone passes against a clipboard that swallows writes
              id: wl-clipboard-roundtrip
              context:
                - runtime
              wl:
                method: clipboard
                action: get
              stdout:
                - contains: cstream-clipboard-canary
            - check: a wl screenshot of the nested desktop has real, non-uniform content
              id: wl-screenshot-content
              context:
                - runtime
              wl:
                method: screenshot
                artifact: /tmp/wl-desktop.png
                artifact_min_bytes: 5000
                artifact_not_uniform: true
            # WP5 lock/idle -- the last three checks of this bed, IN THIS ORDER, and
            # nothing may be appended after them.
            #
            # The desktop locks itself once no consumer has been connected for
            # CSTREAM_LOCK_AFTER (10s in pod-cstream). hyprlock takes an
            # ext-session-lock, and a lock client that is killed rather than
            # authenticated leaves the compositor locked with no client -- so once
            # this fires, every later `wl:` check would be reading a lock screen
            # instead of the desktop. That is why the WebRTC frame check moved down
            # here: it is the only check that connects a consumer, and its departure
            # is what starts the countdown.
            #
            # The ONLY check in this bed that can fail on an encoding or transport
            # defect. cstream-stream-live reads the producer's own tap and the wl-*
            # checks read the compositor, so both pass happily while not one byte
            # reaches a consumer -- which is exactly what happened while webrtcbin
            # was missing from the image.
            #
            # artifact_not_uniform is the assertion that matters: a stream that
            # negotiates and then sends black, or a placeholder, is the failure this
            # check exists to catch, and a byte count alone would pass it.
            - check: nothing has locked the desktop yet -- the lock is a CONSEQUENCE, not the resting state
              id: cstream-lock-idle-only
              context:
                - runtime
              command:
                command: |
                    # No viewer has connected at any point above, so the countdown has
                    # never started. Without this, the check below passes for free against
                    # an arming bug that locked at STARTUP -- which looks identical from
                    # outside and would ALSO be the reason every wl- check above failed.
                    if pgrep -x hyprlock >/dev/null 2>&1; then
                        echo "LOCK-HELD-EARLY: hyprlock is running before any viewer has ever connected" >&2
                        exit 1
                    fi
                    echo UNLOCKED-WHILE-UNWATCHED
                in_container: true
              stdout:
                - contains: UNLOCKED-WHILE-UNWATCHED
            - check: a frame pulled back THROUGH the negotiated WebRTC track has real content
              id: cstream-frame-through-webrtc
              context:
                - runtime
              cstream:
                method: frame
                artifact: /tmp/cstream-frame.jpg
                artifact_min_bytes: 5000
                artifact_not_uniform: true
            - check: the desktop locks itself once the last viewer has gone
              id: cstream-lock-after-detach
              context:
                - runtime
              command:
                command: |
                    # The consumer above connected and left; 10s later the streamer
                    # dispatches hyprlock INTO the nested Hyprland over its IPC socket.
                    # A failure here is the whole WP5 path: the policy never armed, the
                    # signals never fired, the socket was not found, or the Lua dispatcher
                    # name is wrong -- all of which look like "no hyprlock" from here.
                    pgrep -x hyprlock >/dev/null 2>&1 || {
                        echo "NO-LOCK-YET: hyprlock is not running" >&2
                        exit 1
                    }
                    echo "DESKTOP-LOCKED-AFTER-DETACH pid=$(pgrep -x hyprlock | head -1)"
                in_container: true
              stdout:
                - contains: DESKTOP-LOCKED-AFTER-DETACH
              # charly's own bounded retry, not a sleep: it stops the moment the lock
              # appears and fails if it never does.
              eventually: 60s
              retry_interval: 5s
check-punktfunk-client:
    pod:
        image: punktfunk-client
        disposable: true
        lifecycle: dev
        description: >-
            Proves the punktfunk CLIENT half live: the client package installs from the signed repo, its headless CLI runs, and the punktfunk verb's NEW client methods execute through it in the venue. Deliberately host-free — pairing and streaming need a second system and belong to check-punktfunk-fleet; this bed exists so the client methods are proven to run before anything depends on them.
        plan:
            - check: the verb's client method lists saved hosts through the real CLI
              id: pf-client-hosts-list
              context:
                - runtime
              punktfunk:
                method: hosts-list
            - check: the verb's client method reads stream profiles through the real CLI
              id: pf-client-profiles
              context:
                - runtime
              punktfunk:
                method: profiles-list
check-punktfunk-fleet:
    # The `1-` / `2-` prefixes are LOAD-BEARING, not decoration. charly runs one
    # `check live` per node and orders members by SORTED KEY
    # (spec/deploy.BedCheckLiveRefs -> SortedNestedKeys); there is no priority or
    # depends-on for members. Named plainly, `client` sorts before `host`, so the client
    # tried to pair before the host had armed and the PIN file did not exist yet:
    #   punktfunk: pin file /pfshare/pin is missing or empty
    # The ordinal makes the required order explicit instead of leaving it to a coincidence
    # of spelling.
    pod:
        image: punktfunk-host
        description: >-
            The streaming host: cachyos + headless sway + punktfunk-host. Its own candy checks (packages, repo key trust, host.env, the management API and web console answering in-venue) come along composed, so this member re-proves the single-node claims as a side effect.
        volume:
            # The PIN channel. The host GENERATES the pairing PIN and ignores a
            # caller-supplied one (verified against 0.33.0-1), only the CLIENT can use it,
            # and charly has no way to carry a step's output into another step's input. So
            # both members mount one path and the PIN travels as a file — the automation of
            # a human reading it off one screen and typing it into the other.
            # A BIND to /tmp, not a named volume and not a personal path.
            # charly namespaces named volumes PER MEMBER
            # (charly-<member>-punktfunk-pair-share), so `type: volume` gives each
            # member its own and the PIN never crosses -- verified: the client saw
            # "pin file /pfshare/pin is missing or empty". A bind needs a host path
            # that already exists, because podman will not create one, so it is /tmp
            # rather than a subdirectory nobody has made. The file name is
            # bed-specific so mounting a shared /tmp cannot collide.
            - name: punktfunk-pair-share
              type: bind
              host: /tmp
              path: /pfshare
        plan:
            # Mutating, so a `run:` step — the verb refuses a mutating method in a check.
            # This executes at the member's bring-up, BEFORE any check-live, which is the
            # only ordering charly offers: a member's checks cannot interleave with a
            # sibling's (bed_run.go issues one `check live` per node, parent first).
            - run: arm pairing and drop the host-generated PIN where the client can read it
              id: pf-deploy-arm-pairing
              context:
                - runtime
              punktfunk:
                method: pair-arm
                pin_out: /pfshare/charly-punktfunk-deploy.pin
            - check: the management API answers, so the client has something to pair with
              id: pf-deploy-host-live
              context:
                - runtime
              punktfunk:
                method: health
            # The CAPTURE prerequisite, asserted rather than assumed. A session
            # resolves to `capture: Portal`, so without this interface on the bus the
            # host pairs, negotiates a codec and then fails every session at pipeline
            # build — while every other control-plane check still passes. That is the
            # exact combination that let this bed report green while nothing streamed.
            #
            # It also settles the one warning a clean run still emits. The Documents
            # portal cannot mount its FUSE store here:
            #   fusermount3: mount failed: Operation not permitted
            #   error: fuse init failed: Can't mount path /tmp/doc
            # `/dev/fuse` IS present; rootless containers deny mount(2) without
            # CAP_SYS_ADMIN. punktfunk uses ScreenCast, never Documents, and granting
            # that capability would trade real privilege for a portal nothing calls —
            # so this asserts the interface that IS needed instead.
            # NOTE the bare `$XDG_RUNTIME_DIR`, not `${XDG_RUNTIME_DIR:-/tmp}`. Brace
            # form is charly's CANDY-VAR syntax, so the step does not fail — it SKIPS,
            # reporting `unresolved variables: XDG_RUNTIME_DIR`, and check-live still
            # says PASS. A decorative check that cannot fail is the exact disease this
            # bed was built to cure, and it was caught only because this change was run
            # on its own instead of batched.
            - check: the ScreenCast portal interface is live, so the host can capture
              id: pf-deploy-host-screencast
              context:
                - runtime
              command:
                command: >-
                    S="$XDG_RUNTIME_DIR/dbus-session"; [ -S "$S" ] || S=/tmp/dbus-session; DBUS_SESSION_BUS_ADDRESS="unix:path=$S" busctl --user introspect org.freedesktop.portal.Desktop /org/freedesktop/portal/desktop | grep -q org.freedesktop.portal.ScreenCast
                # NO host-side "has a paired client" check here, and the reason is the bed's
                # own ordering. charly runs one `check live` per node, parent first
                # (bed_run.go's checkLiveTree), so the host's pass completes BEFORE the
                # client's begins — the client cannot have paired yet. An `eventually: 120s`
                # poll here does not fix that, it deadlocks: the host waits two minutes for a
                # pairing that can only happen after it stops waiting, and the armed PIN
                # (expires_in_secs: 119) dies in the meantime, so the client then gets
                # "Pairing isn't armed on the host".
                #
                # Enrolment is therefore asserted on the CLIENT, where it is observable in the
                # right order: `hosts-list` only names a host after a pairing succeeded, and
                # the host's own log carries "pairing complete — client trusted".
        disposable: true
        lifecycle: dev
    punktfunk-deploy-2-client:
        pod:
            image: punktfunk-client
            description: >-
                The second system: punktfunk-client and its headless CLI, no compositor. This is the member that makes the bed a deploy rather than a self-probe — pairing and the stream measurement run from OUTSIDE the host, which is the only place they can be observed honestly.
            volume:
                # A BIND to /tmp, not a named volume and not a personal path.
                # charly namespaces named volumes PER MEMBER
                # (charly-<member>-punktfunk-pair-share), so `type: volume` gives each
                # member its own and the PIN never crosses -- verified: the client saw
                # "pin file /pfshare/pin is missing or empty". A bind needs a host path
                # that already exists, because podman will not create one, so it is /tmp
                # rather than a subdirectory nobody has made. The file name is
                # bed-specific so mounting a shared /tmp cannot collide.
                - name: punktfunk-pair-share
                  type: bind
                  host: /tmp
                  path: /pfshare
            plan:
                # Runs at this member's bring-up, after the host member armed. pin_file keeps
                # the PIN out of the manifest and out of argv — the venue's own shell pipes the
                # file into `punktfunk pair --pin -`.
                - run: pair with the host using the PIN it generated
                  id: pf-deploy-pair
                  context:
                    - runtime
                  punktfunk:
                    method: pair
                    host: charly-check-punktfunk-fleet
                    pin_file: /pfshare/charly-punktfunk-deploy.pin
                # The renderer opens a PipeWire playback stream for the session's audio, and
                # NOTHING here asserted that, so the client shipped for weeks with its audio
                # thread dying on every session while video decoded fine:
                #   pf_client_core::audio: audio playback thread ended
                #     error=pw connect (is PipeWire running in this session?)
                # The binary arrives as a dependency of punktfunk-client, so its presence
                # proves nothing — what matters is that a SESSION is running with a sink to
                # play into. Without this the same regression returns silently, because
                # stream-probe counts decoded VIDEO frames only and would still pass.
                #
                # Bare $XDG_RUNTIME_DIR, never ${...}: brace form is charly's CANDY-VAR
                # syntax and makes the step SKIP with `unresolved variables` while the phase
                # still reports PASS — a check that cannot fail.
                - check: the client has a live PipeWire sink for the renderer to play into
                  id: pf-deploy-client-audio
                  context:
                    - runtime
                  command:
                    command: >-
                        XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR"; [ -n "$XDG_RUNTIME_DIR" ] || XDG_RUNTIME_DIR=/tmp; export XDG_RUNTIME_DIR; pgrep -x pipewire >/dev/null || { echo "pipewire is not running in this venue" >&2; exit 1; }; n=$(pw-dump 2>/dev/null | grep -c "Audio/Sink"); [ "$n" -ge 1 ] || { echo "pipewire is running but exposes no Audio/Sink" >&2; exit 1; }; echo "pipewire up with $n Audio/Sink"
                - check: the host is now a saved host on the client
                  id: pf-deploy-client-knows-host
                  context:
                    - runtime
                  punktfunk:
                    method: hosts-list
                  stdout:
                    # `paired`, not the member name: the client files a host under the
                    # ADDRESS it paired with, so `hosts list` reads
                    #   10.89.0.160  10.89.0.160:9777  paired  -
                    # and the name never appears. `paired` is also the word that carries the
                    # claim — an unpaired entry would read differently.
                    - contains: paired
                # THE streaming assertion, and the one this bed lacked while reporting
                # green. Everything above is control plane: packages, repo, mgmt API,
                # pairing. All of it passes on a host that can never send a frame.
                #
                # `speed-test` is NOT this check, though it looks like it. It runs on
                # `punktfunk`, which links libgcc/libm/libc and nothing else, so it
                # advertises codec 0x00 and the host correctly refuses:
                #   no shared video codec: client advertised 0x00, host can emit 0x01
                # The decoder lives in `punktfunk-client` (libvulkan, libwayland-*, libdrm,
                # libgbm), which `launch` spawns — so stream-probe runs a real bounded
                # session through the renderer and counts frames.
                #
                # What breaking punktfunk makes this report:
                #   host cannot capture       -> connects, then "no frame decoded"
                #   client has no hardware ICD -> "advertised 0x00" in the carried output
                #   no compositor in the venue -> exit 4, naming the missing display
                #   host unreachable on 9777   -> exit 2
                - check: the client decodes real video from the host
                  id: pf-deploy-stream
                  context:
                    - runtime
                  punktfunk:
                    method: stream-probe
                    host: charly-check-punktfunk-fleet
                    # Long enough for the handshake, the decoder and the adaptive-bitrate
                    # probe (which alone takes ~800ms and only starts after the first frame).
                    stream_for: 25s
                  stdout:
                    # The PREFIX both success shapes share. A bounded probe usually reports
                    # "streamed: width=… height=… path=…" because the client prints a frame
                    # TOTAL only when the host ends the session; a host-ended session reports
                    # "streamed: N frames decoded (…)". Matching "frames decoded" failed a
                    # working stream on the singular "first frame decoded" — the verb already
                    # fails outright on zero frames, so this only asserts the success shape.
                    - contains: "streamed:"
                  timeout: 120s
# Base bed: provisions the cachyos VM and captures the golden snapshot.
check-vm-clone-base:
    vm:
        from: cachyos-vm
        disposable: true
        lifecycle: dev
        description: 'CachyOS VM-on-VM R10 base: provisions the cachyos VM, waits for sshd + cloud-init, captures the golden snapshot at install finalize for the clone bed.'
        snapshot:
            on_finalize: golden
            mode: external
            # keep_venue: false (the shared-snapshot default) — the base VM must
            # release the golden after capture so clone VMs can open it read-only
            # (shared lock) and run in parallel. keep_venue: true left the base VM
            # holding the golden exclusively, blocking every clone at vm-create
            # ("Failed to get shared write lock"). The golden persists on disk
            # (external snapshot); the base VM is disposable and re-provisioned on
            # the next refresh run.
            keep_venue: false
        plan:
            - check: the cachyos guest reports its hostname (in-guest command probe)
              id: cvc-base-hostname
              command: "uname -n"
              stdout:
                matches: ".+"
              eventually: 300s
              retry_interval: 10s
              context: [runtime]
            - check: the guest reports its os-release (in-guest command probe)
              id: cvc-base-os
              command: "cat /etc/os-release"
              stdout:
                contains: "ID=arch"
              context: [runtime]
# Clone bed: deploys the clone entity of golden; probes prove the cloned
# guest boots and answers.
check-vm-clone:
    vm:
        from: check-vm-clone-base:golden
        disposable: true
        lifecycle: dev
        description: 'CachyOS VM-on-VM R10 clone: deploys the base at its golden snapshot (from: name:tag — the unified clone spelling), probes the cloned guest with real ssh/command verbs to prove it boots and answers.'
        plan:
            - check: the cloned guest reports its hostname (in-guest command probe)
              id: cvc-clone-hostname
              command: "uname -n"
              stdout:
                matches: ".+"
              eventually: 300s
              retry_interval: 10s
              context: [runtime]
            - check: the cloned guest reports its os-release (in-guest command probe)
              id: cvc-clone-os
              command: "cat /etc/os-release"
              stdout:
                contains: "ID=arch"
              context: [runtime]
check-instrument-cachyos-vm:
    vm:
        from: check-vm-clone-base:golden
        disposable: true
        lifecycle: dev
        add_candy:
            - '@github.com/opencharly/layer-tmux:v2026.240.0202'
            - '@github.com/opencharly/layer-asciinema:v2026.246.1622'
            # The instrument verbs' serving plugins, declared EXPLICITLY (the bed knows
            # which instruments it runs — core never maps a verb to a plugin).
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.248.2114'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.248.1204'
            - '@github.com/opencharly/plugin-media/candy/plugin-media:v2026.251.1349'
        instrument:
            - id: screen
              phase: [live]
              spice: {method: session, fps: 5}
              # The media contract's screen.mp4: the spice session's MJPEG is the
              # transcode verb's SOURCE (source_artifact), transcoded to an MP4
              # container (H.264 + yuv420p) by the host-side ffmpeg pipeline word.
              pipeline: [{transcode: {to: mp4}}]
            - id: term
              phase: [live]
              record: {method: session, record_mode: terminal}
        plan:
            - check: the cachyos instrument bed runs its subject steps
              id: subject-prove
              # The VM deploy delivers charly to a VERSIONED /tmp path
              # (/tmp/charly-<calver>-<hash>), never /usr/bin/charly — the deploy
              # "never changes PATH and never downgrades a target package". Probe
              # the actual delivery path (the glob expands to the versioned binary).
              command: 'ls /tmp/charly-*'
cachyos-pacstrap-builder-skill:
    skill:
        name: cachyos-pacstrap-builder
        family: distros
        owner: cachyos-pacstrap-builder
        description: |-
            Privileged pacstrap builder image for bootstrapping a CachyOS rootfs from
            scratch. base: arch.arch (via the `arch` import namespace) + the pacstrap-builder
            candy. Lives in the opencharly/distro-cachyos submodule (box/cachyos).
            MUST be invoked before building or troubleshooting cachyos-pacstrap / cachyos-vm.
        content: |
            # cachyos-pacstrap-builder
            
            Privileged builder image used to bootstrap a CachyOS root filesystem via
            `pacstrap` inside a container. It is the `bootstrap_builder_image:` for
            `/charly-distros:cachyos-pacstrap` and the `builder_image:` for the
            `/charly-vm:cachyos-bootstrap-vm` VM.
            
            > **Lives in `opencharly/distro-cachyos`** (git submodule at `box/cachyos`). It is
            > `base: arch.arch` — the `arch` base from the **`opencharly/distro-arch`** submodule,
            > reached because the cachyos `charly.yml` imports that submodule under the `arch`
            > namespace. Its single candy, `pacstrap-builder`, lives in the main repo
            > (shared with `/charly-distros:arch-builder`'s pacstrap path) and is pulled by git
            > reference.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `arch.arch` (from the `opencharly/distro-arch` submodule, via the `arch` import namespace) |
            | Layer | pacstrap-builder (`@github.com/opencharly/charly/candy/pacstrap-builder:<tag>`) |
            | Distro | arch |
            | Build | pac |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build cachyos-pacstrap-builder
            ```
            
            This is the R10 canary for the submodule's composition machinery: a successful
            build proves the `arch` import namespace resolves the `arch` base from the
            `opencharly/distro-arch` submodule, the git-ref'd `pacstrap-builder` candy
            materializes, and the embedded build vocabulary (pacstrap builder definition +
            cachyos distro config) is reachable.
            
            `charly check box cachyos-pacstrap-builder` runs the build-scope check: 4 probes pass
            (`/usr/sbin/pacstrap`, `arch-install-scripts` installed, `/usr/sbin/grub-install`,
            `/usr/sbin/parted`) — i.e. the pacstrap toolchain the builder must ship.
            
            ## Cross-References
            
            - `/charly-distros:cachyos` — the Docker-Hub CachyOS base (sibling, no pacstrap)
            - `/charly-distros:cachyos-pacstrap` — the rootfs this builder bootstraps
            - `/charly-vm:cachyos-bootstrap-vm` — the VM that uses this as `builder_image:`
            - `/charly-distros:arch` / `/charly-distros:arch-builder` — the Arch base + builder it mirrors
            
            ## When to Use This Skill
            
            **MUST be invoked** when building or debugging the CachyOS pacstrap path.
            Invoke BEFORE reading source code or launching Explore agents.

cachyos-pacstrap-skill:
    skill:
        name: cachyos-pacstrap
        family: distros
        owner: cachyos-pacstrap
        description: |-
            Bootstrap-from-scratch CachyOS rootfs via pacstrap inside a privileged builder.
            Builds end-to-end (the shared pacstrap renderer emits
            Architecture + SigLevel); retained for offline/air-gapped builds. Lives in the
            opencharly/distro-cachyos submodule (box/cachyos).
            MUST be invoked before building or troubleshooting cachyos-pacstrap.
        content: |
            # cachyos-pacstrap
            
            Bootstrap-from-scratch CachyOS root filesystem, built via `pacstrap` inside the
            privileged `/charly-distros:cachyos-pacstrap-builder` container
            (`from: builder:pacstrap`, `bootstrap_builder_image: cachyos-pacstrap-builder`).
            
            > **Lives in `opencharly/distro-cachyos`** (git submodule at `box/cachyos`). Build:
            > `charly -C box/cachyos box build cachyos-pacstrap`.
            
            ## When to use it (and when not)
            
            The canonical CachyOS base (`/charly-distros:cachyos`) pulls the upstream-published
            OCI image from Docker Hub — that is the recommended path and the one the CachyOS
            project itself uses. This pacstrap variant exists for **offline / air-gapped**
            builds and as a worked example of the `from: builder:pacstrap` +
            `bootstrap_builder_image:` pattern.
            
            ## pacstrap x86_64_v3 + SigLevel (fixed)
            
            Without the shared `renderPacstrapExtraConf` helper the privileged pacstrap step rejects the CachyOS `x86_64_v3`
            packages (`package architecture is not valid`) and, on the VM path, trips GPGME
            signature checks (`GPGME error: No data`) — both symptoms are worth recognising.
            It handles them
            (`candy/plugin-vm/vm_bootstrap_engine.go:57`,
            used by both `runPrivilegedBootstrap` and the VM bootstrap engine — the former
            `charly/build.go`/`charly/vm_bootstrap.go` are DELETED, K-wave 2):
            
            1. it derives an `[options] Architecture = x86_64 x86_64_v3` directive from the
               cachyos-v3 repos' microarch token, so pacman accepts `linux-cachyos` etc.;
            2. it emits each repo's `SigLevel` — the VM bootstrap path previously open-coded
               the loop and dropped `SigLevel`, so `SigLevel = Never` cachyos repos fell
               back to signature-required and GPGME failed. Both paths now share one renderer
               (R3), so they can't diverge again.
            
            Verified live: `charly -C box/cachyos box build cachyos-pacstrap` produces a
            rootfs with `linux-cachyos` (`%ARCH% = x86_64_v3`) installed. (Requires an `charly`
            with this fix — newer than the published release.) The Docker-Hub `/charly-distros:cachyos`
            base is still the faster default (no privileged build).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | From | builder:pacstrap |
            | bootstrap_builder_image | cachyos-pacstrap-builder |
            | Distro | cachyos, arch |
            | Build | pac |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            The `cachyos` distro config (pacstrap base packages, CachyOS keyring
            `F3B607488DB35A47`, mirrorlist, `cachyos*` repos) lives in the embedded build
            vocabulary (`charly/charly.yml`, baked into the `charly` binary) and is resolved
            by name whenever a box declares `distro: cachyos`.
            
            ## Cross-References
            
            - `/charly-distros:cachyos` — the recommended Docker-Hub base
            - `/charly-distros:cachyos-pacstrap-builder` — the privileged builder it uses
            - `/charly-vm:cachyos-bootstrap-vm` — the VM built via the same pacstrap path
            
            ## When to Use This Skill
            
            **MUST be invoked** before building or debugging the CachyOS pacstrap rootfs.
            Invoke BEFORE reading source code or launching Explore agents.

cachyos-skill:
    skill:
        name: cachyos
        family: distros
        owner: cachyos
        description: |-
            CachyOS base image (docker.io/cachyos/cachyos-v3) — x86_64_v3-optimized Arch
            derivative. Owned by the opencharly/distro-cachyos submodule (box/cachyos);
            consumed by main's versa box via the `cachyos` import namespace.
            MUST be invoked before building, deploying, or troubleshooting cachyos boxes.
        triggers:
            - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"
        content: |
            # cachyos
            
            CachyOS base image, pulled from the upstream-published OCI image
            `docker.io/cachyos/cachyos-v3` (optimized for modern `x86_64_v3` CPUs), pinned
            by digest in `box/cachyos/charly.yml` — Docker Hub publishes only a `:latest`
            tag for `cachyos-v3`, so a digest is the most precise pin available.
            CachyOS is an Arch derivative, so it shares the Arch toolchain, `pacman`, and the
            `arch-builder` multi-stage builder.
            
            The CachyOS family lives in the **`opencharly/distro-cachyos`** repo (git submodule at
            **`box/cachyos`**), with the `cachyos` base image **owned there** and its
            boxes discovered as `box/<name>/charly.yml`. It composes the main repo's shared
            candies by `@github` git reference and imports the **`opencharly/distro-arch`** submodule
            under the `arch` namespace (`import: [{arch: …}]`) so it reaches `arch.arch` (the
            `cachyos-pacstrap-builder` base) and `arch.arch-builder` (the cachyos base's
            builder) — one-directional, since arch imports nothing back. Build it
            from the submodule: `charly -C box/cachyos box build cachyos` (or
            `charly --repo opencharly/distro-cachyos box build cachyos`).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | docker.io/cachyos/cachyos-v3 (pinned by digest in charly.yml) |
            | Layers | (none) |
            | Platforms | linux/amd64 |
            | Distro | cachyos, arch |
            | Build | pac |
            | Builders | pixi, npm, cargo, aur → arch-builder |
            | Registry | ghcr.io/opencharly |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            ## main → cachyos coupling
            
            The `cachyos` base and its derived boxes — `versa`, the `openclaw-*` family,
            `githubrunner`, `android-emulator`, `charly-selftest`, and the `selkies-*` GPU
            desktops — all live in the **`opencharly/distro-cachyos`** submodule, discovered as
            `box/<name>/charly.yml` boxes. The main repo imports that submodule under the
            `cachyos` import namespace to reference the relocated boxes from its own
            `check`/`vm`/`local`/`kubernetes`/`android` entities:
            
            ```yaml
            # main charly.yml
            import:
              - cachyos: '@github.com/opencharly/distro-cachyos:<tag>'   # namespaced child import → cachyos.<entry>
            ```
            
            This is a one-directional **main → cachyos** dependency. The submodule, in turn,
            imports the **`opencharly/distro-arch`** submodule under the `arch` namespace (for
            `arch.arch` and the `arch.arch-builder` builder) — also one-directional, since
            arch imports nothing back. The whole import graph is therefore a DAG
            (main → cachyos → arch, plus main → arch directly), with no mutual cycle. When a
            repo is reached via two paths — arch, here, via main → arch and via
            main → cachyos → arch — the loader resolves it to a single materialization **by
            repo identity**, so main's namespace pins win and a stale transitive pin inside a
            published submodule release never drags a divergent snapshot into the load (see
            `/charly-internals:go` "import-namespace loader"). The image DAG
            `versa → cachyos → docker.io/cachyos-v3` is itself acyclic. `versa` lives in the
            same submodule as its `base: cachyos`, so it inherits the cachyos base's
            `distro:`/`build:` values AND its `builder:` map (pixi/npm/cargo/aur →
            `arch.arch-builder`) directly — there is no namespace boundary between them. The
            namespace-relative builder map crosses the boundary once, where the cachyos base
            itself names the qualified `arch.arch-builder` ref.
            
            ## AUR support — full parity with `arch`
            
            CachyOS has the **same AUR capability as the `arch` base**, because it is
            Arch-derived and its `builder.aur` points at the shared `arch-builder` (which
            ships `yay`). Anything that builds on arch builds on cachyos:
            
            - A box based on `cachyos` that needs AUR packages declares
              `build: [pac, aur]` (exactly as an `arch`-based box would — the base itself
              declares only `build: [pac]`, so the consumer opts in). The AUR builder stage
              (`<layer>-aur-build` via `arch-builder`) then compiles the packages and
              `pacman -U`-installs the `.pkg.tar.zst` artifacts. Worked example: the
              `selkies-desktop` box (`base: cachyos.cachyos`, `build: [pac, aur]`) builds
              `google-chrome` (chrome candy) + `wlrctl` (wl-tools candy) from the AUR.
            - Candies author AUR packages under `distro.arch.aur.package` (see
              `/charly-image:layer` "AUR"); the `arch` distro tag is what cachyos boxes match
              (their `distro:` is `[cachyos, arch]`), so the same `distro.arch` sections used
              by every Arch box apply unchanged.
            - The `cachyos` base declares `produce: [pixi, npm, cargo, aur]` (identical to
              `arch`), advertising the same builder-capability profile as every other base
              distro.
            
            There is **no cachyos-specific AUR path** and no cachyos-only builder — AUR on
            cachyos and AUR on arch are the same code path through `arch-builder`.
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build cachyos
            charly shell cachyos -c "pacman --version"
            ```
            
            ## Derived / sibling entries (all in opencharly/distro-cachyos)
            
            - `/charly-distros:cachyos-pacstrap-builder` — privileged pacstrap builder (`base: arch.arch`)
            - `/charly-distros:cachyos-pacstrap` — bootstrap-from-scratch rootfs (builds end-to-end)
            - `/charly-vm:cachyos-bootstrap-vm` — bootstrap VM (`cachyos-vm`) + `check-cachyos-vm` check bed
            - `/charly-local:charly-cachyos` — the operator CachyOS workstation profile
            - `/charly-versa:versa` — CachyOS-rooted notebook/OSM image in this submodule (`base: cachyos`)
            
            ### CachyOS GPU box family
            
            The submodule also carries a CachyOS GPU box family — the Arch/CachyOS siblings
            of the Fedora GPU boxes (which live in `box/fedora`). They build on the
            `cachyos.nvidia` GPU base, which is `cachyos` + `agent-forwarding` + `nvidia` +
            `cuda` (the `nvidia` and `cuda` candies are multi-distro — Fedora rpm + Arch pac —
            so they compose unchanged on CachyOS):
            
            - `cachyos.nvidia` — the GPU base (cachyos + agent-forwarding + nvidia + cuda)
            - `cachyos.python-ml` — ML Python environment
            - `cachyos.jupyter-ml` — CUDA ML JupyterLab
            - `cachyos.ollama` — Ollama LLM server
            - `cachyos.comfyui` — ComfyUI image generation
            - `cachyos.unsloth-studio` — Unsloth Studio fine-tuning UI
            - `cachyos.immich-ml` — Immich with the CUDA ML backend
            - `cachyos.selkies-labwc-nvidia` — GPU NVENC Selkies streaming desktop (labwc flavor)
            - `cachyos.selkies-kde-nvidia` — GPU NVENC Selkies streaming desktop (full KDE Plasma flavor)
            - `cachyos.selkies-kde` — full KDE Plasma Selkies flavor on the plain cachyos base (VAAPI on an AMD/Intel render node, software x264 otherwise; the `-nvidia` sibling adds NVENC). The labwc cpu/amd flavor (`selkies-labwc`) lives in this same `box/cachyos` submodule.
            
            ## Why Docker Hub instead of pacstrap
            
            The canonical base pulls the upstream OCI image (the path the CachyOS project
            itself recommends — see https://github.com/CachyOS/docker). It's the faster
            default (no privileged pacstrap, no kernel build). The pacstrap-from-scratch
            variant (`/charly-distros:cachyos-pacstrap`) is retained for offline/air-gapped
            builds and also builds end-to-end (the pacstrap renderer derives
            `[options] Architecture` from the cachyos-v3 microarch repos and emits per-repo
            `SigLevel`).
            
            ## Verification
            
            After `charly -C box/cachyos box build cachyos`:
            - `charly box list` — box appears
            - `charly shell cachyos -c "pacman --version"` — pacman available
            - `charly box inspect versa --format base` (from main) → `cachyos.cachyos` (the `cachyos` import namespace resolves)
            - `charly check box cachyos` — build-scope check: 3 probes pass (os-release `ID=cachyos`,
              `pacman --version`, `pacman-conf --repo-list` contains `cachyos-v3`). These also
              pass when `cachyos` is built from main via the `cachyos` import namespace, and are
              inherited by `versa` through the base chain.
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the cachyos base image, the
            opencharly/distro-cachyos submodule, or the main → cachyos import-namespace coupling.
            Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-distros:arch` — the Arch base (`cachyos-pacstrap-builder` is `base: arch.arch`, via the `arch` import namespace)
            - `/charly-image:image` — box family umbrella (composition, build/validate/inspect)
            - `/charly-internals:cutover-policy` — the hard-cutover policy governing submodule splits

charly-cachyos-skill:
    skill:
        name: charly-cachyos
        family: local
        owner: charly-cachyos
        description: |-
            Operator CachyOS workstation profile — a kind:local template plus a host:local deploy that installs the full dev stack (a large candy list) onto a CachyOS host via ShellExecutor. Lives in the opencharly/distro-cachyos submodule. Use before editing or applying the charly-cachyos workstation profile.

        triggers:
            - "CachyOS images / `cachyos*` / `charly-cachyos` workstation profile / `box/cachyos` submodule"
        content: |
            # charly-cachyos

            The operator's CachyOS developer-workstation profile: a `kind: local` template
            (`charly-cachyos-app`) plus a `host: local` deploy (`charly-cachyos`, the
            deploying entry) that applies a kitchen-sink dev stack directly to the
            current machine via `ShellExecutor` — no SSH, no VM, no container.

            It lives in the **`opencharly/distro-cachyos`** repo (git submodule at
            **`box/cachyos`**), in that repo's single `charly.yml` — both the
            `kind: local` template (`charly-cachyos-app`) and the `charly-cachyos` `local:` deploy
            that deploys it. The repo also carries the `cachyos-gpu` deploy — the
            **persistent** operator GPU-workstation VM (`vm: { from: cachyos-gpu-workstation-vm }`,
            **not** `disposable`; see `/charly-vm:cachyos-bootstrap-vm`) — so `charly-cachyos` is no longer
            the only non-disposable deploy there; every disposable test bed is a
            `disposable: true` deploy. Apply it with:

            ```bash
            charly -C box/cachyos update charly-cachyos
            # or, anywhere:
            charly --repo opencharly/distro-cachyos update charly-cachyos
            ```

            ## What it installs

            A large candy list. Most are pulled from the main repo by **git reference**
            (`@github.com/opencharly/charly/candy/<name>:<tag>`); the cachyos-exclusive
            `ghostty`, `keepassxc-keyring`, and `wheel-nopasswd` are vendored locally in this
            repo's `candy/` (resolved via its `discover:` block):

            `wheel-nopasswd`, `yay`, `dev-tools`, `gh`, `pre-commit`, `tmux`, `direnv`,
            `gnupg`, `keepassxc`, `keepassxc-keyring`, `tailscale`, `tailscale-up`,
            `build-toolchain`, `golang`, `rust`, `nodejs`, `uv`, `claude-code`, `codex`,
            `gemini`, `oracle`, `forgecode`, `devops-tools`, `docker-ce`, `kubernetes`,
            `vscode`, `ghostty`, `chrome`, `nvidia`, `charly`.

            ## Key fields

            | Field | Value |
            |---|---|
            | `install_opts.builder_image` | `ghcr.io/opencharly/arch-builder:2026.122.2252` (OCI ref, not a candy) |
            | `install_opts` | with_service, allow_repo_changes, allow_root_tasks all true |
            | `env` | `EDITOR=nvim`, `PAGER=less` |
            | `disposable` (deploy) | absent/false — this real workstation requires operator authorization; unattended `charly update charly-cachyos` is forbidden |

            ## Deploy-scope check probes

            - `passwordless-sudo-host` — `sudo -n true` (wheel-nopasswd candy must have run)
            - `nvidia-ctk-present` — `command -v nvidia-ctk`
            - `nvidia-cdi-spec` — `/etc/cdi/nvidia.yaml` exists

            Both `nvidia-*` probes gate on an active host NVIDIA driver
            (`[ -e /dev/nvidiactl ] || nvidia-smi`) and pass with an N/A note on a
            card-less or VFIO-passthrough host, so the profile applies cleanly anywhere.

            ## Composition-by-reference note

            `charly-cachyos-app`'s remote candy refs are collected and materialized by the
            same `CollectRemoteRefs` walk as box candy refs: the walk collects the candy
            refs of the ROOT project's own `kind: local` templates (the cachyos repo is the
            root here), so `charly box validate` / `charly update charly-cachyos` resolve the github-ref'd
            candies. (Collection is reachability-scoped — a namespace's `kind:local`
            templates, imported only as a dependency, are NOT collected by an importer; only
            the root's own locals are. See `/charly-internals:go` "Remote-layer resolver".)

            ## Cross-References

            - `/charly-local:local-spec` — `kind: local` template authoring reference
            - `/charly-local:local-deploy` — the `target: local` deployment surface
            - `/charly-distros:cachyos` — the CachyOS base of the same family
            - `/charly-core:deploy` — fleet entry semantics (globally-unique names within a document: the `charly-cachyos` fleet deploys the suffixed `charly-cachyos-app` `kind: local` template)

            ## When to Use This Skill

            **MUST be invoked** when editing or applying the charly-cachyos workstation profile,
            or reasoning about the kind:local remote-candy-ref machinery. Invoke BEFORE
            reading source code or launching Explore agents.
githubrunner-skill:
    skill:
        name: githubrunner
        family: distros
        owner: githubrunner
        description: |-
            Self-hosted GitHub Actions runner on CachyOS, fully rootless — runs as
            uid=1000 with zero added capabilities (no root, no privileged) via
            container-nesting, with rootless nested podman/buildah/skopeo for CI.
            Host networking retained for reachability. MUST be invoked before building,
            deploying, configuring, or troubleshooting the githubrunner box.
        content: |
            # githubrunner
            
            Self-hosted GitHub Actions runner on **CachyOS**, fully rootless. Shares the
            rootless nested-container posture with `/charly-openclaw:openclaw-desktop` (uid=1000,
            no caps, `unmask=/proc/*` via `/charly-distros:container-nesting`).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | cachyos (`cachyos.cachyos`) |
            | Layers | agent-forwarding, github-runner, charly, dbus, container-nesting |
            | Build | pac |
            | Platforms | linux/amd64 |
            | UID / user | **1000 / user** (rootless — NO uid/privileged override) |
            | Network | host (reach the host-side ghcr pull-through mirror) |
            | Security | container-nesting's posture: `cap_add:[]`, `security_opt:[unmask=/proc/*]`, devices `/dev/fuse` + `/dev/net/tun` |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `cachyos` (`docker.io/cachyos/cachyos-v3`, via the `cachyos` import namespace)
            2. `agent-forwarding` — GPG/SSH/direnv (composes gnupg + direnv + ssh-client)
            3. `github-runner` — the Actions runner agent (under `${HOME}/actions-runner`),
               cosign, go/git/jq, qemu-user-static (aarch64 cross-arch CI), the .NET runtime
               deps, the credential-backed registration, the ghcr mirror config
            4. `charly` — the charly binary + `virtualization` + `gocryptfs` + `socat`
            5. `dbus` — session bus (for runner hooks)
            6. `container-nesting` — rootless nested podman/buildah/skopeo + the subuid/subgid
               layout + newuidmap/newgidmap file-caps + containers/storage/policy configs
            
            ## Rootless posture (genuinely uid 1000, no caps)
            
            The box carries **no uid/user/privileged override**, so it resolves to
            `container-nesting`'s posture: uid=1000, `cap_add:[]`, `security_opt:[unmask=/proc/*]`,
            devices `/dev/fuse` + `/dev/net/tun`. The runner process (`run.sh`), all CI jobs,
            and rootless nested podman all run as `user` (uid 1000). See
            `/charly-distros:container-nesting` for the `mount_too_revealing()` kernel RCA that
            makes nested podman work without caps or `--privileged`.
            
            `/charly-coder:sshd` (passwordless `/etc/sudoers.d/charly-user`) is composable if a
            workflow genuinely needs sudo; it is not composed by default.
            
            ## Nested container support
            
            `githubrunner` composes `/charly-distros:container-nesting` directly, so CI jobs get
            first-class **rootless nested podman/buildah/skopeo** (uid 1000, `/dev/fuse` +
            `unmask=/proc/*`, `crun` + `fuse-overlayfs`, `BUILDAH_ISOLATION=chroot`). The
            rootless image cache lives under `${HOME}/.local/share/containers`. Cross-arch
            container builds (aarch64) work via the repo `qemu-user-static` +
            `qemu-user-static-binfmt` packages.
            
            ## CI: the org's release-binary workflow runs on GitHub-hosted runners

            The legacy `release-packages` workflow (`.github/workflows/release-packages.yml`,
            which built the pac/rpm/deb packages on this self-hosted runner via `charly box
            pkg`) is REMOVED with the nFPM cutover. The release-binary workflow
            (`.github/workflows/release-binary.yml`) builds the CalVer-stamped binary + the
            welded plugins on a GitHub-hosted `ubuntu-latest` runner and publishes them as
            release assets; the per-distro package repos (built by the `charly
            generate-packages` plugin) consume those assets. This runner still carries the
            FULL `charly` PKGBUILD `depends=` set, so the charly CLI (and the CI jobs that
            drive it) runs fully here:

            - **pac** runs NATIVELY — the runner is an Arch (CachyOS) host, so `charly` and
              its deps resolve without a container. Every `depends=` is pre-installed, so no
              `sudo pacman` (the runner has no passwordless sudo).
            - **rpm + deb** run in the runner's rootless nested podman.

            The `github-runner` candy completes the `charly` runtime on the runner — beyond the .NET/runner deps it adds
            the `depends=` packages the charly/virtualization candies don't already provide
            (`slirp4netns`, `libisoburn`, `cdrtools`, `swtpm`).
            
            ## Token mechanism (credential-backed; obtained via `gh`)
            
            `RUNNER_TOKEN` is a `secret_accept` (credential-store-backed — never written to
            charly.yml or the quadlet); `RUNNER_ORG` is an `env_accept`. The registration
            token is short-lived and only consumed once at `charly config` time (the registered
            runner persists its own `.credentials` on the `state` volume), so it is obtained
            fresh from `gh`. The `post_enable`/`pre_remove` hooks are guarded — they skip
            when `RUNNER_TOKEN` is empty, so a token-less deploy (e.g. an check bed) brings the
            image up without registering, and a stale token never errors a teardown.
            
            ```bash
            # Obtain a fresh org registration token and register:
            TOKEN=$(gh api -X POST /orgs/<org>/actions/runners/registration-token --jq .token)
            charly config githubrunner -e RUNNER_ORG=<org> -e RUNNER_TOKEN="$TOKEN"   # token scrubbed → credential store
            charly start githubrunner
            ```
            
            Removal deregisters via the `pre_remove` hook, which needs a **remove**-token
            (distinct from the registration token):
            
            ```bash
            charly remove githubrunner -e RUNNER_TOKEN=$(gh api -X POST /orgs/<org>/actions/runners/remove-token --jq .token)
            ```
            
            ## Lifecycle
            
            ```bash
            charly box build githubrunner
            charly config githubrunner -e RUNNER_ORG=<org> -e RUNNER_TOKEN="$TOKEN"
            charly start githubrunner
            charly stop githubrunner
            charly remove githubrunner -e RUNNER_TOKEN=<remove-token>
            ```
            
            ## Key Candies
            
            - `/charly-distros:github-runner` — runner agent, hooks, registration, ghcr mirror, .NET deps + the charly-host `depends=` completion (native pac builds in CI)
            - `/charly-distros:container-nesting` — rootless nested podman/buildah/skopeo, subuid layout, caps
            - `/charly-tools:charly` — the charly binary + virtualization + gocryptfs + socat
            - `/charly-distros:agent-forwarding` — GPG/SSH/direnv for the `.secrets` workflow
            
            ## Related Boxes
            
            - `/charly-distros:cachyos` — the CachyOS base (parent, via the `cachyos` namespace)
            - `/charly-openclaw:openclaw-desktop` — same rootless container-nesting posture (uid 1000, no caps)
            - `/charly-distros:charly-fedora`, `/charly-coder:charly-arch` — the charly-toolchain siblings (root path, box-level full-hammer security)
            
            ## Related Commands
            
            - `/charly-core:charly-config` — deploy setup with RUNNER_ORG (env) / RUNNER_TOKEN (secret)
            - `/charly-core:start`, `/charly-core:stop`, `/charly-core:remove` — lifecycle + pre-remove deregistration
            - `/charly-core:charly-status`, `/charly-core:logs` — verify runner is idle + troubleshoot
            - `/charly-build:secrets` — the credential store backing `RUNNER_TOKEN`
            
            ## Verification
            
            Build-scope (`charly check box githubrunner`) + deploy-scope (`charly check live`) checks
            ship on the `github-runner` candy (functional: `config.sh --version` proves the
            .NET deps resolved; rootless nested `podman run` proves the posture). The
            disposable R10 bed is **`check-githubrunner-pod`** (`charly check run check-githubrunner-pod`)
            — it proves the rootless composition WITHOUT GitHub registration (no token →
            guarded hooks no-op).
            
            After `charly start` against a registered deploy:
            
            - `charly status githubrunner` — container running
            - `charly shell githubrunner -c "id"` — uid=1000(user) (rootless)
            - `charly shell githubrunner -c "podman run --rm quay.io/libpod/alpine:latest true"` — rootless nested podman works
            - Runner appears as "Idle" in the org's Settings > Actions > Runners
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the githubrunner box,
            self-hosted runners, or GitHub Actions CI/CD. Invoke this skill BEFORE
            reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)
            - `/charly-check:check` — the `check:` checks + the `check-githubrunner-pod` R10 bed

keepassxc-keyring-skill:
    skill:
        name: keepassxc-keyring
        family: infrastructure
        owner: keepassxc-keyring
        description: |-
            Configure KeePassXC as the freedesktop.org Secret Service provider on a
            target:local host: enable FdoSecrets, autostart KeePassXC, disable
            competing daemons (gnome-keyring + kwallet) at the per-user XDG-autostart
            and systemd-user-unit layers, install pinentry/libsecret, and
            install generic direnv shell hooks for bash/zsh/fish.
            Use when adding KeePassXC as the Secret Service backend on a host (NOT
            for adding the binary to a container image — use /charly-infrastructure:keepassxc
            for that).
        content: |
            # keepassxc-keyring -- KeePassXC as the system Secret Service
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `keepassxc`, `gnupg` |
            | Ports | none |
            | Service | none (KeePassXC autostarted via XDG `~/.config/autostart/keepassxc.desktop`, not a systemd unit) |
            | Install files | `task:` only |
            | Target | `target: local` (host deploys); harmless on container images but pointless |
            
            ## Packages
            
            - Arch (`pac:`): `pinentry`, `libsecret`
            - Fedora (`rpm:`): `pinentry-qt`, `libsecret`
            - Debian/Ubuntu (`deb:`): `pinentry-qt`, `libsecret-tools`
            
            `pinentry` provides the GUI passphrase dialog that gpg-agent spawns; `libsecret` provides `secret-tool` and the C client lib that pinentry-qt uses to query KeePassXC.
            
            ## What this candy changes on the host
            
            1. `~/.config/keepassxc/keepassxc.ini` — writes `[FdoSecrets] Enabled=true` block (and three plugin-behavior toggles).
            2. `~/.config/autostart/keepassxc.desktop` — XDG autostart entry that launches KeePassXC on every session login.
            3. `~/.config/autostart/<competitor>.desktop` — for each known competing Secret Service daemon (`gnome-keyring-secrets`, `gnome-keyring-ssh`, `gnome-keyring-pkcs11`, `org.kde.kwalletd[5,6]`, `kwalletd[5,6]`), writes an override with `Hidden=true` + `X-GNOME-Autostart-enabled=false`. Per the XDG spec, user-level overrides take precedence over `/etc/xdg/autostart/`, so the system package stays untouched and the change is fully reversible by `charly fleet del`.
            4. `systemctl --user disable --now <unit>` for the same competitors' systemd user units (`gnome-keyring-daemon.socket`, `gnome-keyring-daemon.service`, the kwallet service variants). Idempotent, silent if a unit doesn't exist.
            5. `~/.gnupg/gpg-agent.conf` — `pinentry-program /usr/bin/pinentry-qt` (the libsecret-linked pinentry that talks to KeePassXC for GPG passphrase storage).
            6. `~/.config/environment.d/ssh-agent.conf` — exports `SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/ssh-agent.socket"` for systemd-bootstrapped sessions.
            7. **Per-shell init exports (via the `shell:` schema):** for non-systemd-bootstrapped shells (tmux from a screen-locked session, ssh-in shells without a fresh login, scripts), the candy's `shell:` block lands managed-block exports of `SSH_AUTH_SOCK` (guarded with `command -v` / socket-existence check), `KEEPASSXC_DATABASE` advisory pointer, and `GPG_TTY=$(tty)`. bash/zsh/sh share one POSIX-style snippet; fish gets a syntactically-correct counterpart via `set -gx`. environment.d (item 6) and the `shell:` block coexist with no conflict — environment.d wins under systemd, the shell-rc lines fill the gap when systemd isn't in the loop.
            8. **Direnv shell hooks come from the `direnv` candy** (declared via `require: [direnv]`). This candy writes no direnv hooks itself — the responsibility belongs to the direnv candy's own `shell:` block. `charly migrate` cleans up any legacy inline `direnv-hook` blocks left on a host by older configs.
            9. **systemd user service for KeePassXC** with `Restart=on-failure` and explicit dependency on `graphical-session.target`.
            
            ## What this candy DOES NOT do
            
            - **Marking a `.kdbx` group as "Secret Service exposed"** — this is per-database state inside the `.kdbx` file itself, not in `keepassxc.ini`. It is a one-time GUI action (right-click group → "Mark as Secret Service exposed") performed by the user once per database.
            - **`charly secrets gpg setup`** — the gpg-agent.conf, systemd socket, and Secret-Service passphrase storage are still wired by the user-invoked `charly secrets gpg setup` command. This layer just installs the packages that command requires (`pinentry-qt`, `libsecret`).
            - **Removing or downgrading** any system package. All competitor disabling is per-user, reversible.
            
            ## Usage
            
            ```yaml
            # local.yml
            local:
              charly-cachyos:
                candy:
                  - '@github.com/opencharly/layer-direnv'
                  - '@github.com/opencharly/layer-gnupg'
                  - '@github.com/opencharly/layer-keepassxc'
                  - keepassxc-keyring     # this layer
                  ...
            ```
            
            Order with respect to `direnv`/`gnupg`/`keepassxc` doesn't strictly matter (the candy system topo-sorts via `require:`), but listing them adjacently makes the YAML self-documenting.
            
            ## Used In Boxes / Templates
            
            - `charly-cachyos` (kind:local template, applied via the `charly-cachyos` deployment — same name; cross-kind name reuse is permitted)
            
            ## Tests
            
            Build-scope (run on package install):
            
            - `keepassxc-binary` — `/usr/bin/keepassxc` exists.
            - `pinentry-qt-installed` — at least one of `pinentry-qt`, `pinentry-qt5`, `pinentry-qt6` resolvable on PATH.
            - `secret-tool-installed` — `secret-tool` resolvable on PATH.
            
            Deploy-scope (run on the host post-`charly fleet add` against the running user's HOME):
            
            - `keepassxc-ini-fdosecrets` — `[FdoSecrets] Enabled=true` written.
            - `keepassxc-autostart` — autostart .desktop file readable.
            - `gnome-keyring-secrets-disabled` — competitor override has `Hidden=true` (or the file doesn't exist on this host, which is also fine).
            - `direnv-fish-hook` — fish hook file contains `direnv hook fish`.
            - `direnv-bash-hook` — `~/.bashrc` contains the bash hook.
            
            ## Relationship to other skills
            
            | Skill | Relationship |
            |-------|--------------|
            | `/charly-infrastructure:keepassxc` | The package-only candy. `keepassxc-keyring` `require:` on it; never composes it. |
            | `/charly-infrastructure:gnupg` | Same — keepassxc-keyring `require:` on gnupg, never composes. |
            | `/charly-distros:agent-forwarding` | Distinct concern. agent-forwarding is for FORWARDING the host's GPG/SSH agents INTO containers via socket bind-mounts. keepassxc-keyring is about turning the host itself into a Secret Service server. Both can be active simultaneously. |
            | `/charly-build:secrets` | The CLI surface that talks to KeePassXC after this layer is in place. `charly secrets gpg setup` and `charly secrets gpg doctor` find pinentry-qt + libsecret on PATH because this layer installed them. |
            | `/charly-coder:direnv` | Installs the direnv binary. This layer adds the missing piece (the shell hook) for `.envrc` to actually trigger on `cd`. |
            | `/charly-image:layer` | Candy authoring reference. |
            | `/charly-check:check` | `check:` block format reference. |
            
            ## Why a separate candy (and not edits to `keepassxc` or `agent-forwarding`)
            
            - The `keepassxc` candy is consumed by container/desktop boxes where FdoSecrets and autostart make no sense.
            - `agent-forwarding` is a clean metalayer (`gnupg + direnv + ssh-client`) used by application boxes. Adding host-only behavior there would polute every container build that composes it.
            - Keeping host-only secret-service wiring in its own candy means containers stay containers and hosts stay hosts.
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Making KeePassXC the default Secret Service on a host.
            - The `.envrc` + `.secrets` workflow not triggering on `cd` (likely missing direnv hook from this layer).
            - gnome-keyring or kwallet conflicting with KeePassXC over the `org.freedesktop.secrets` D-Bus name.
            - Why charly's keyring backend "can't find" the user's KeePassXC database (FdoSecrets plugin disabled in keepassxc.ini).
            - The `charly-cachyos` template's keyring/direnv/gpg block.
            
            ## Related
            
            - `/charly-infrastructure:keepassxc` — package install (parent dependency)
            - `/charly-infrastructure:gnupg` — gpg binary (parent dependency)
            - `/charly-distros:agent-forwarding` — sibling: container-side agent forwarding metalayer
            - `/charly-build:secrets` — `charly secrets` and `charly secrets gpg` CLI surface
            - `/charly-coder:direnv` — direnv binary candy (the shell hook this candy adds completes the chain)
            - `/charly-image:layer` — candy authoring reference
            - `/charly-check:check` — declarative testing reference
            - `/charly-local:local-spec` — `kind: local` template reference (where this candy is composed)
            - `/charly-local:local-deploy` — `target: local` deploy semantics

openclaw-desktop-skill:
    skill:
        name: openclaw-desktop
        family: openclaw
        owner: openclaw-desktop
        description: |-
            Use when working with the openclaw-desktop box — the all-in-one CachyOS power box that fuses the selkies streaming desktop, the openclaw-full gateway + AI CLIs (claude-code/codex/gemini), a CPU ollama, and the full nested charly toolchain (build boxes / run nested rootless pods / launch rootless libvirt VMs from a terminal inside the browser-accessible desktop).
        content: |-
            # openclaw-desktop
            
            The all-in-one workstation box: a browser-accessible Wayland **streaming
            desktop** that also runs the **OpenClaw gateway + its full tool/skill stack**,
            a **CPU Ollama** inference server, and the **complete `charly` toolchain** — all as
            uid 1000 `user` with no `--privileged` and no added capabilities. Open
            `https://localhost:3000`, get a labwc desktop with Chrome, and from a terminal
            inside it you can `charly box build`, run nested rootless pods, launch rootless
            libvirt VMs, drive the OpenClaw gateway on :18789, and hit a local Ollama on
            :11434.
            
            ## Definition
            
            ```yaml
            openclaw-desktop:
              base: cachyos.cachyos        # Arch-derived, pacman/AUR, x86_64_v3 (via the `cachyos` import namespace)
              build: [pac, aur]            # required — selkies' chrome (AUR google-chrome) + wl-tools (AUR wlrctl)
              candy:
                - agent-forwarding
                - selkies-desktop          # full streaming desktop stack
                - openclaw-full            # gateway + the OpenClaw tools incl. claude-code/codex/gemini
                - ollama                   # CPU ollama (GPU-agnostic layer)
                - charly                       # the full toolchain: charly binary + virtualization + gocryptfs + socat
                - container-nesting        # nested rootless podman/buildah/skopeo
                - '@github.com/opencharly/layer-golang'
                - gh
                - '@github.com/opencharly/pod-dbus'
                - charly
              port:
                - "3000:3000"              # Selkies web UI (Traefik HTTPS)
                - "9222:9222"              # Chrome DevTools Protocol (cdp-proxy)
                - "9224:9224"              # chrome-devtools-mcp (Streamable HTTP)
                - "2222:2222"              # sshd-wrapper
                - "18789:18789"            # OpenClaw gateway
                - "11434:11434"            # Ollama API
              platform: [linux/amd64]
            ```
            
            No `uid:`/`gid:`/`user:`/`network:` override — inherits `1000/1000/user` and the
            default `charly` bridge network. Rootless is the whole design.
            
            ## Base — CachyOS, CPU
            
            `base: cachyos.cachyos` (`/charly-distros:cachyos`, reached via the `cachyos` import
            namespace) is the Arch-derived `x86_64_v3` base. The
            box is **CPU-only** — there is no `nvidia`/`cuda` candy. Ollama auto-detects
            the absence of a GPU and runs CPU inference; selkies streams via the CPU x264
            encoder. `build: [pac, aur]` is mandatory (not inherited): selkies' `chrome`
            candy compiles `google-chrome` from AUR and `wl-tools` builds `wlrctl`;
            inheriting cachyos's bare `[pac]` would gate out the AUR builder and silently
            drop the browser. The `aur → arch-builder` builder map comes from the cachyos
            base.
            
            ## Resolved security posture (OCI label)
            
            | Field | Value |
            |---|---|
            | `cap_add` | **(empty)** |
            | `security_opt` | `[unmask=/proc/*]` (from `/charly-distros:container-nesting`) |
            | `devices` | `[/dev/fuse, /dev/net/tun]` (from `/charly-distros:container-nesting`) |
            | `shm_size` | `1g` (from `/charly-selkies:chrome`) |
            | `memory_max` | `6g` (from `/charly-selkies:chrome`) |
            | `privileged` | `false` |
            | Network | default charly bridge (NOT host) |
            | UID / user | `1000 / user` |
            
            **No `--privileged`. No `cap_add: ALL`. No `seccomp=unconfined`. No
            `label=disable`.** The only security relaxation is `unmask=/proc/*` — surgical,
            documented in `/charly-distros:container-nesting` with the full kernel-level RCA.
            
            ## The four fused stacks
            
            | Stack | Candies | What it gives you |
            |---|---|---|
            | Streaming desktop | `selkies-desktop` (chrome, chrome-cdp, labwc, waybar, pipewire, swaync, pavucontrol, wl-tools, selkies, sshd, …) | labwc Wayland desktop streamed over HTTPS:3000; Chrome + CDP:9222 + chrome-devtools-mcp:9224; sshd:2222 |
            | OpenClaw + tools | `openclaw-full` (openclaw gateway + claude-code, codex, gemini + more tools) | AI gateway on :18789; `claude` CLI at `/usr/local/bin/claude`, `codex` / `gemini` CLIs at `${HOME}/.npm-global/bin/`; playwright now drives the desktop's real Chrome (synergy) |
            | LLM inference | `ollama` | CPU Ollama API on :11434; `ollama` host alias; `models` volume at `~/.ollama` |
            | Nested charly toolchain | `charly` + `container-nesting` + `golang` + `gh` | `charly box build`, nested rootless podman/buildah/skopeo, rootless libvirt VMs, gocryptfs encrypted volumes, socat relays |
            
            **Browser synergy:** `openclaw-full` ships `playwright` but deliberately omits a
            system browser (it's normally headless). Fusing it with `selkies-desktop`'s
            `chrome` + `chrome-cdp` stack gives playwright a real browser + CDP on :9222 —
            a pure enhancement, no conflict.
            
            ## Ports
            
            | Port | Service |
            |---|---|
            | 3000 | Selkies web UI (Traefik HTTPS, self-signed) |
            | 9222 | Chrome DevTools Protocol (via `cdp-proxy`) |
            | 9224 | `chrome-devtools-mcp` (Streamable HTTP) |
            | 2222 | `sshd-wrapper` (supervisord-managed) |
            | 18789 | OpenClaw gateway + Control UI |
            | 11434 | Ollama API |
            
            All six are distinct — no collisions. For multi-instance deployments alongside a
            running selkies/openclaw instance holding these host ports, remap via
            `charly config openclaw-desktop -p 3010:3000 -p 9232:9222 -p 9242:9224 -p 2232:2222 -p 18790:18789 -p 11444:11434`.
            
            ## Quick Start
            
            ```bash
            charly box build openclaw-desktop
            charly config openclaw-desktop
            charly start openclaw-desktop
            # Desktop:  https://localhost:3000 (accept the self-signed cert)
            # Gateway:  http://localhost:18789
            # Ollama:   curl http://localhost:11434/api/tags
            charly shell openclaw-desktop -c "ollama pull llama3"
            ```
            
            ## Nested rootless podman — how it works here
            
            See `/charly-distros:container-nesting` for the full kernel-level RCA. The short
            version: podman's rootless outer container injects `linux.maskedPaths`; the
            kernel's `mount_too_revealing()` then refuses any fresh `/proc` mount from the
            inner container. `unmask=/proc/*` tells podman not to emit those masks on the
            outer, so the inner `/proc` mount has nothing to mismatch with. Verified:
            
            ```bash
            charly shell openclaw-desktop -c 'podman run --rm quay.io/libpod/alpine:latest /bin/true'
            # zero extra caps, uid 1000
            ```
            
            ## Nested rootless VMs — how it works here
            
            See `/charly-infrastructure:virtualization`. `virtqemud --timeout 0` +
            `virtnetworkd --timeout 0` run as supervisord programs at uid 1000; libvirt
            `qemu:///session` keys off `$XDG_RUNTIME_DIR` and needs no CAP_SYS_ADMIN — only
            `/dev/kvm` passthrough.
            
            ```bash
            charly shell openclaw-desktop -c 'virsh -c qemu:///session list --all'
            ```
            
            ### Two-level nested-virtualization (end-to-end `charly vm` run-through)
            
            The full `charly vm build/create/ssh/stop/destroy` lifecycle completes inside the
            rootless pod, two levels of KVM nesting deep:
            
            1. Host (rootless podman, uid 1000) runs `charly-openclaw-desktop`.
            2. Inside it, `charly vm build <bootc-image> --transport containers-storage`
               auto-falls back to `engine.rootful=machine` (no host `sudo` in reach), which
               spawns a podman-machine VM (nested VM #1) via KVM passthrough and runs
               `bootc install to-disk`.
            3. `charly vm create <bootc-image> -i smoke --ssh-key generate` boots the produced
               qcow2 as a QEMU user-net VM (nested VM #2).
            4. `charly vm ssh <bootc-image> -i smoke -- uname -a` returns the guest kernel.
            5. `charly vm destroy --disk` cleans up.
            
            No `--privileged`, no `cap_add`, no seccomp relaxations beyond the baked
            `[unmask=/proc/*]`. Only `/dev/kvm` passthrough.
            
            ### Cross-storage loading for private bootc images
            
            The podman-machine in step 2 has its own rootful storage, separate from the
            outer container's nested rootless store. Load a private bootc image via the host:
            
            ```bash
            # on host
            podman save -o /tmp/bootc.tar ghcr.io/<registry>/<image>:latest
            charly cp openclaw-desktop /tmp/bootc.tar :/tmp/bootc.tar
            # inside the pod
            podman load -i /tmp/bootc.tar                              # nested rootless store
            podman --connection charly-root load -i /tmp/bootc.tar         # podman-machine rootful store
            charly vm build <image> --transport containers-storage
            ```
            
            ### Docker Hub rate-limit note
            
            For nested test harnesses, prefer `quay.io/libpod/alpine:latest` (unmetered)
            over `docker.io/library/alpine` — the baked `nested-podman-run` check already
            uses this mirror.
            
            ## What works from inside the desktop
            
            Every `charly` verb family runs as uid 1000 inside the container sandbox:
            `charly box build/generate/validate/merge/inspect/list/pull`,
            `charly check box/live/wl/libvirt` (cdp/vnc/mcp/record/kube/adb/appium/spice/dbus are declarative out-of-process verbs),
            `charly config/deploy/start/stop/update/remove/shell/cmd/service/status/logs`,
            `charly vm list/create/start/stop/ssh/destroy` (rootless libvirt session),
            `charly doctor/secrets/settings/alias`. The `charly` candy bakes only the binary — for
            build-mode verbs that read `charly.yml`, mount or `charly cp` the project in.
            
            ## Volumes
            
            - `chrome-data` → `~/.chrome-debug` (Chrome profile, from the chrome candy)
            - `selkies-config` → `~/.config/selkies`
            - `models` → `~/.ollama` (Ollama model storage)
            
            ## Verification
            
            ```bash
            charly status openclaw-desktop                       # all services RUNNING
            curl -k https://localhost:3000                   # selkies HTTPS 200
            curl -s http://localhost:18789                   # openclaw gateway
            curl -s http://localhost:11434/api/tags          # ollama API
            charly shell openclaw-desktop -c 'podman run --rm quay.io/libpod/alpine:latest /bin/true'
            ```
            
            A desktop screenshot is captured by a `wl: screenshot` step, run with
            `charly check live openclaw-desktop --filter wl`.
            
            The baked box-level `check:` carries the nested-rootless posture checks (subuid
            two-ranges, `newuidmap` cap, `policy.json`, containers.conf `userns=host`,
            `_CONTAINERS_USERNS_CONFIGURED` + `BUILDAH_ISOLATION` env), the deploy-scope
            nested-toolchain checks (nested `podman run`, `virsh` session list, in-container
            `charly version`/`charly doctor`), and the three fused services' liveness (gateway,
            ollama API, chrome-devtools-mcp port). The R10 bed is
            `check-openclaw-desktop-pod` (`charly check run check-openclaw-desktop-pod`).
            
            ## Key Candies
            
            - `/charly-selkies:selkies-desktop-layer` — the streaming desktop metalayer
            - `/charly-openclaw:openclaw-full` — gateway + the OpenClaw tools (claude-code/codex/gemini)
            - `/charly-ollama:ollama` — CPU/GPU-agnostic Ollama candy (GPU is box-level)
            - `/charly-tools:charly` — the full toolchain: charly binary + virtualization + gocryptfs + socat
            - `/charly-distros:container-nesting` — rootless nested podman recipe (RCA for `unmask=/proc/*`)
            - `/charly-infrastructure:virtualization` — supervisord-managed virtqemud/virtnetworkd
            - `/charly-distros:agent-forwarding` — GPG/SSH/direnv agent sockets
            
            ## Related Boxes
            
            - `/charly-openclaw:openclaw-full` — the headless gateway + tools WITHOUT the desktop / ollama / charly toolchain.
            - `/charly-openclaw:openclaw` — minimal gateway only.
            - `/charly-selkies:selkies-labwc` — the CPU streaming desktop WITHOUT openclaw / ollama / charly toolchain.
            - `/charly-selkies:selkies-labwc-nvidia` — GPU streaming desktop (base nvidia), no openclaw/ollama/charly toolchain.
            - `/charly-distros:charly-fedora` / `/charly-coder:charly-arch` — root-mode charly toolchain WITHOUT a streaming desktop.
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves:
            
            - Building, deploying, or troubleshooting the `openclaw-desktop` box.
            - Running `charly` verbs (image build, nested pods, rootless VMs) from inside a
              streaming desktop.
            - The OpenClaw gateway, AI CLIs, or a CPU Ollama running alongside a Wayland
              streaming desktop in one box.
            - The non-`--privileged` rootless-in-rootless nesting path on a CachyOS desktop.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries with `base:`/`from:`, build/validate/inspect/list)
            - `/charly-check:check` — declarative testing + the `check-openclaw-desktop-pod` R10 bed
            - `/charly-check:cdp`, `/charly-check:wl` — desktop automation on this box
            - `/charly-core:charly-config` — deploy setup (tunnel, port remapping, multi-instance, encrypted volumes)

selkies-kde-nvidia-skill:
    skill:
        name: selkies-kde-nvidia
        family: selkies
        owner: selkies-kde-nvidia
        description: |-
            The NVIDIA-GPU build of the KDE Plasma Selkies streaming desktop — full Plasma
            nested in pixelflux with REAL NVENC (cuda-arch-builder-compiled). MUST be invoked
            before building, deploying, or troubleshooting the selkies-kde-nvidia box.
        content: |-
            # Box: selkies-kde-nvidia
            
            The **NVIDIA-GPU build of the KDE Plasma flavor** (`/charly-selkies:selkies-kde`) —
            the same headless-pod KDE streaming desktop on the CachyOS GPU base
            (`cachyos.nvidia`), with pixelflux's **real NVENC** encoder compiled in. It is the
            KDE sibling of `/charly-selkies:selkies-labwc-nvidia` (labwc + NVENC); both use
            `builder.pixi: arch.cuda-arch-builder` so the `selkies` candy's `build.sh` compiles
            pixelflux's real `nvenc-sys` encoder (the stock `arch-builder` has no CUDA → an
            NVENC stub).
            
            Owned by the `opencharly/distro-cachyos` submodule (`box/cachyos`).
            
            ## Definition
            
            ```yaml
            selkies-kde-nvidia:
              base: nvidia                            # the CachyOS GPU base (cachyos.nvidia)
              build: [pac, aur]
              builder: {pixi: arch.cuda-arch-builder}   # nvcc + ffnvcodec headers → real NVENC
              candy:
                - agent-forwarding
                - selkies-kde-desktop
                - '@github.com/opencharly/pod-dbus'
                - charly
              port: ["3000:3000", "9222:9222", "9224:9224", "2222:2222"]
              platform: [linux/amd64]
            ```
            
            ## NVENC compile-proof (check-coverage)
            
            The box carries a build-scope `check:` check `pixelflux-nvenc-compiled` that
            greps the built pixelflux `.so` for `NvEncodeAPICreateInstance` (the NVENC SDK
            entry point the `nvenc-sys` crate binds). The stub build patches `nvenc-sys` out
            of pixelflux's Cargo.toml, so the symbol is absent → the check FAILS on a
            non-NVENC build. This is the regression-proof for the box's NVENC functionality
            (identical to `/charly-selkies:selkies-labwc-nvidia`).
            
            ## Ports / Encoder
            
            Same ports as `/charly-selkies:selkies-kde` (3000/9222/9224/2222). Encoder: real NVENC
            on the passed-through NVIDIA GPU (CDI `--device nvidia.com/gpu=all`); falls back to
            x264 when the GPU is unavailable.
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build selkies-kde-nvidia
            charly check box selkies-kde-nvidia            # build-scope incl. pixelflux-nvenc-compiled
            ```
            
            NVENC at runtime requires a passed-through NVIDIA GPU — proven on the
            `check-selkies-kde-nvidia-vm` bed (a `requires_exclusive: [nvidia-gpu]` passthrough
            VM that asserts real NVENC frame production; the preemption arbiter frees the GPU
            from any running holder). See `/charly-internals:disposable` + `/charly-check:check`.
            
            ## Related Skills
            
            - `/charly-selkies:selkies-kde` — the cpu/default sibling (shared definition + the KDE flavor framing).
            - `/charly-selkies:selkies-labwc-nvidia` — the labwc + NVENC sibling (same cuda-arch-builder + NVENC-compile proof).
            - `/charly-selkies:selkies-kde-desktop` — the KDE metalayer + the de-SDDM headless-Plasma design.
            - `/charly-distros:cachyos` — the CachyOS GPU base (`cachyos.nvidia`) + submodule.
            - `/charly-distros:nvidia`, `/charly-distros:cuda` — the GPU runtime + CUDA toolkit candies.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries with `base:`/`from:`, build/validate/inspect/list).
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems).

selkies-kde-skill:
